<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/logo.png" type="image/png">
    <title>Infinite Canvas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script src="/static/theme.js?v=20260509"></script>
    <style>
        :root {
            /* Mistral Color Palette - Light */
            --primary: #fa520f;
            --primary-deep: #cc3a05;
            --cream: #fff8e0;
            --cream-soft: #fffaeb;
            --beige-deep: #e6d5a8;
            --ink: #1f1f1f;
            --steel: #6a6a6a;
            --canvas: #ffffff;
            
            --bg: var(--cream-soft);
            --sidebar-bg: var(--cream-soft);
            --stage-bg: var(--canvas);
            --border: var(--beige-deep);
            --stage-border: var(--beige-deep);
            --text: var(--ink);
            --muted: var(--steel);
            --nav-hover-bg: var(--cream);
            --monitor-bg: rgba(255, 248, 224, 0.85);
            --monitor-border: var(--beige-deep);
            --monitor-shadow: rgba(0, 0, 0, 0.04);
            --divider: var(--beige-deep);
            --scrollbar: #d8d8d8;
            --scrollbar-hover: #c0c0c0;

            --fluid-ease: cubic-bezier(0.3, 0, 0, 1);
            --font-sans: 'Inter', sans-serif;
            --font-serif: 'Playfair Display', serif;
        }

        body.theme-dark {
            /* Mistral Color Palette - Dark */
            --bg: #1f1f1f;
            --sidebar-bg: #1f1f1f;
            --stage-bg: #1c1c1e;
            --border: #3d3d3d;
            --stage-border: rgba(255,255,255,0.08);
            --text: #ffffff;
            --muted: #a8a8a8;
            --nav-hover-bg: #2c2c2c;
            --monitor-bg: rgba(28, 28, 30, 0.85);
            --monitor-border: rgba(255,255,255,0.08);
            --monitor-shadow: rgba(0, 0, 0, 0.12);
            --divider: #3d3d3d;
            --scrollbar: #334155;
            --scrollbar-hover: #475569;
        }

        *::-webkit-scrollbar { width: 6px !important; height: 6px !important; background: transparent !important; }
        *::-webkit-scrollbar-track { background: transparent !important; border: none !important; }
        *::-webkit-scrollbar-thumb { background-color: var(--scrollbar) !important; border-radius: 8px !important; }

        body {
            background: var(--bg);
            font-family: var(--font-sans);
            overflow: hidden;
            height: 100vh;
            color: var(--text);
            transition: background 0.3s, color 0.3s;
            margin: 0;
        }

        .app-shell {
            display: flex;
            width: 100%;
            height: 100vh;
            background: var(--bg);
            position: relative;
            padding-bottom: 4px;
        }

        /* 侧边栏折叠逻辑 */
        .sidebar {
            width: 72px;
            min-width: 72px;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            padding: 32px 12px;
            transition: width 0.4s var(--fluid-ease), background 0.3s;
            z-index: 50;
            overflow: hidden;
        }

        .sidebar:hover {
            width: 240px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
            padding-left: 8px;
            white-space: nowrap;
        }

        .logo-text {
            font-family: var(--font-serif);
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.5px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .sidebar:hover .logo-text { opacity: 1; }

        .logo-icon {
            width: 24px;
            height: 24px;
            border: 2px solid var(--primary);
            border-radius: 6px;
            flex-shrink: 0;
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .nav-item {
            width: 100%;
            height: 44px;
            display: flex;
            align-items: center;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--muted);
            padding: 0 14px;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
        }

        .nav-item:hover { background: var(--nav-hover-bg); color: var(--text); }
        .nav-item.active { background: var(--primary); color: #ffffff; }

        .nav-icon { width: 20px; height: 20px; margin-right: 16px; flex-shrink: 0; }

        .nav-text {
            opacity: 0;
            transition: opacity 0.2s;
        }
        .sidebar:hover .nav-text { opacity: 1; }

        /* 侧边栏底部控制区域 */
        .sidebar-footer {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 12px 4px 0 4px;
            border-top: 1px solid var(--border);
        }

        .sidebar:not(:hover) .nano-monitor {
            padding: 8px 0;
            justify-content: center;
        }
        .sidebar:not(:hover) .nano-monitor .label-nano,
        .sidebar:not(:hover) .nano-monitor .divider,
        .sidebar:not(:hover) .nano-monitor .val-nano:first-of-type {
            display: none;
        }

        .nano-monitor {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--monitor-bg);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--monitor-border);
            transition: all 0.3s ease;
        }
        .nano-monitor.is-busy { background: var(--ink); color: #ffffff; border-color: var(--ink); }

        .stat-group { display: flex; align-items: center; gap: 4px; color: var(--text); }
        .is-busy .stat-group { color: #ffffff; }
        .label-nano { text-transform: uppercase; font-size: 9px; font-weight: 700; opacity: 0.5; }
        .val-nano { font-size: 12px; font-weight: 600; }

        .divider { width: 1px; height: 10px; background: var(--divider); }

        .theme-toggle {
            width: 100%;
            height: 40px;
            border-radius: 8px;
            background: var(--monitor-bg);
            border: 1px solid var(--monitor-border);
            color: var(--muted);
            display: flex;
            align-items: center;
            padding-left: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .theme-toggle:hover { background: var(--nav-hover-bg); color: var(--text); }
        .theme-toggle-text { margin-left: 16px; font-size: 13px; font-weight: 500; opacity: 0; transition: opacity 0.2s; }
        .sidebar:hover .theme-toggle-text { opacity: 1; }

        /* 主舞台区 */
        .stage-wrapper {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .stage {
            flex: 1;
            background: var(--stage-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--stage-border);
            position: relative;
            box-shadow: 0 4px 12px var(--monitor-shadow);
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            transform: scale(0.995);
            transition: all 0.4s var(--fluid-ease);
        }
        iframe.active { opacity: 1; transform: scale(1); }

        /* 底部日落条 */
        .sunset-stripe {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), #ffa110, #ffb83e, #ffd900, var(--cream));
            z-index: 1000;
        }
        body.theme-dark .sunset-stripe {
            background: linear-gradient(90deg, var(--primary), #cc3a05, #ffa110, #ffb83e, #1f1f1f);
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner-nano { width: 10px; height: 10px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        .is-busy .spinner-nano { display: block; }
        .is-busy .pulse-dot { display: none; }
        .pulse-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }
    </style>
</head>

<body>

    <div class="app-shell">
        <aside class="sidebar">
            <div class="logo-area">
                <div class="logo-icon"></div>
                <span class="logo-text">Editorial Canvas</span>
            </div>

            <nav>
                <div class="nav-item active" onclick="switchUI(this, 'zimage')">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.587-1.587a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                    <span class="nav-text">文生图 (Generate)</span>
                </div>
                <div class="nav-item" onclick="switchUI(this, 'enhance')">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                    <span class="nav-text">细节增强 (Enhance)</span>
                </div>
                <div class="nav-item" onclick="switchUI(this, 'klein')">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                    <span class="nav-text">图片编辑 (Edit)</span>
                </div>
                <div class="nav-item" onclick="switchUI(this, 'angle')">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                        <line x1="12" y1="22.08" x2="12" y2="12"></line>
                    </svg>
                    <span class="nav-text">角度控制 (Angle)</span>
                </div>

                <div style="width:100%;height:1px;background:var(--border);margin:8px 0;"></div>

                <div class="nav-item" onclick="switchUI(this, 'online')">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2z"></path>
                        <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                    </svg>
                    <span class="nav-text">在线生图 (Online)</span>
                </div>
                <div class="nav-item" onclick="switchUI(this, 'gpt-chat')">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span class="nav-text">GPT 对话 (Chat)</span>
                </div>
                <div class="nav-item" onclick="switchUI(this, 'canvas')">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <span class="nav-text">无限画布 (Canvas)</span>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="nano-monitor" id="nano-monitor">
                    <div class="stat-group">
                        <div class="pulse-dot animate-pulse"></div>
                        <div class="spinner-nano"></div>
                        <span class="label-nano">Users</span>
                        <span id="online-val" class="val-nano">1</span>
                    </div>
                    <div class="divider"></div>
                    <div class="stat-group">
                        <span class="label-nano">Queue</span>
                        <span id="queue-val" class="val-nano">0</span>
                    </div>
                </div>

                <button class="theme-toggle" onclick="toggleTheme()" id="theme-toggle-btn">
                    <svg id="icon-moon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 flex-shrink-0">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                    <svg id="icon-sun" style="display:none" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 flex-shrink-0">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <span class="theme-toggle-text">Appearance</span>
                </button>
            </div>
        </aside>

        <main class="stage-wrapper">
            <div class="stage">
                <iframe id="frame-zimage" src="/static/zimage.html?v=31" class="active"></iframe>
                <iframe id="frame-enhance" data-src="/static/enhance.html?v=31"></iframe>
                <iframe id="frame-klein" data-src="/static/klein.html?v=31"></iframe>
                <iframe id="frame-angle" data-src="/static/angle.html?v=31"></iframe>
                <iframe id="frame-online" data-src="/static/online.html?v=1"></iframe>
                <iframe id="frame-gpt-chat" data-src="/static/gpt-chat.html?v=1"></iframe>
                <iframe id="frame-canvas" data-src="/static/canvas.html?v=1"></iframe>
            </div>
        </main>
        
        <div class="sunset-stripe"></div>
    </div>

    <script>
        function generateUUID() {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                try { return crypto.randomUUID(); } catch (e) { }
            }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        const CID = localStorage.getItem("client_id") || generateUUID();
        localStorage.setItem("client_id", CID);

        function switchUI(el, id) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
            const target = document.getElementById('frame-' + id);
            target.classList.add('active');
            if (!target.src) target.src = target.dataset.src;
            syncThemeToFrame(target);
        }

        async function syncStatus() {
            try {
                const res = await fetch(`/api/queue_status?client_id=${CID}`);
                const data = await res.json();
                const monitor = document.getElementById('nano-monitor');
                const queueVal = document.getElementById('queue-val');
                const total = data.total || 0;
                const pos = data.position || 0;
                if (pos > 0) {
                    monitor.classList.add('is-busy');
                    queueVal.innerText = `${pos}/${total}`;
                } else {
                    monitor.classList.remove('is-busy');
                    queueVal.innerText = total > 0 ? total : '0';
                }
            } catch (e) { }
        }

        const host = window.location.host;
        if (host) {
            const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
            const ws = new WebSocket(`${protocol}://${host}/ws/stats?client_id=${CID}`);
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'stats') {
                    document.getElementById('online-val').innerText = data.online_count;
                } else if (data.type === 'cloud_status') {
                    const iframe = document.querySelector('iframe.active');
                    if (iframe && iframe.contentWindow) {
                        iframe.contentWindow.postMessage(data, '*');
                    }
                }
            };
            setInterval(syncStatus, 2000);
        }

        function syncThemeToFrame(iframe) {
            const theme = (window.StudioTheme || {get: () => 'light'}).get();
            try {
                if (iframe && iframe.contentWindow) {
                    iframe.contentWindow.postMessage({ type: 'studio-theme', theme }, '*');
                }
            } catch (e) {}
        }

        function broadcastTheme(theme) {
            if (window.StudioTheme) { window.StudioTheme.set(theme); }
            document.querySelectorAll('iframe').forEach(f => syncThemeToFrame(f));
            updateThemeIcon(theme);
        }

        function updateThemeIcon(theme) {
            const moon = document.getElementById('icon-moon');
            const sun = document.getElementById('icon-sun');
            if (theme === 'dark') {
                moon.style.display = 'none';
                sun.style.display = 'block';
            } else {
                moon.style.display = 'block';
                sun.style.display = 'none';
            }
        }

        function toggleTheme() {
            const current = window.StudioTheme ? window.StudioTheme.get() : 'light';
            broadcastTheme(current === 'dark' ? 'light' : 'dark');
        }

        window.addEventListener('studio-theme-change', (e) => {
            updateThemeIcon(e.detail.theme);
        });

        window.addEventListener('DOMContentLoaded', () => {
            const theme = window.StudioTheme ? window.StudioTheme.get() : 'light';
            updateThemeIcon(theme);
        });

        document.querySelectorAll('iframe').forEach(f => {
            f.addEventListener('load', () => syncThemeToFrame(f));
        });
    </script>
</body>
</html>
