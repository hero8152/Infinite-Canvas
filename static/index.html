<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
    <title>Feebee Studios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/design-system.css?v=24">
    <script src="/static/theme.js?v=20260514-gallery-icon"></script>
    <script src="/static/i18n.js?v=1"></script>
    <style>
        /* ===== 项目级 shell 特化（设计 token 全部来自 design-system.css） ===== */

        body {
            margin: 0;
            overflow: hidden;
            overflow-x: hidden;
            height: 100vh;
            height: 100dvh;
            width: 100%;
            font-family: var(--font-sans);
            color: var(--ink);
        }

        .app-shell {
            display: flex;
            width: 100%;
            min-width: 0;
            height: 100vh;
            height: 100dvh;
            position: relative;
            padding-bottom: 4px;
            background-color: var(--bg);
            background-image:
                linear-gradient(to right, rgba(230, 213, 168, 0.55) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(230, 213, 168, 0.55) 1px, transparent 1px);
            background-size: 80px 80px;
        }

        body.studio-theme-dark .app-shell {
            background-color: var(--dark-bg);
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        /* ----- Sidebar：默认 72px，hover 展开到 240px ----- */
        .sidebar {
            width: 72px;
            min-width: 72px;
            height: 100%;
            max-height: 100%;
            background: transparent;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            padding: 24px 12px;
            transition: width 0.3s ease;
            z-index: 50;
            overflow: hidden;
            box-sizing: border-box;
            min-height: 0;
        }
        .sidebar:hover { width: 240px; }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            padding-left: 4px;
            white-space: nowrap;
        }
        .logo-icon {
            width: 28px;
            height: 28px;
            color: var(--primary);
            flex-shrink: 0;
        }
        .logo-text {
            font-family: var(--font-sans);
            font-size: 18px;
            font-weight: 500;
            letter-spacing: -0.01em;
            color: var(--ink);
            opacity: 0;
            transition: opacity 0.2s;
        }
        .sidebar:hover .logo-text { opacity: 1; }

        nav {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: 12px;
            scrollbar-width: none;
        }
        nav::-webkit-scrollbar { display: none; }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            height: 40px;
            padding: 0 12px;
            background: transparent;
            color: var(--muted);
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: 0;
            cursor: pointer;
            white-space: nowrap;
            text-align: left;
            transition: none;
        }
        .nav-item:hover {
            background: var(--bg-2);
            color: var(--ink);
        }
        .nav-item.active {
            background: var(--bg-2);
            color: var(--ink);
        }
        .nav-item .nav-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            color: currentColor;
        }
        .nav-item.active .nav-icon { color: var(--primary); }
        .nav-item .nav-text {
            opacity: 0;
            transition: opacity 0.2s;
        }
        .sidebar:hover .nav-item .nav-text { opacity: 1; }

        .nav-divider {
            width: 100%;
            height: 1px;
            background: var(--border);
            margin: 8px 0;
        }

        /* ----- Sidebar 底部：nano monitor + theme toggle ----- */
        .sidebar-footer {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            margin-top: auto;
        }

        .nano-monitor {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            background: #0f0f0f;     /* 硬编码：dark mode token 翻转时不变白 */
            color: #ffffff;
            font-family: var(--font-mono);
            font-size: 11px;
            border-radius: 0;
        }
        body.studio-theme-dark .nano-monitor {
            background: #161618;
            color: #ffffff;
            border: 1px solid #2a2a2d;
        }
        .sidebar:not(:hover) .nano-monitor {
            justify-content: center;
            padding: 8px 0;
        }
        .sidebar:not(:hover) .nano-monitor .nano-label,
        .sidebar:not(:hover) .nano-monitor .nano-divider,
        .sidebar:not(:hover) .nano-monitor #queue-val {
            display: none;
        }

        .nano-monitor .nano-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nano-monitor .nano-label {
            color: rgba(255, 255, 255, 0.55);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .nano-monitor .nano-value { font-weight: 500; }
        .nano-monitor .nano-divider {
            width: 1px;
            height: 10px;
            background: rgba(255, 255, 255, 0.2);
        }
        .nano-monitor.is-busy { background: var(--primary-deep); }

        .sidebar-action {
            display: flex;
            align-items: center;
            gap: 12px;
            height: 36px;
            padding: 0 12px;
            background: var(--bg-2);
            color: var(--ink);
            border: none;
            border-radius: 0;
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: none;
            width: 100%;
        }
        .sidebar-action:hover { background: var(--bg); }
        .sidebar-action.active { background: var(--bg-2); color: var(--ink); }
        body.studio-theme-dark .sidebar-action { background: var(--dark-elev); color: var(--dark-text); }
        body.studio-theme-dark .sidebar-action:hover { background: var(--dark-surface); }
        body.studio-theme-dark .sidebar-action.active { background: var(--dark-surface); }
        .sidebar-action .nav-icon { width: 16px; height: 16px; color: var(--primary); flex-shrink: 0; }
        .sidebar-action-text {
            opacity: 0;
            transition: opacity 0.2s;
        }
        .sidebar:hover .sidebar-action-text { opacity: 1; }
        .sidebar-action-status {
            width: 6px;
            height: 6px;
            margin-left: auto;
            background: transparent;
            border: 1px solid var(--border-strong);
            opacity: 0;
            flex-shrink: 0;
        }
        .sidebar:hover .sidebar-action-status { opacity: 1; }
        .sidebar-action-status.is-on {
            background: var(--primary);
            border-color: var(--primary);
        }

        /* ----- Stage（主舞台 iframe 容器） ----- */
        .stage-wrapper {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            position: relative;
            min-width: 0;
            overflow: hidden;
        }
        .stage {
            flex: 1;
            position: relative;
            background: var(--stage-bg);
            border: 1px solid var(--border);
            border-radius: 8px;     /* §8.1 唯一允许 8px 圆角的容器 */
            overflow: hidden;
            box-shadow: none;
        }
        body.studio-theme-dark .stage { border-color: var(--dark-border); }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            visibility: hidden;
            transition: none;
        }
        iframe.active {
            opacity: 1;
            visibility: visible;
        }

        /* ----- 底部 Sunset Stripe ----- */
        .sunset-stripe {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg,
                var(--sunset-1) 0%,
                var(--sunset-2) 18%,
                var(--sunset-3) 38%,
                var(--sunset-4) 58%,
                var(--sunset-5) 78%,
                var(--sunset-6) 100%);
            z-index: 1000;
        }
        body.studio-theme-dark .sunset-stripe {
            background: linear-gradient(90deg,
                var(--sunset-2) 0%,
                var(--sunset-1) 50%,
                var(--ink-2) 100%);
        }
    </style>
</head>

<body>

    <div class="app-shell">
        <aside class="sidebar">
            <div class="logo-area">
                <svg class="logo-icon pixel-icon" aria-hidden="true">
                    <use href="#ic-brand"/>
                </svg>
                <span class="logo-text">Feebee Studios</span>
            </div>

            <nav>
                <button class="nav-item active" onclick="switchUI(this, 'zimage')">
                    <svg class="nav-icon pixel-icon"><use href="#nav-zimage"/></svg>
                    <span class="nav-text">Text to image</span>
                </button>
                <button class="nav-item" onclick="switchUI(this, 'enhance')">
                    <svg class="nav-icon pixel-icon"><use href="#nav-enhance"/></svg>
                    <span class="nav-text">Detail enhance</span>
                </button>
                <button class="nav-item" onclick="switchUI(this, 'klein')">
                    <svg class="nav-icon pixel-icon"><use href="#nav-klein"/></svg>
                    <span class="nav-text">Image edit</span>
                </button>
                <button class="nav-item" onclick="switchUI(this, 'angle')">
                    <svg class="nav-icon pixel-icon"><use href="#nav-angle"/></svg>
                    <span class="nav-text">Angle control</span>
                </button>

                <div class="nav-divider"></div>

                <button class="nav-item" onclick="switchUI(this, 'online')">
                    <svg class="nav-icon pixel-icon"><use href="#nav-online"/></svg>
                    <span class="nav-text">Online generate</span>
                </button>
                <button class="nav-item" onclick="switchUI(this, 'flatlay')">
                    <svg class="nav-icon pixel-icon"><use href="#nav-flatlay"/></svg>
                    <span class="nav-text">Flatlay</span>
                </button>
                <button class="nav-item" onclick="switchUI(this, 'batch-tryon')">
                    <svg class="nav-icon pixel-icon"><use href="#nav-batch"/></svg>
                    <span class="nav-text">Batch try-on</span>
                </button>
                <button class="nav-item" onclick="switchUI(this, 'gpt-chat')">
                    <svg class="nav-icon pixel-icon"><use href="#nav-chat"/></svg>
                    <span class="nav-text">Chat</span>
                </button>
                <button class="nav-item" onclick="switchUI(this, 'canvas')">
                    <svg class="nav-icon pixel-icon"><use href="#nav-canvas"/></svg>
                    <span class="nav-text">Canvas</span>
                </button>
                <button class="nav-item" onclick="switchUI(this, 'gallery')">
                    <svg class="nav-icon pixel-icon" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
                        <rect x="2" y="2" width="4" height="4" fill="currentColor"/>
                        <rect x="7" y="2" width="4" height="4" fill="currentColor"/>
                        <rect x="12" y="2" width="2" height="4" fill="currentColor"/>
                        <rect x="2" y="7" width="4" height="4" fill="currentColor"/>
                        <rect x="7" y="7" width="4" height="4" fill="currentColor"/>
                        <rect x="12" y="7" width="2" height="4" fill="currentColor"/>
                        <rect x="2" y="12" width="4" height="2" fill="currentColor"/>
                        <rect x="7" y="12" width="4" height="2" fill="currentColor"/>
                        <rect x="13" y="13" width="2" height="2" fill="currentColor"/>
                    </svg>
                    <span class="nav-text">Gallery</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <div class="nano-monitor" id="nano-monitor">
                    <div class="nano-group">
                        <span class="pixel-dot-pulse" aria-hidden="true"><span></span><span></span><span></span></span>
                        <span class="nano-label">Users</span>
                        <span class="nano-value" id="online-val">1</span>
                    </div>
                    <span class="nano-divider"></span>
                    <div class="nano-group">
                        <span class="nano-label">Queue</span>
                        <span class="nano-value" id="queue-val">0</span>
                    </div>
                </div>

                <button class="sidebar-action" data-route="api-config" onclick="switchUI(this, 'api-config')" id="api-keys-btn" type="button">
                    <svg class="nav-icon pixel-icon"><use href="#key"/></svg>
                    <span class="sidebar-action-text">API / Models</span>
                    <span class="sidebar-action-status" id="api-keys-status" aria-hidden="true"></span>
                </button>

                <button class="sidebar-action" data-route="comfyui-settings" onclick="switchUI(this, 'comfyui-settings')" type="button">
                    <svg class="nav-icon pixel-icon"><use href="#tool-workflow"/></svg>
                    <span class="sidebar-action-text">ComfyUI</span>
                </button>

                <button class="sidebar-action" onclick="toggleTheme()" id="theme-toggle-btn" type="button">
                    <svg id="icon-moon" class="nav-icon pixel-icon"><use href="#nav-moon"/></svg>
                    <svg id="icon-sun" class="nav-icon pixel-icon" style="display:none"><use href="#nav-sun"/></svg>
                    <span class="sidebar-action-text">Appearance</span>
                </button>
            </div>
        </aside>

        <main class="stage-wrapper">
            <div class="stage">
                <iframe id="frame-zimage" src="/static/zimage.html?v=32" class="active"></iframe>
                <iframe id="frame-enhance" data-src="/static/enhance.html?v=31"></iframe>
                <iframe id="frame-klein" data-src="/static/klein.html?v=31"></iframe>
                <iframe id="frame-angle" data-src="/static/angle.html?v=20260514-cta"></iframe>
                <iframe id="frame-online" data-src="/static/online.html?v=1"></iframe>
                <iframe id="frame-flatlay" data-src="/static/flatlay.html?v=4"></iframe>
                <iframe id="frame-batch-tryon" data-src="/static/batch-tryon.html?v=20260514-batch-state-ux"></iframe>
                <iframe id="frame-gpt-chat" data-src="/static/gpt-chat.html?v=1"></iframe>
                <iframe id="frame-canvas" data-src="/static/canvas.html?v=20260514-dnd"></iframe>
                <iframe id="frame-gallery" data-src="/static/gallery.html?v=3"></iframe>
                <iframe id="frame-api-config" data-src="/static/api-providers.html?v=1"></iframe>
                <iframe id="frame-comfyui-settings" data-src="/static/comfyui-settings.html?v=1"></iframe>
            </div>
        </main>

        <div class="sunset-stripe"></div>
    </div>

    <script>
        function generateUUID() {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                try { return crypto.randomUUID(); } catch (e) { }
            }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        const CID = localStorage.getItem("client_id") || generateUUID();
        localStorage.setItem("client_id", CID);
        const COMFLY_TOKEN_KEY = 'comfly_token';
        const MODELSCOPE_TOKEN_KEY = 'modelscope_api_token';
        const PROVIDER_MODEL_KEYS = 'provider_model_keys';

        function hasApiKeys() {
            const modelKeys = (() => {
                try { return JSON.parse(localStorage.getItem(PROVIDER_MODEL_KEYS) || '{}'); }
                catch (e) { return {}; }
            })();
            const hasModelKey = Object.values(modelKeys || {}).some(group => (
                group && typeof group === 'object' && Object.values(group).some(value => String(value || '').trim())
            ));
            return Boolean((localStorage.getItem(COMFLY_TOKEN_KEY) || '').trim()
                || (localStorage.getItem(MODELSCOPE_TOKEN_KEY) || '').trim()
                || hasModelKey);
        }

        function updateApiKeyStatus() {
            const status = document.getElementById('api-keys-status');
            status?.classList.toggle('is-on', hasApiKeys());
        }

        function switchUI(el, id) {
            document.querySelectorAll('.nav-item, .sidebar-action[data-route]').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
            const target = document.getElementById('frame-' + id);
            target.classList.add('active');
            const desiredSrc = target.dataset.src || '';
            const currentSrc = target.getAttribute('src') || '';
            if (!currentSrc || (desiredSrc && currentSrc !== desiredSrc)) {
                target.src = desiredSrc;
            }
            syncThemeToFrame(target);
        }
        window.addEventListener('message', event => {
            if (event.data?.type === 'providers-changed') {
                document.getElementById('frame-canvas')?.contentWindow?.postMessage(event.data, '*');
            }
        });

        async function syncStatus() {
            try {
                const res = await fetch(`/api/queue_status?client_id=${CID}`);
                const data = await res.json();
                const monitor = document.getElementById('nano-monitor');
                const queueVal = document.getElementById('queue-val');
                const total = data.total || 0;
                const pos = data.position || 0;
                if (pos > 0) {
                    monitor.classList.add('is-busy');
                    queueVal.innerText = `${pos}/${total}`;
                } else {
                    monitor.classList.remove('is-busy');
                    queueVal.innerText = total > 0 ? total : '0';
                }
            } catch (e) { }
        }

        const host = window.location.host;
        if (host) {
            const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
            const ws = new WebSocket(`${protocol}://${host}/ws/stats?client_id=${CID}`);
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'stats') {
                    document.getElementById('online-val').innerText = data.online_count;
                } else if (data.type === 'cloud_status' || data.type === 'task_status') {
                    const iframe = document.querySelector('iframe.active');
                    if (iframe && iframe.contentWindow) {
                        iframe.contentWindow.postMessage(data, '*');
                    }
                }
            };
            setInterval(syncStatus, 2000);
        }

        function syncThemeToFrame(iframe) {
            const theme = (window.StudioTheme || { get: () => 'light' }).get();
            try {
                if (iframe && iframe.contentWindow) {
                    iframe.contentWindow.postMessage({ type: 'studio-theme', theme }, '*');
                }
            } catch (e) { }
        }

        function broadcastTheme(theme) {
            if (window.StudioTheme) { window.StudioTheme.set(theme); }
            document.querySelectorAll('iframe').forEach(f => syncThemeToFrame(f));
            updateThemeIcon(theme);
        }

        function updateThemeIcon(theme) {
            const moon = document.getElementById('icon-moon');
            const sun = document.getElementById('icon-sun');
            if (theme === 'dark') {
                moon.style.display = 'none';
                sun.style.display = 'block';
            } else {
                moon.style.display = 'block';
                sun.style.display = 'none';
            }
        }

        function toggleTheme() {
            const current = window.StudioTheme ? window.StudioTheme.get() : 'light';
            broadcastTheme(current === 'dark' ? 'light' : 'dark');
        }

        window.addEventListener('studio-theme-change', (e) => {
            updateThemeIcon(e.detail.theme);
        });

        function initShell() {
            const theme = window.StudioTheme ? window.StudioTheme.get() : 'light';
            updateThemeIcon(theme);
            updateApiKeyStatus();
            if (window.location.search.includes('api-models') || window.location.search.includes('settings')) {
                const apiButton = document.getElementById('api-keys-btn');
                if (apiButton) switchUI(apiButton, 'api-config');
            }
        }
        if (document.readyState === 'loading') {
            window.addEventListener('DOMContentLoaded', initShell);
        } else {
            initShell();
        }

        window.addEventListener('storage', updateApiKeyStatus);
        window.addEventListener('message', event => {
            if (event.data?.type === 'api-config-updated') updateApiKeyStatus();
        });

        document.querySelectorAll('iframe').forEach(f => {
            f.addEventListener('load', () => syncThemeToFrame(f));
        });
    </script>
</body>

</html>
