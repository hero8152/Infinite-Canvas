<body>
    <div class="container-box min-h-screen flex flex-col">
        <header class="flex justify-between items-end mb-16">
            <div class="space-y-1">
                <h1 class="text-4xl font-extrabold tracking-tighter italic" data-i18n="online.title">在线生图</h1>

                            <button id="referenceSelectBtn" type="button" class="hidden px-3 py-1 rounded-full border border-gray-200 text-[9px] font-black uppercase tracking-widest text-gray-500 hover:text-black hover:border-black transition-colors">Select</button>
                            <button id="selectAllReferencesBtn" type="button" class="hidden px-3 py-1 rounded-full border border-gray-200 text-[9px] font-black uppercase tracking-widest text-gray-500 hover:text-black hover:border-black transition-colors">All</button>

                    </div>
                    <div id="referenceGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-4"></div>

                </section>

                <div class="tool-panel">
                    <div class="control-label">
                        <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i>
                        <span data-i18n="online.model">Model</span>

                    <div class="size-row">
                        <label class="size-field">
                            <select id="providerSelect" class="size-select" onchange="setProvider(this.value)"></select>
                        </label>
                        <label class="size-field">
                            <select id="modelSelect" class="size-select" onchange="setModel(this.value)"></select>

                    <div id="adaptiveExtras" class="size-row" style="margin-top:2px;">

                            </span>
                        </label>
                        <label id="ratioField" class="size-field">
                            <select id="ratioSelect" class="size-select" onchange="setRatio(this.value)">
                                <option value="" data-i18n="online.emptyRatio">比例为空</option>
                                <option value="square" selected data-i18n="online.square">1:1 方图</option>
                                <option value="portrait" data-i18n="online.portrait">2:3 竖图</option>
                                <option value="landscape" data-i18n="online.landscape">3:2 横图</option>
                                <option value="portrait43">3:4 竖图</option>
                                <option value="landscape43">4:3 横图</option>
                                <option value="story" data-i18n="online.story">9:16 竖屏</option>
                                <option value="wide" data-i18n="online.wide">16:9 宽屏</option>
                                <option value="custom" data-i18n="online.customRatio">自定义比例</option>
                            </select>
                            <span class="size-pair">
                                <input id="ratioCustomWidth" class="size-custom" type="number" min="1" step="1" placeholder="宽" data-i18n-placeholder="online.ratioWidth" oninput="setCustomRatio()">
                                <input id="ratioCustomHeight" class="size-custom" type="number" min="1" step="1" placeholder="高" data-i18n-placeholder="online.ratioHeight" oninput="setCustomRatio()">
                            </span>
                        </label>
                    </div>
                </div>

                <button id="genBtn" onclick="submitImage()" class="glass-btn w-full py-5 text-white rounded-3xl font-bold flex items-center justify-center gap-3 shadow-lg">
                    <i data-lucide="zap" class="w-4 h-4 text-yellow-400"></i>
                    <span class="tracking-[0.3em] text-[11px] uppercase" data-i18n="online.generate">Generate</span>
                </button>
            </div>

            <div class="lg:col-span-7 online-result-column">
                <div id="resultBox" class="result-frame min-h-[500px] lg:h-full flex items-center justify-center relative overflow-hidden">
                    <div id="placeholder" class="text-center space-y-4 opacity-20"><i data-lucide="layout" class="w-12 h-12 mx-auto stroke-[1px]"></i><p class="text-[10px] font-black tracking-[0.5em] uppercase" data-i18n="online.canvasReady">Canvas Ready</p></div>
                    <div id="loader" class="online-generating-overlay hidden" aria-live="polite">
                        <div class="online-generating-panel">
                            <div class="online-generating-spinner" aria-hidden="true"></div>
                            <p id="onlinePreviewStatus" class="online-generating-status" data-i18n="online.generating">Generating</p>
                            <p id="onlinePreviewElapsed" class="online-generating-time">00:00</p>
                            <p id="onlinePreviewPrompt" class="online-generating-prompt"></p>
                        </div>
                    </div>
                    <img id="outputImg" class="hidden w-full h-full object-contain p-8 cursor-zoom-in" onclick="zoomImage()">
                    <div id="onlinePreviewMeta" class="online-generation-meta online-preview-meta hidden" aria-label="生成信息"></div>
                    <a id="downloadBtn" href="#" download class="hidden absolute top-8 right-8 w-12 h-12 bg-white/90 shadow-2xl rounded-2xl flex items-center justify-center hover:bg-black hover:text-white"><i data-lucide="download" class="w-4 h-4"></i></a>
                    <div id="onlineHistoryRail" class="online-history-rail hidden" aria-label="生成历史预览">
                        <button id="onlineHistoryRailPrev" type="button" class="online-history-rail-btn" aria-label="上一组">
                            <i data-lucide="chevron-left" class="w-4 h-4"></i>
                        </button>
                        <div id="onlineHistoryRailTrack" class="online-history-rail-track"></div>
                        <button id="onlineHistoryRailNext" type="button" class="online-history-rail-btn" aria-label="下一组">
                            <i data-lucide="chevron-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <section class="mt-32">
            <div class="flex items-center gap-6 mb-12"><h2 class="text-[11px] font-black uppercase tracking-[0.5em]" data-i18n="online.archives">Archives</h2><div class="h-px flex-1 bg-gray-100"></div></div>
            <div id="masonry" class="masonry-grid"></div>
            <div id="loadMoreTrigger" class="py-20 text-center text-gray-300 text-[10px] font-bold uppercase tracking-widest cursor-pointer hover:text-black">Load More Archive</div>
        </section>
    </div>

    <div id="onlineTaskDock" class="online-task-dock" aria-live="polite">
        <div class="online-task-panel" aria-label="生成任务栏">
            <div class="online-task-head">

                    <i data-lucide="list-checks" class="w-4 h-4"></i>

                <span id="onlineTaskCountText" class="online-task-count">0 active</span>

    <script>
        lucide.createIcons();
        function tr(key){ return window.StudioI18n ? StudioI18n.t(key) : key; }

            if(lang && window.StudioI18n) StudioI18n.set(lang);
            document.title = tr('online.title');
            const loader = document.getElementById('loadMoreTrigger');
            if(loader && !isLoading) loader.innerText = tr('online.loadMore');
        }
        window.addEventListener('message', event => {
            if(event.data?.type === 'studio-lang') applyLanguage(event.data.lang);
            if(event.data?.type === 'canvas.preferences' && event.data.values?.online_generation_settings){
                const settings = parseOnlineSettings(event.data.values.online_generation_settings);
                if(settings){
                    localStorage.setItem(ONLINE_SETTINGS_STORAGE_KEY, JSON.stringify(settings));
                    applyOnlineSettings(settings, onlineModelsInitialized);
                }
            }
            // API 设置页通过 postMessage 通知平台/模型变更（iframe 内嵌场景）

                const nodes = Array.from(grid.querySelectorAll('[data-ref-motion-key]'));
                nodes.forEach(node => {
                    const key = node.dataset.refMotionKey;
                    const before = motion.snapshot[key];
                    const after = node.getBoundingClientRect();
                    if(before){
                        const deltaX = before.left - after.left;
                        const deltaY = before.top - after.top;
                        if(deltaX || deltaY){
                            node.animate([
                                { transform:`translate(${deltaX}px, ${deltaY}px)` },
                                { transform:'translate(0, 0)' }

                                duration:280,
                                easing:'cubic-bezier(0.22, 1, 0.36, 1)'

                const card = event.target.closest('[data-ref-index]');

                const index = Number(card.dataset.refIndex);
                if(index <= 0){
                    event.preventDefault();
                    return;
                }
                referenceDragIndex = index;
                referenceDropIndex = -1;
                event.dataTransfer.effectAllowed = 'move';
                event.dataTransfer.setData('text/plain', String(referenceDragIndex));
                clearReferenceDragDecor();
                card.classList.add('opacity-60', 'scale-[0.98]', 'ref-dragging');
            });
            grid.addEventListener('dragend', () => {
                referenceDragIndex = -1;
                referenceDropIndex = -1;
                referenceSuppressClickUntil = Date.now() + 180;
                clearReferenceDragDecor();
            });
            grid.addEventListener('dragover', event => {
                const files = imageFilesFromList(event.dataTransfer?.files);
                if(referenceSelectionMode){
                    if(files.length) event.preventDefault();
                    return;
                }
                if(referenceDragIndex >= 0){
                    const targetCard = event.target.closest('[data-ref-index]');
                    const addCard = event.target.closest('[data-add-ref]');
                    const targetIndex = targetCard ? Number(targetCard.dataset.refIndex) : -1;

                if(!grid.contains(event.relatedTarget)) setDragState(false);

            grid.addEventListener('drop', event => {
                if(referenceSelectionMode){
                    if(imageFilesFromList(event.dataTransfer?.files).length) event.preventDefault();
                    return;

                if(referenceDragIndex >= 0){
                    const targetCard = event.target.closest('[data-ref-index]');
                    const addCard = event.target.closest('[data-add-ref]');
                    event.preventDefault();
                    const fromIndex = referenceDragIndex;
                    const targetIndex = targetCard ? Number(targetCard.dataset.refIndex) : -1;
                    const toIndex = targetCard ? targetIndex : (addCard ? refs.length : -1);
                    referenceDragIndex = -1;
                    referenceDropIndex = -1;
                    referenceSuppressClickUntil = Date.now() + 180;

                    return;
                }
                const files = imageFilesFromList(event.dataTransfer?.files);
                if(!files.length || referenceUploading) return;
                event.preventDefault();
                setDragState(false);
                addReferenceFiles(files).catch(handleReferenceError);
            });
            input.addEventListener('change', async event => {
                const files = imageFilesFromList(event.target.files);
                const replaceIndex = pendingReplaceIndex;
                pendingReplaceIndex = -1;
                event.target.value = '';
                if(!files.length) return;
                try {
                    if(replaceIndex >= 0){
                        await replaceReferenceFile(files[0], replaceIndex);

                    await addReferenceFiles(files);
                } catch(err) {
                    handleReferenceError(err);
                }
            });
        }
        function openReferencePicker(replaceIndex = -1){
            const input = document.getElementById('referenceFileInput');
            if(!input) return;
            if(referenceUploading || referenceSelectionMode) return;
            pendingReplaceIndex = Number.isInteger(replaceIndex) ? replaceIndex : -1;
            input.multiple = pendingReplaceIndex < 0;
            input.value = '';
            if(pendingReplaceIndex < 0 && refs.length >= REFERENCE_IMAGE_MAX){
                alert(`最多支持 ${REFERENCE_IMAGE_MAX} 张参考图`);

        async function addReferenceFiles(fileList){
            normalizeReferenceState();
            if(referenceUploading || referenceSelectionMode) return;
            const files = imageFilesFromList(fileList);
            if(!files.length) return;
            const remaining = Math.max(0, REFERENCE_IMAGE_MAX - refs.length);
            if(!remaining){
                alert(`最多支持 ${REFERENCE_IMAGE_MAX} 张参考图`);
                return;
            }
            const accepted = files.slice(0, remaining);
            setReferenceUploading(true);
            try {
                const uploaded = await uploadReferenceFiles(accepted);
                clearReferenceSelection();
                refs.push(...uploaded);
                refDims.push(...new Array(uploaded.length).fill(null));
                renderReferenceGrid();
                updateSizeUI();
                updateReferenceUIState();
                uploaded.forEach((ref, index) => loadReferenceDimension(ref.url, refs.length - uploaded.length + index));
                if(files.length > accepted.length) alert(`最多支持 ${REFERENCE_IMAGE_MAX} 张参考图，已为你保留前 ${REFERENCE_IMAGE_MAX} 张。`);
            } finally {
                setReferenceUploading(false);
            }
        }
        async function replaceReferenceFile(file, index){

            setReferenceUploading(true);
            try {
                const uploaded = await uploadReferenceFiles([file]);
                if(!uploaded.length) return;
                clearReferenceSelection();
                refs[index] = uploaded[0];
                refDims[index] = null;
                renderReferenceGrid();
                updateSizeUI();
                updateReferenceUIState();
                loadReferenceDimension(uploaded[0].url, index);
            } finally {
                setReferenceUploading(false);

        function currentSize(){
            if(resolution === 'custom') return customSizeValue();
            const options = SIZE_OPTIONS[ratio] || SIZE_OPTIONS.square;
            if(ratio === 'custom'){
                const parsed = customRatioValue();
                const longSide = RES_LONG_SIDE[resolution] || 1024;
                if(parsed){
                    const pixelLimit = RES_PIXEL_LIMIT[resolution] || (longSide * longSide);
                    const rawWidth = parsed >= 1 ? longSide : Math.min(longSide * parsed, Math.sqrt(pixelLimit * parsed));
                    const rawHeight = parsed >= 1 ? Math.min(longSide / parsed, Math.sqrt(pixelLimit / parsed)) : longSide;
                    const width = Math.floor(rawWidth / 16) * 16;
                    const height = Math.floor(rawHeight / 16) * 16;
                    return `${Math.max(64, width)}x${Math.max(64, height)}`;
                }
            }
            const match = options.find(([, label]) => label === resolution) || SIZE_OPTIONS.square.find(([, label]) => label === resolution) || SIZE_OPTIONS.square[0];
            return match[0];
        }

        function onlineTaskId(task){

        function formatOnlineTaskElapsed(seconds){
            const total = Math.max(0, Math.floor(Number(seconds || 0)));
            const hours = Math.floor(total / 3600);
            const minutes = Math.floor((total % 3600) / 60);
            const secs = total % 60;
            const pad = value => String(value).padStart(2, '0');
            return hours > 0 ? `${hours}:${pad(minutes)}:${pad(secs)}` : `${pad(minutes)}:${pad(secs)}`;
        }
        function onlineTaskElapsedText(task){

            const createdAt = onlineTaskCreatedAt(task);

            return `已等待 ${formatOnlineTaskElapsed(elapsed)}`;

        function onlineGenerationParams(data){

        function onlineGenerationFirstValue(...values){
            return values.find(value => value !== undefined && value !== null && value !== '');

        function onlineGenerationNumber(value){
            if(value === undefined || value === null || value === '') return null;
            const number = Number(value);
            return Number.isFinite(number) ? number : null;
        }
        function onlineGenerationElapsedSeconds(data){
            const params = onlineGenerationParams(data);
            const direct = onlineGenerationNumber(onlineGenerationFirstValue(
                data?.generation_elapsed_seconds,
                data?.elapsed_seconds,
                data?.duration_seconds,
                params.generation_elapsed_seconds,
                params.elapsed_seconds,
                params.duration_seconds
            ));
            if(direct !== null) return direct;
            const startedAt = onlineGenerationNumber(onlineGenerationFirstValue(
                data?.generation_started_at,
                data?.created_at,
                params.generation_started_at,
                params.created_at
            ));
            const completedAt = onlineGenerationNumber(onlineGenerationFirstValue(
                data?.generation_completed_at,
                data?.timestamp,
                params.generation_completed_at
            ));
            if(startedAt !== null && completedAt !== null && completedAt >= startedAt) return completedAt - startedAt;
            return null;
        }
        function onlineGenerationElapsedText(data){

        function onlineGenerationMetaItems(data){

            const size = onlineGenerationFirstValue(params.size, data.size, data.request?.size);
            const quality = onlineGenerationFirstValue(params.quality, data.quality, data.request?.quality);
            const count = onlineGenerationNumber(onlineGenerationFirstValue(params.n, data.n, data.request?.n));
            const refCount = Array.isArray(params.reference_images) ? params.reference_images.length : 0;
            const paramParts = [];
            if(providerName) paramParts.push(`平台 ${providerName}`);
            if(size) paramParts.push(`尺寸 ${size}`);
            if(quality) paramParts.push(`质量 ${quality}`);
            if(count !== null) paramParts.push(`张数 ×${Math.max(1, count)}`);
            if(refCount > 0) paramParts.push(`参考图 ${refCount}`);
            return [
                {label:'模型', value:model, kind:'model'},
                {label:'参数', value:paramParts.length ? paramParts.join(' · ') : '参数 --', kind:'params'},
                {label:'耗时', value:onlineGenerationElapsedText(data), kind:'time'}

        function renderOnlineGenerationMeta(elementId, data){

        function onlineTaskQueueText(task){

            onlineGenerationTasks.sort((a, b) => Number(b.created_at || 0) - Number(a.created_at || 0));
            if(onlineTaskIsActive(normalized)) startOnlineTaskPoll(normalized.id);
            else stopOnlineTaskPoll(normalized.id);

            document.getElementById('promptInput').value = currentLightboxData.prompt || '';
            applyReferenceImages(currentLightboxData.params?.reference_images || []);
            const size = currentLightboxData.params?.size || '1024x1024';
            const matchedRatio = Object.keys(SIZE_OPTIONS).find(key => SIZE_OPTIONS[key].some(([value]) => value === size)) || 'square';
            const matchedRes = SIZE_OPTIONS[matchedRatio]?.find(([value]) => value === size)?.[1];
            if(matchedRes) {
                setRatio(matchedRatio, size);
                setResolution(matchedRes);
            } else {
                setResolution('custom');
                const parsed = parseSizeValue(size);
                customWidth = parsed?.width || '';
                customHeight = parsed?.height || '';
                updateSizeUI();
                persistOnlineSettings();
            }
            closeLightbox(); window.scrollTo({top:0, behavior:'smooth'});
        }
        async function deleteHistoryItem(ts, ev){
            ev.stopPropagation();
            if(!confirm(tr('online.deleteConfirm'))) return;
            const res = await fetch('/api/history/delete', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({timestamp:ts})}).then(r=>r.json());
            if(res.success){
                const card = document.getElementById(`history-${ts}`);
                const key = card?.dataset.historyTs || String(ts);
                card?.remove();
                onlineLightboxDataByKey.delete(key);
                renderOnlineHistoryRail();
            }
        }
        const observer = new IntersectionObserver(entries => { if(entries[0].isIntersecting && currentIndex < allHistory.length) loadHistory(1); }, {threshold:.1});
        window.onload = async () => {
            applyLanguage();
            bindOnlineTaskDock();
            bindOnlineHistoryRail();
            bindReferenceInteractions();
            renderReferenceGrid();
            updateReferenceUIState();
            if(hasPersistedOnlineSettings) updateSizeUI();
            else {
                setRatio(ONLINE_DEFAULT_RATIO);
                setResolution(ONLINE_DEFAULT_RESOLUTION);
            }
            await initModels();
            await loadHistory(0);
            await initOnlineTasks();
            window.HistoryBulkManager?.attach({masonry:'#masonry'});
            window.addEventListener('keydown', handleOnlinePreviewKeydown);
            window.addEventListener('keydown', handleLightboxKeydown);
            const loadMoreTrigger = document.getElementById('loadMoreTrigger');
            if(loadMoreTrigger){
                observer.observe(loadMoreTrigger);
                loadMoreTrigger.onclick = () => loadHistory(1);
            }
        };
    </script>
</body>
</html>
