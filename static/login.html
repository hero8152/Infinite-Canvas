<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite-Canvas — Sign in</title>
    <link rel="icon" href="/static/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/design-system.css?v=21">
    <script src="/static/theme.js?v=20260511a"></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-sans);
            color: var(--ink);
            background-color: var(--bg);
            background-image:
                linear-gradient(to right,  rgba(230, 213, 168, 0.55) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(230, 213, 168, 0.55) 1px, transparent 1px);
            background-size: 80px 80px;
            display: flex;
            flex-direction: column;
        }

        body.studio-theme-dark {
            background-color: var(--dark-bg);
            background-image:
                linear-gradient(to right,  rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 32px 48px;
        }
        .top-bar .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            font-weight: 500;
        }
        .top-bar .brand .pixel-icon { color: var(--primary); }
        .top-bar .timestamp {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--muted);
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 clamp(24px, 8vw, 128px);
            max-width: 1400px;
        }

        .hero h1 {
            margin: 0 0 24px 0;
            font-size: clamp(56px, 9vw, 128px);
            font-weight: 500;
            line-height: 0.95;
            letter-spacing: -0.02em;
        }
        .hero .subtitle {
            font-size: 20px;
            color: var(--muted);
            max-width: 640px;
            margin: 0 0 64px 0;
            line-height: 1.4;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 24px;
            max-width: 480px;
        }
        .field-row {
            display: flex;
            gap: 0;
        }
        .field-row .input {
            flex: 1;
        }
        .field-row .btn-primary {
            border-left: none;
        }

        .footer-link-row {
            display: flex;
            gap: 32px;
            align-items: center;
        }

        .bottom-bar {
            display: flex;
            justify-content: flex-end;
            padding: 24px 48px 32px 48px;
        }
        .bottom-bar .text-mono {
            color: var(--muted);
        }
    </style>
</head>

<body>

    <header class="top-bar">
        <div class="brand">
            <svg class="pixel-icon pixel-icon--md" aria-hidden="true">
                <use href="#ic-brand"/>
            </svg>
            <span>Infinite-Canvas</span>
        </div>
        <div class="timestamp" id="timer">—</div>
    </header>

    <main class="hero">
        <h1>The next chapter of <br>generative AI is yours.</h1>
        <p class="subtitle">Sign in with your access token to enter the editorial canvas, prompt to image, and chat with your model of choice.</p>

        <form class="login-form" id="loginForm" onsubmit="return handleLogin(event)">
            <label class="text-label" for="token">Access token</label>
            <div class="field-row">
                <input class="input" type="password" id="token" placeholder="paste your token here" autocomplete="off" required>
                <button class="btn-primary" type="submit">
                    Continue
                    <svg class="pixel-icon pixel-icon--sm"><use href="#chevron-right"/></svg>
                </button>
            </div>
            <div id="error-msg" class="input-error-msg" style="display:none">
                <svg class="pixel-icon pixel-icon--sm"><use href="#cross"/></svg>
                <span>Invalid token — try again.</span>
            </div>

            <div class="footer-link-row">
                <a class="btn-underline" href="https://ai.comfly.chat/token" target="_blank" rel="noopener">
                    Need a token?
                    <svg class="pixel-icon pixel-icon--sm"><use href="#chevron-right"/></svg>
                </a>
                <a class="btn-underline" href="/" >
                    Continue without token
                    <svg class="pixel-icon pixel-icon--sm"><use href="#chevron-right"/></svg>
                </a>
            </div>
        </form>
    </main>

    <footer class="bottom-bar">
        <span class="text-mono" id="commit-line">build · v2.1 · editorial canvas</span>
    </footer>

    <div class="sunset-stripe"></div>

    <script>
        function updateTimer() {
            const now = new Date();
            const el = document.getElementById('timer');
            if (el) el.textContent = now.toLocaleString('en-GB').toUpperCase();
        }
        setInterval(updateTimer, 1000);
        updateTimer();

        async function handleLogin(e) {
            e.preventDefault();
            const token = document.getElementById('token').value.trim();
            const err = document.getElementById('error-msg');
            err.style.display = 'none';

            if (!token) {
                err.style.display = 'flex';
                return false;
            }

            try {
                // 持久化到 localStorage，shell 内 fetch 调用时由前端注入
                localStorage.setItem('comfly_token', token);
                // 同步到服务端全局 token
                await fetch('/api/config/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });
                window.location.href = '/';
            } catch (e2) {
                err.style.display = 'flex';
                err.querySelector('span').textContent = 'Sync failed — saved locally.';
                setTimeout(() => { window.location.href = '/'; }, 800);
            }
            return false;
        }
    </script>
</body>

</html>
