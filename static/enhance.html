<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/logo.png" type="image/png">
    <title>Detail enhance · Infinite-Canvas</title>
    <link rel="stylesheet" href="/static/design-system.css?v=22">
    <script src="/static/theme.js?v=20260511b"></script>
    <style>
        /* ============================================================
           enhance.html 页内特化样式（DESIGN.md v2.1 §17.2 模板）
           - 不重新定义 token，所有色值来自 design-system.css
           - 仅在此添加 §17.2 左右两栏布局 + 本页特有的 before/after 对比浮窗
           ============================================================ */
        html, body { height: 100%; }
        body {
            background: var(--bg);
            background-image:
                linear-gradient(to right,  rgba(230, 213, 168, 0.55) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(230, 213, 168, 0.55) 1px, transparent 1px);
            background-size: 80px 80px;
            min-height: 100vh;
        }
        body.studio-theme-dark {
            background-color: var(--dark-bg);
            background-image:
                linear-gradient(to right,  rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        /* §17.2 主布局：左 380 参数面板 + 右栏图片网格 */
        .page-wrap {
            display: flex;
            min-height: 100vh;
            gap: 0;
        }
        .param-panel {
            width: 380px;
            flex-shrink: 0;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            border-right: 1px solid var(--border);
            background: transparent;
        }
        body.studio-theme-dark .param-panel { border-right-color: var(--dark-border); }

        .stage-main {
            flex: 1;
            padding: 32px 32px 64px 32px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            min-width: 0;
        }

        /* 参数面板内部分组（每组之间 16px 间距） */
        .field { display: flex; flex-direction: column; gap: 8px; }
        .field-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 500;
            color: var(--ink);
        }
        .field-hint {
            font-size: 12px;
            color: var(--muted);
        }

        /* 右栏顶部标题区 */
        .stage-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        /* §15.8 dropzone 已上传后的缩略图条 */
        .dropzone-thumb {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--stage-bg);
            border: 1px solid var(--border);
        }
        body.studio-theme-dark .dropzone-thumb {
            background: var(--dark-elev);
            border-color: var(--dark-border);
        }
        .dropzone-thumb img {
            width: 64px;
            height: 64px;
            object-fit: cover;
            display: block;
            flex-shrink: 0;
        }
        .dropzone-thumb .thumb-meta {
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }
        .dropzone-thumb .thumb-name {
            font-size: 14px;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dropzone-thumb .thumb-sub {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }
        .dropzone-thumb .thumb-remove {
            width: 24px;
            height: 24px;
            background: var(--ink);
            color: #fff;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .dropzone-thumb .thumb-remove:hover { background: var(--primary-deep); }
        body.studio-theme-dark .dropzone-thumb .thumb-remove { background: var(--primary); }

        /* radio 行容器：两个等宽 */
        .radio-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .radio-grid .radio-row {
            padding: 10px 12px;
            background: var(--bg-2);
            border: 1px solid transparent;
        }
        body.studio-theme-dark .radio-grid .radio-row {
            background: var(--dark-elev);
        }

        /* 图片网格里的"正在生成"占位卡 */
        .render-placeholder {
            display: flex;
            flex-direction: column;
        }
        .render-placeholder .image-placeholder {
            aspect-ratio: 1 / 1;
        }
        .render-placeholder .placeholder-meta {
            background: var(--bg-2);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        body.studio-theme-dark .render-placeholder .placeholder-meta {
            background: var(--dark-elev);
            color: var(--dark-text);
        }

        /* —— Lightbox (DESIGN.md §16.5 spec) —— */
        .lightbox-mask {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(15, 15, 15, 0.92);
            /* §16.5：禁止 backdrop-blur，纯黑足够 */
            display: none;
            align-items: center;
            justify-content: center;
            padding: 48px;
        }
        .lightbox-mask.is-open { display: flex; }

        .lightbox-actions {
            position: absolute;
            top: 24px;
            right: 24px;
            display: inline-flex;
            gap: 8px;
            z-index: 2;
        }
        .lightbox-actions .lb-btn {
            width: 32px;
            height: 32px;
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 0;
        }
        .lightbox-actions .lb-btn:hover { background: rgba(255, 255, 255, 0.08); }
        .lightbox-actions .lb-btn .pixel-icon { color: #fff; }

        .lightbox-meta {
            position: absolute;
            top: 24px;
            left: 24px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: var(--ink);
            color: #fff;
            font-family: var(--font-mono);
            font-size: 12px;
        }

        /* —— Before / After compare 滑块 (DESIGN.md §15.4 风格 + 1px primary 分隔) —— */
        .compare-stage {
            position: relative;
            width: min(1200px, calc(100vw - 96px));
            max-height: calc(100vh - 192px);
            aspect-ratio: 16 / 10;
            background: #000;
            overflow: hidden;
            user-select: none;
            border: 1px solid var(--primary);
        }
        .compare-stage.is-single {
            border-color: rgba(255, 255, 255, 0.2);
        }
        .compare-stage img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }
        #compareOriginalWrapper {
            position: absolute;
            inset: 0;
            overflow: hidden;
            clip-path: inset(0 50% 0 0);
        }
        /* §15.4 风格：滑块 handle 14×14 像素方块（不是圆形） */
        #compareSliderLine {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 1px;
            background: var(--primary);
            /* 严禁发光：§16.1 选中态规则同等 */
            transform: translateX(-50%);
            cursor: ew-resize;
            z-index: 3;
        }
        #compareSliderHandle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 14px;
            height: 14px;
            background: var(--primary);
            border: 1px solid var(--ink);
            transform: translate(-50%, -50%);
            cursor: ew-resize;
            transition: none;
        }
        /* 左右两侧的 BEFORE / AFTER 像素标签 */
        .compare-tag {
            position: absolute;
            top: 16px;
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            background: var(--ink);
            color: #fff;
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.04em;
            z-index: 2;
            pointer-events: none;
        }
        .compare-tag--before { left: 16px; }
        .compare-tag--after  { right: 16px; }

        .lightbox-footer {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            display: inline-flex;
            gap: 12px;
            z-index: 2;
        }

        /* 简化的 toast/feedback 区 */
        .stage-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 64px 16px;
            min-height: 320px;
            color: var(--muted);
        }

        /* 工具按钮（image-meta 内的 24x24 像素方块） */
        .action-btn .pixel-icon { color: var(--ink); }
        body.studio-theme-dark .action-btn .pixel-icon { color: var(--dark-text); }

        @media (max-width: 1024px) {
            .page-wrap { flex-direction: column; }
            .param-panel {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
        }
    </style>
</head>

<body>
    <div class="page-wrap">
        <!-- ================== 左：380px 参数面板 ================== -->
        <aside class="param-panel">
            <!-- 顶部段标签 §6 -->
            <div>
                <span class="section-tag">
                    Detail enhance
                    <svg class="pixel-icon pixel-icon--sm" aria-hidden="true"><use href="#chevron-down"/></svg>
                </span>
            </div>

            <!-- 输入图上传 §15.8 -->
            <div class="field">
                <label class="field-label">Input image</label>
                <div id="dropzone" class="dropzone">
                    <svg class="pixel-icon" style="width:32px;height:32px;color:var(--primary)" aria-hidden="true">
                        <use href="#upload"/>
                    </svg>
                    <div class="text-body">Drop image or click</div>
                    <div class="field-hint">PNG / JPG, drag &amp; drop, click, or paste</div>
                    <input type="file" id="fileInput" accept="image/*" style="display:none">
                </div>
                <!-- 上传成功后显示 64×64 缩略图 -->
                <div id="thumbBox" class="dropzone-thumb" style="display:none">
                    <img id="thumbImg" alt="input">
                    <div class="thumb-meta">
                        <div id="thumbName" class="thumb-name">image.png</div>
                        <div id="thumbSub"  class="thumb-sub">uploaded</div>
                    </div>
                    <button class="thumb-remove" type="button" onclick="clearInput()" title="Remove">
                        <svg class="pixel-icon pixel-icon--sm"><use href="#cross"/></svg>
                    </button>
                </div>
            </div>

            <!-- 提示词 §15.2 -->
            <div class="field">
                <label class="field-label" for="promptInput">Prompt
                    <span class="field-hint">optional</span>
                </label>
                <textarea id="promptInput" class="textarea" rows="3"
                    placeholder="masterpiece, best quality, ultra-detailed, high resolution"></textarea>
            </div>

            <!-- Strength slider §15.4 -->
            <div class="field">
                <label class="field-label">Refinement strength
                    <span id="strengthVal" class="slider-value">0.50</span>
                </label>
                <div class="slider">
                    <div class="slider-track" id="strengthTrack">
                        <div class="slider-fill"   id="strengthFill"   style="width:50%"></div>
                        <div class="slider-handle" id="strengthHandle" style="left:50%"></div>
                    </div>
                </div>
                <div class="field-hint">Controls node 204 strength (0.10 – 1.00)</div>
            </div>

            <!-- 引擎切换 §15.7 -->
            <div class="field">
                <label class="field-label">Engine</label>
                <div class="radio-grid">
                    <label class="radio-row">
                        <input type="radio" name="provider" value="local" checked>
                        <span class="radio-box"></span>
                        <span>Local · ComfyUI</span>
                    </label>
                    <label class="radio-row">
                        <input type="radio" name="provider" value="ms">
                        <span class="radio-box"></span>
                        <span>Cloud · Klein</span>
                    </label>
                </div>
            </div>

            <!-- Super resolution toggle §15.6 + factor §15.7 -->
            <div class="field" id="localExtra">
                <label class="checkbox-row">
                    <input type="checkbox" id="upscaleToggle" onchange="toggleUpscaleOptions()">
                    <span class="check-box"></span>
                    <span>Super resolution (4K)</span>
                </label>
                <div id="upscaleOptions" class="radio-grid" style="display:none">
                    <label class="radio-row">
                        <input type="radio" name="upscale" value="2048" checked>
                        <span class="radio-box"></span>
                        <span>2× (2K)</span>
                    </label>
                    <label class="radio-row">
                        <input type="radio" name="upscale" value="4096">
                        <span class="radio-box"></span>
                        <span>4× (4K)</span>
                    </label>
                </div>
            </div>

            <!-- 主 CTA §7.1 -->
            <div style="margin-top:auto; padding-top:16px;">
                <button id="genBtn" type="button" class="btn-primary" onclick="handleGenerate()" style="width:100%; justify-content:center;">
                    <span id="btnText">Enhance</span>
                    <svg class="pixel-icon pixel-icon--sm" aria-hidden="true"><use href="#chevron-right"/></svg>
                </button>
            </div>
        </aside>

        <!-- ================== 右：网格主区 ================== -->
        <main class="stage-main">
            <div class="stage-header">
                <span class="section-tag">
                    <span id="archiveCountLabel">Recent enhancements (0)</span>
                    <svg class="pixel-icon pixel-icon--sm" aria-hidden="true"><use href="#chevron-down"/></svg>
                </span>
                <span class="text-mono text-muted">Tap any card to open before / after compare</span>
            </div>

            <!-- §16.2 4 列 image-grid -->
            <div id="imageGrid" class="image-grid">
                <!-- empty state -->
                <div id="emptyState" class="stage-empty" style="grid-column: 1 / -1;">
                    <div class="image-placeholder" style="width:160px;height:160px;aspect-ratio:auto;"></div>
                    <div class="text-body">No enhancements yet</div>
                    <div class="field-hint">Upload an image on the left and press Enhance</div>
                </div>
            </div>
        </main>
    </div>

    <!-- =================================================================
         Lightbox：保留 before/after compare 滑块（enhance 特色）
         外壳按 §16.5（全黑 .92，无 backdrop-blur）
         drag handle 14×14 像素方块（§15.4），分隔线 1px primary
         ================================================================= -->
    <div id="lightbox" class="lightbox-mask" onclick="handleLightboxOutside(event)">
        <div class="lightbox-meta" id="lightboxMeta" style="display:none">
            <svg class="pixel-icon pixel-icon--sm"><use href="#chevron-right"/></svg>
            <span id="lightboxResText">— × —</span>
        </div>
        <div class="lightbox-actions">
            <button class="lb-btn" type="button" onclick="downloadLightbox()" title="Download">
                <svg class="pixel-icon pixel-icon--sm"><use href="#download"/></svg>
            </button>
            <button class="lb-btn" type="button" onclick="closeLightbox()" title="Close">
                <svg class="pixel-icon pixel-icon--sm"><use href="#cross"/></svg>
            </button>
        </div>

        <div class="compare-stage" id="compareStage">
            <!-- 后图（增强后）在底层 -->
            <img id="compareGenerated" alt="after">
            <!-- 前图（原始）在上层，clipPath 控制可见区 -->
            <div id="compareOriginalWrapper">
                <img id="compareOriginal" alt="before">
            </div>
            <span class="compare-tag compare-tag--before">BEFORE</span>
            <span class="compare-tag compare-tag--after">AFTER</span>
            <!-- 1px primary 分隔线 + 14×14 像素方块 handle -->
            <div id="compareSliderLine">
                <div id="compareSliderHandle"></div>
            </div>
            <!-- 单图 fallback（无原图可比时） -->
            <img id="lightboxSingle" alt="result" style="display:none">
        </div>
    </div>

    <script>
        /* ============================================================
           enhance.html 业务逻辑
           - 保留两条 API 路径（不动 schema）：
             1) POST /api/generate  workflow="Z-Image-Enhance.json"  node "204" + "15"
             2) POST /api/ms/generate  (云端 Klein + LoRA)
             3) 二阶 upscale 仍走 /api/generate workflow="upscale.json"
           - 保留 dropzone 拖拽 + paste + click
           - 保留 before/after compare 滑块
           ============================================================ */

        function generateUUID() {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                try { return crypto.randomUUID(); } catch (e) { }
            }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        const CLIENT_ID = localStorage.getItem('client_id') || generateUUID();
        localStorage.setItem('client_id', CLIENT_ID);

        /* 状态 */
        let uploadedPath = '';      // ComfyUI 端 comfy_name
        let uploadedDataURL = '';   // 本地预览 DataURL
        let uploadedFileName = '';
        let currentResult  = null;
        let strengthValue  = 0.5;
        let provider       = 'local';
        let upscaleFactor  = 2048;
        const renderedIds  = new Set();
        let archiveCount   = 0;

        /* ============== Strength slider（§15.4 自实现） ============== */
        const sliderTrack  = document.getElementById('strengthTrack');
        const sliderFill   = document.getElementById('strengthFill');
        const sliderHandle = document.getElementById('strengthHandle');
        const strengthValEl = document.getElementById('strengthVal');

        function setStrength(v) {
            v = Math.max(0.1, Math.min(1.0, v));
            strengthValue = v;
            const pct = ((v - 0.1) / 0.9) * 100;
            sliderFill.style.width = pct + '%';
            sliderHandle.style.left = pct + '%';
            strengthValEl.innerText = v.toFixed(2);
        }
        function strengthFromClientX(clientX) {
            const rect = sliderTrack.getBoundingClientRect();
            let pct = (clientX - rect.left) / rect.width;
            pct = Math.max(0, Math.min(1, pct));
            return 0.1 + pct * 0.9;
        }
        let sliderDragging = false;
        sliderTrack.addEventListener('mousedown', (e) => {
            sliderDragging = true;
            setStrength(strengthFromClientX(e.clientX));
        });
        window.addEventListener('mousemove', (e) => {
            if (sliderDragging) setStrength(strengthFromClientX(e.clientX));
        });
        window.addEventListener('mouseup', () => sliderDragging = false);
        sliderTrack.addEventListener('touchstart', (e) => {
            sliderDragging = true;
            setStrength(strengthFromClientX(e.touches[0].clientX));
        }, { passive: true });
        window.addEventListener('touchmove', (e) => {
            if (sliderDragging && e.touches[0])
                setStrength(strengthFromClientX(e.touches[0].clientX));
        }, { passive: true });
        window.addEventListener('touchend', () => sliderDragging = false);
        setStrength(0.5);

        /* ============== 引擎切换 ============== */
        document.querySelectorAll('input[name="provider"]').forEach(r => {
            r.addEventListener('change', () => {
                provider = r.value;
                document.getElementById('localExtra').style.display = (provider === 'local') ? '' : 'none';
            });
        });

        /* ============== Upscale 选项 ============== */
        function toggleUpscaleOptions() {
            const on = document.getElementById('upscaleToggle').checked;
            document.getElementById('upscaleOptions').style.display = on ? '' : 'none';
        }
        document.querySelectorAll('input[name="upscale"]').forEach(r => {
            r.addEventListener('change', () => {
                upscaleFactor = parseInt(r.value, 10) || 2048;
            });
        });

        /* ============== Dropzone + 文件上传 ============== */
        const dropzone  = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const thumbBox  = document.getElementById('thumbBox');
        const thumbImg  = document.getElementById('thumbImg');
        const thumbName = document.getElementById('thumbName');
        const thumbSub  = document.getElementById('thumbSub');

        dropzone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('is-over');
        });
        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('is-over'));
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('is-over');
            if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
        });

        // 粘贴上传
        let hoveringDrop = false;
        dropzone.addEventListener('mouseenter', () => hoveringDrop = true);
        dropzone.addEventListener('mouseleave', () => hoveringDrop = false);
        window.addEventListener('paste', (e) => {
            if (!hoveringDrop) return;
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let item of items) {
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    handleFile(item.getAsFile());
                    break;
                }
            }
        });

        async function handleFile(file) {
            if (!file) return;
            const btn = document.getElementById('genBtn');
            const btnText = document.getElementById('btnText');
            btn.classList.add('is-disabled');
            btn.disabled = true;
            btnText.innerText = 'Uploading…';

            // 本地预览
            const reader = new FileReader();
            reader.onload = (e) => {
                uploadedDataURL = e.target.result;
                thumbImg.src = uploadedDataURL;
                thumbName.innerText = file.name || 'image';
                thumbSub.innerText  = 'uploading…';
                thumbBox.style.display = 'flex';
                dropzone.classList.add('has-file');
            };
            reader.readAsDataURL(file);
            uploadedFileName = file.name || 'image';

            const formData = new FormData();
            formData.append('files', file);
            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await res.json();
                uploadedPath = data.files[0].comfy_name;
                thumbSub.innerText = 'ready · ' + (uploadedPath || '').split('/').pop();
                btn.classList.remove('is-disabled');
                btn.disabled = false;
                btnText.innerText = 'Enhance';
            } catch (err) {
                console.error('Upload error', err);
                thumbSub.innerText = 'upload failed';
                btn.classList.remove('is-disabled');
                btn.disabled = false;
                btnText.innerText = 'Enhance';
            }
        }

        function clearInput() {
            uploadedPath = '';
            uploadedDataURL = '';
            uploadedFileName = '';
            fileInput.value = '';
            thumbBox.style.display = 'none';
            dropzone.classList.remove('has-file');
        }

        /* ============== 主生成逻辑（API 调用保持原样） ============== */
        async function handleGenerate() {
            if (!uploadedPath) {
                // 提示需要上传，闪一下边
                dropzone.style.borderColor = 'var(--primary-deep)';
                setTimeout(() => { dropzone.style.borderColor = ''; }, 400);
                return;
            }
            const btn     = document.getElementById('genBtn');
            const btnText = document.getElementById('btnText');
            btn.classList.add('is-disabled');
            btn.disabled  = true;
            btnText.innerText = 'Processing…';

            // 插入"正在生成"占位卡到网格首位
            document.getElementById('emptyState').style.display = 'none';
            const placeholderId = 'render-' + Date.now();
            insertRenderPlaceholder(placeholderId);

            let debugStep = 'Start';
            try {
                let finalData;
                if (provider === 'ms') {
                    /* ---------- 云端 Klein + LoRA ---------- */
                    debugStep = 'MS Cloud Request';
                    if (!uploadedDataURL) throw new Error('请先上传图片');
                    const prompt = (document.getElementById('promptInput').value || '').trim()
                        || 'masterpiece, best quality, ultra-detailed, high resolution';
                    const msRes = await fetch('/api/ms/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            prompt,
                            model: 'black-forest-labs/FLUX.2-klein-9B',
                            image_urls: [uploadedDataURL],
                            loras: { 'Daniel8152/Klein-enhance': strengthValue },
                            client_id: CLIENT_ID
                        })
                    });
                    if (!msRes.ok) {
                        const err = await msRes.json().catch(() => ({}));
                        throw new Error(err.detail || 'MS生成失败');
                    }
                    const msData = await msRes.json();
                    if (!msData.url) throw new Error('MS生成失败: 未返回图片');
                    finalData = {
                        images: [msData.url],
                        timestamp: Date.now(),
                        params: { '15': { 'image': uploadedPath } }
                    };
                } else {
                    /* ---------- 本地 ComfyUI: Z-Image-Enhance.json ---------- */
                    const isUpscale = document.getElementById('upscaleToggle').checked;
                    btnText.innerText = isUpscale ? 'Phase 1/2 · enhancing' : 'Enhancing…';

                    debugStep = 'Phase 1 Request';
                    const promptText = (document.getElementById('promptInput').value || '').trim();
                    // node 204 → prompt 与 strength。保持原 schema：value=strength。
                    // 如果用户填了 prompt，则同步写入 prompt 字段（保守地不破坏旧 schema）
                    const params204 = { value: strengthValue };
                    if (promptText) params204.prompt = promptText;

                    const enhanceRes = await fetch('/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            workflow_json: 'Z-Image-Enhance.json',
                            params: {
                                '15':  { image: uploadedPath },
                                '204': params204
                            },
                            type: 'enhance',
                            client_id: CLIENT_ID
                        })
                    });
                    const enhanceData = await enhanceRes.json();
                    if (enhanceData.error) throw new Error('Enhance API Error: ' + enhanceData.error);
                    if (!enhanceData.images?.length) throw new Error('Enhance failed: No images returned');
                    finalData = enhanceData;

                    if (isUpscale) {
                        /* ---------- Phase 2: 把 phase1 结果重上传并跑 upscale.json ---------- */
                        debugStep = 'Phase 2 Preparation';
                        btnText.innerText = 'Phase 2/2 · uploading';

                        const imgUrl = enhanceData.images[0];
                        const blobRes = await fetch(imgUrl);
                        if (!blobRes.ok) throw new Error('Fetch failed status: ' + blobRes.status);
                        const imgBlob = await blobRes.blob();

                        debugStep = 'Phase 2 Upload';
                        const fd = new FormData();
                        fd.append('files', imgBlob, 'temp_upscale_input.png');
                        const upRes = await fetch('/api/upload', { method: 'POST', body: fd });
                        if (!upRes.ok) throw new Error('Upload failed status: ' + upRes.status);
                        const upData = await upRes.json();
                        if (!upData.files?.[0]) throw new Error('Intermediate upload failed');
                        const uploadedInput = upData.files[0].comfy_name;

                        debugStep = 'Phase 2 Execution';
                        btnText.innerText = 'Phase 2/2 · upscaling';
                        const seed = Math.floor(Math.random() * 4294967295);
                        const upscaleRes = await fetch('/api/generate', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                workflow_json: 'upscale.json',
                                params: {
                                    '15':  { image: uploadedInput },
                                    '172': { seed: seed, resolution: upscaleFactor }
                                },
                                type: 'enhance',
                                client_id: CLIENT_ID
                            })
                        });
                        finalData = await upscaleRes.json();
                        if (finalData.error) throw new Error('Upscale API Error: ' + finalData.error);
                        if (!finalData.images?.length) throw new Error('Upscale failed: No images returned');
                    }
                }

                currentResult = finalData;
                removeRenderPlaceholder(placeholderId);
                renderImageCard(finalData, true);
                openLightbox(finalData);
            } catch (error) {
                console.error('Generation Error at step ' + debugStep, error);
                replacePlaceholderWithError(placeholderId, error.message || 'Render failed');
            } finally {
                btn.classList.remove('is-disabled');
                btn.disabled  = false;
                btnText.innerText = 'Enhance';
            }
        }

        /* ============== 渲染图卡 §16.1 + 占位 §16.3 + 错误 §16.6 ============== */
        function insertRenderPlaceholder(id) {
            const grid = document.getElementById('imageGrid');
            const wrap = document.createElement('div');
            wrap.id = id;
            wrap.className = 'render-placeholder';
            wrap.innerHTML = `
                <div class="image-placeholder">
                    <span class="section-tag">
                        Rendering
                        <span class="pixel-dot-pulse"><span></span><span></span><span></span></span>
                    </span>
                </div>
                <div class="placeholder-meta">
                    <span class="text-mono">${provider === 'ms' ? 'cloud · klein' : 'local · comfyui'}</span>
                </div>
            `;
            grid.insertBefore(wrap, grid.firstChild);
        }
        function removeRenderPlaceholder(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }
        function replacePlaceholderWithError(id, msg) {
            const el = document.getElementById(id);
            if (!el) return;
            el.innerHTML = `
                <div class="image-placeholder image-placeholder--error">
                    <svg class="pixel-icon" style="width:32px;height:32px;color:var(--primary)"><use href="#cross"/></svg>
                </div>
                <div class="placeholder-meta">
                    <span class="text-body" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${msg}</span>
                    <a class="btn-underline" href="javascript:handleGenerate()" style="font-size:12px;">retry
                        <svg class="pixel-icon pixel-icon--sm"><use href="#chevron-right"/></svg>
                    </a>
                </div>
            `;
        }

        function renderImageCard(data, isNew = false) {
            const grid = document.getElementById('imageGrid');
            const key  = 'h-' + data.timestamp;
            if (renderedIds.has(key)) return;
            renderedIds.add(key);
            document.getElementById('emptyState').style.display = 'none';

            const card = document.createElement('div');
            card.id = key;
            card.className = 'image-card';
            card.style.cursor = 'zoom-in';
            card.onclick = () => openLightbox(data);

            const imgUrl = data.images[0];
            const promptShort = (data.params && data.params['204'] && data.params['204'].prompt) || 'Enhanced';
            const ts = new Date(data.timestamp || Date.now());
            const tsText = ts.getFullYear() + '-' + String(ts.getMonth()+1).padStart(2,'0') + '-' + String(ts.getDate()).padStart(2,'0')
                + ' ' + String(ts.getHours()).padStart(2,'0') + ':' + String(ts.getMinutes()).padStart(2,'0');

            card.innerHTML = `
                <img src="${imgUrl}" alt="enhanced">
                <div class="image-meta">
                    <div class="meta-text">
                        <div class="meta-prompt">${escapeHtml(promptShort)}</div>
                        <div class="meta-info">enhanced · ${tsText}</div>
                    </div>
                    <div class="meta-actions">
                        <button class="action-btn" title="Download"
                            onclick="event.stopPropagation();window.open('${imgUrl}','_blank')">
                            <svg class="pixel-icon pixel-icon--sm"><use href="#download"/></svg>
                        </button>
                        <button class="action-btn" title="Open compare"
                            onclick="event.stopPropagation();openLightboxFromCard('${key}')">
                            <svg class="pixel-icon pixel-icon--sm"><use href="#search"/></svg>
                        </button>
                    </div>
                </div>
            `;
            card.__data = data;
            if (isNew) grid.insertBefore(card, grid.firstChild); else grid.appendChild(card);
            archiveCount += 1;
            document.getElementById('archiveCountLabel').innerText =
                'Recent enhancements (' + archiveCount + ')';
        }

        function openLightboxFromCard(key) {
            const card = document.getElementById(key);
            if (card && card.__data) openLightbox(card.__data);
        }

        function escapeHtml(s) {
            return String(s || '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        /* ============== Lightbox + Before/After compare ============== */
        const lightbox = document.getElementById('lightbox');
        const compareStage    = document.getElementById('compareStage');
        const compareGenerated= document.getElementById('compareGenerated');
        const compareOriginal = document.getElementById('compareOriginal');
        const compareWrapper  = document.getElementById('compareOriginalWrapper');
        const compareLine     = document.getElementById('compareSliderLine');
        const compareHandle   = document.getElementById('compareSliderHandle');
        const lightboxSingle  = document.getElementById('lightboxSingle');
        const lightboxMeta    = document.getElementById('lightboxMeta');
        const lightboxRes     = document.getElementById('lightboxResText');
        const beforeTag = document.querySelector('.compare-tag--before');
        const afterTag  = document.querySelector('.compare-tag--after');
        let lightboxImageURL  = '';

        function openLightbox(data) {
            lightboxImageURL = data.images[0];
            const inputName = data.params && data.params['15'] && data.params['15'].image;
            if (inputName) {
                // 有原图 → compare 模式
                compareStage.classList.remove('is-single');
                compareGenerated.style.display = '';
                compareWrapper.style.display = '';
                compareLine.style.display = '';
                beforeTag.style.display = '';
                afterTag.style.display = '';
                lightboxSingle.style.display = 'none';
                compareGenerated.src = data.images[0];
                compareOriginal.src  = '/api/view?filename=' + encodeURIComponent(inputName) + '&type=input';
                // 复位到 50%
                compareWrapper.style.clipPath = 'inset(0 50% 0 0)';
                compareLine.style.left = '50%';
                compareGenerated.onload = () => {
                    if (compareGenerated.naturalWidth) {
                        lightboxRes.innerText = compareGenerated.naturalWidth + ' × ' + compareGenerated.naturalHeight;
                        lightboxMeta.style.display = '';
                    }
                };
                if (compareGenerated.complete && compareGenerated.naturalWidth) {
                    lightboxRes.innerText = compareGenerated.naturalWidth + ' × ' + compareGenerated.naturalHeight;
                    lightboxMeta.style.display = '';
                }
            } else {
                // 无原图 → 单图 fallback
                compareStage.classList.add('is-single');
                compareGenerated.style.display = 'none';
                compareWrapper.style.display = 'none';
                compareLine.style.display = 'none';
                beforeTag.style.display = 'none';
                afterTag.style.display = 'none';
                lightboxSingle.style.display = '';
                lightboxSingle.src = data.images[0];
                lightboxSingle.onload = () => {
                    if (lightboxSingle.naturalWidth) {
                        lightboxRes.innerText = lightboxSingle.naturalWidth + ' × ' + lightboxSingle.naturalHeight;
                        lightboxMeta.style.display = '';
                    }
                };
            }
            lightbox.classList.add('is-open');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('is-open');
            document.body.style.overflow = '';
        }
        function handleLightboxOutside(e) {
            if (e.target === lightbox) closeLightbox();
        }
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('is-open')) return;
            if (e.key === 'Escape') closeLightbox();
        });

        function downloadLightbox() {
            if (!lightboxImageURL) return;
            const a = document.createElement('a');
            a.href = lightboxImageURL;
            a.download = 'enhance-' + Date.now() + '.png';
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        /* —— compare 拖拽：14×14 像素方块 handle，整数像素位移 —— */
        let compareDragging = false;
        function updateCompare(clientX) {
            const rect = compareStage.getBoundingClientRect();
            let x = clientX - rect.left;
            let pct = (x / rect.width) * 100;
            pct = Math.max(0, Math.min(100, pct));
            // 用整数百分比避免 sub-pixel 抗锯齿（贴近像素美学）
            const pctInt = Math.round(pct * 10) / 10;
            compareWrapper.style.clipPath = 'inset(0 ' + (100 - pctInt) + '% 0 0)';
            compareLine.style.left = pctInt + '%';
        }
        compareStage.addEventListener('mousedown', (e) => {
            if (compareStage.classList.contains('is-single')) return;
            compareDragging = true;
            updateCompare(e.clientX);
            e.preventDefault();
        });
        window.addEventListener('mousemove', (e) => {
            if (compareDragging) updateCompare(e.clientX);
        });
        window.addEventListener('mouseup', () => compareDragging = false);
        compareStage.addEventListener('touchstart', (e) => {
            if (compareStage.classList.contains('is-single')) return;
            compareDragging = true;
            if (e.touches[0]) updateCompare(e.touches[0].clientX);
        }, { passive: true });
        window.addEventListener('touchmove', (e) => {
            if (compareDragging && e.touches[0]) updateCompare(e.touches[0].clientX);
        }, { passive: true });
        window.addEventListener('touchend', () => compareDragging = false);

        /* ============== 历史回填（保留 /api/history?type=enhance） ============== */
        async function loadHistory() {
            try {
                const res = await fetch('/api/history?type=enhance');
                const history = await res.json();
                history.forEach(item => renderImageCard(item));
            } catch (e) { /* 静默 */ }
        }

        /* ============== 主题切换（postMessage 监听保留） ============== */
        // theme.js 已经自动监听 postMessage('studio-theme') 并应用 class，
        // 这里再补一个钩子以确保父 shell 切换时本页 lightbox 等元素同步重绘。
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'studio-theme') {
                // theme.js 已处理；此处仅做无关 side effect（强制刷新 background）
                document.body.offsetHeight; // 触发样式重计算
            }
        });

        window.addEventListener('load', () => {
            loadHistory();
        });
    </script>
</body>
