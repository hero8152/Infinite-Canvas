<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
    <title>GPT Chat · Feebee Studios</title>
    <!-- Phase 1: 引入 Editorial Canvas 设计系统（DESIGN.md v2.1） -->
    <link rel="stylesheet" href="/static/design-system.css?v=24">
    <!-- 保留 theme.js 用于接收父 frame 的主题切换 postMessage -->
    <script src="/static/theme.js?v=20260512g"></script>
    <style>
        /* ============================================================
           gpt-chat 局部规则 — 仅做布局, 不写颜色/圆角/阴影/transition
           设计 token 全部来自 design-system.css
           ============================================================ */

        html, body { height: 100%; }
        body {
            background: var(--bg);
            background-image:
                linear-gradient(to right, rgba(230, 213, 168, 0.28) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(230, 213, 168, 0.28) 1px, transparent 1px);
            background-size: 80px 80px;
            color: var(--ink);
            overflow: hidden;
        }
        body.studio-theme-dark {
            background-color: var(--dark-bg);
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        /* shell: 左 240px 历史侧栏 + 右主区 */
        .chat-shell {
            display: grid;
            grid-template-columns: 264px 1fr;
            height: 100vh;
            min-height: 0;
            background: transparent;
        }

        /* ---------- Sidebar (240px 历史会话列) ---------- */
        .sidebar-history {
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 16px 12px;
            gap: 12px;
            background: rgba(255, 250, 235, 0.94);
        }
        body.studio-theme-dark .sidebar-history {
            background: rgba(14, 14, 16, 0.94);
            border-right-color: var(--dark-border);
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .sidebar-header .section-tag { padding: 6px 10px; font-size: 12px; }
        .sidebar-header .new-btn {
            padding: 6px 10px;
            font-size: 12px;
            gap: 8px;
        }

        .thread-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }
        body.studio-theme-dark .thread-list { border-top-color: var(--dark-border); }

        /* 历史会话单项 — §15.7 chip 风格，激活态 §11 sidebar nav-item */
        .thread-row {
            display: grid;
            grid-template-columns: 1fr 28px;
            gap: 0;
            align-items: stretch;
        }
        .thread-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            background: var(--bg-2);
            color: var(--ink);
            border: none;
            border-radius: 0;
            cursor: pointer;
            text-align: left;
            font-family: var(--font-sans);
            font-size: 13px;
            line-height: 1.3;
            min-width: 0;
            transition: none;
        }
        body.studio-theme-dark .thread-item {
            background: var(--dark-surface);
            color: var(--dark-text);
        }
        .thread-item:hover { background: #ffe9b3; }
        body.studio-theme-dark .thread-item:hover { background: var(--dark-elev); }
        .thread-item.is-active {
            background: var(--ink);
            color: #fff;
        }
        .thread-item.is-active .pixel-icon { color: var(--primary); }
        body.studio-theme-dark .thread-item.is-active {
            background: var(--primary);
            color: #fff;
        }
        .thread-item .thread-text {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .thread-title {
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .thread-sub {
            font-size: 11px;
            opacity: 0.6;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .thread-item .pixel-icon { color: var(--primary); flex-shrink: 0; }

        .thread-delete {
            width: 28px;
            background: var(--bg-2);
            border: none;
            border-left: 1px solid var(--bg);
            color: var(--muted);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 0;
            transition: none;
        }
        body.studio-theme-dark .thread-delete {
            background: var(--dark-surface);
            border-left-color: var(--dark-bg);
            color: var(--dark-muted);
        }
        .thread-delete:hover {
            background: var(--primary-deep);
            color: #fff;
        }
        .thread-row .thread-item.is-active + .thread-delete {
            background: var(--ink);
            color: #fff;
            border-left-color: var(--muted);
        }

        .sidebar-empty {
            padding: 24px 12px;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
        }

        /* ---------- Main pane (顶部 + 消息 + 底部输入) ---------- */
        .main-pane {
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            background: var(--stage-bg);
            background-image:
                linear-gradient(to right, rgba(230, 213, 168, 0.18) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(230, 213, 168, 0.18) 1px, transparent 1px);
            background-size: 80px 80px;
        }
        body.studio-theme-dark .main-pane {
            background: var(--dark-bg);
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        /* 顶部条 — section-tag 标题 + select 模型 */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.72);
        }
        body.studio-theme-dark .top-bar {
            background: rgba(14, 14, 16, 0.72);
            border-bottom-color: var(--dark-border);
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }
        .top-bar-left .chat-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .top-bar-right .select { width: 220px; }
        .top-bar-right .select-wrap { position: relative; }

        /* ---------- Messages 区 ---------- */
        .messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 24px 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .messages-inner {
            width: 100%;
            max-width: 880px;
            min-height: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .bubble-row { display: flex; }
        .bubble-row.user { justify-content: flex-end; }
        .bubble-row.assistant { justify-content: flex-start; }

        /* 用户气泡 = §8.2 Cream Tonal Card：cream 底, 0 圆角, padding 16/20 */
        .bubble.user {
            max-width: min(720px, 88%);
            background: var(--bg-2);
            color: var(--ink);
            border-radius: 0;
            border: none;
            padding: 16px 20px;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            box-shadow: none;
        }
        body.studio-theme-dark .bubble.user {
            background: var(--dark-surface);
            color: var(--dark-text);
        }

        /* AI 气泡 = §8.3 Dark Glass Card：dark-elev 底, 0 圆角, padding 16 */
        .bubble.assistant {
            max-width: min(720px, 88%);
            background: var(--dark-elev);
            color: var(--dark-text);
            border: 1px solid var(--dark-border);
            border-radius: 0;
            padding: 16px;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
        }

        /* 流式 chunk 跳显：禁用一切 transition / animation，用 step-end 才符合像素美学 */
        .bubble.assistant .bubble-text {
            transition: none;
            animation: none;
        }
        /* streaming 标记：末尾橙色像素方块 step-end blink */
        .bubble.assistant.is-streaming .stream-cursor {
            display: inline-block;
            width: 8px;
            height: 14px;
            background: var(--primary);
            margin-left: 4px;
            vertical-align: -2px;
            animation: pixel-cursor 0.6s step-end infinite;
        }
        @keyframes pixel-cursor {
            0%, 49.99% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .bubble .model-badge {
            display: inline-flex;
            margin-top: 10px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--muted);
            background: transparent;
            padding: 0;
        }
        .bubble.assistant .model-badge { color: var(--dark-muted); }

        .bubble img.generated {
            display: block;
            width: min(420px, 100%);
            margin-top: 10px;
            border: 1px solid var(--border);
            border-radius: 0;
            cursor: zoom-in;
        }
        body.studio-theme-dark .bubble img.generated { border-color: var(--dark-border); }

        .bubble .thumbs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }
        .bubble .thumb {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border: 1px solid var(--border);
            border-radius: 0;
        }
        .bubble.assistant .thumb { border-color: var(--dark-border); }

        .messages-empty {
            margin: auto;
            text-align: center;
            color: var(--muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: min(360px, 100%);
            padding: 24px;
            background: rgba(255, 250, 235, 0.72);
            border: 1px solid var(--border);
        }
        .messages-empty svg.pixel-icon { color: var(--primary); }
        .messages-empty .image-placeholder {
            width: 168px;
            height: 168px;
            aspect-ratio: auto;
            border: 1px solid var(--border);
        }
        .messages-empty .empty-label {
            font-family: var(--font-mono);
            font-size: 12px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        body.studio-theme-dark .messages-empty {
            background: rgba(28, 28, 30, 0.72);
            border-color: var(--dark-border);
        }

        /* ---------- Composer (底部输入栏) ---------- */
        .composer-wrap {
            border-top: 1px solid var(--border);
            background: rgba(255, 250, 235, 0.94);
            padding: 16px 24px 20px;
        }
        body.studio-theme-dark .composer-wrap {
            border-top-color: var(--dark-border);
            background: var(--dark-bg);
        }

        .composer {
            width: 100%;
            max-width: 880px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid var(--border);
        }
        body.studio-theme-dark .composer {
            background: rgba(28, 28, 30, 0.72);
            border-color: var(--dark-border);
        }

        /* mode 切换 + provider 切换：§15.7 radio-row 横向排 */
        .composer-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .radio-group {
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }
        .radio-group .group-label {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        /* image 控件：ratio + resolution 用 chip 风格 */
        .image-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .image-controls.is-hidden { display: none; }

        .chip-toggle {
            display: inline-flex;
            gap: 0;
            border: 1px solid var(--border);
        }
        body.studio-theme-dark .chip-toggle { border-color: var(--dark-border); }
        .chip-toggle button {
            background: var(--stage-bg);
            color: var(--ink);
            border: none;
            border-left: 1px solid var(--border);
            padding: 6px 10px;
            font-family: var(--font-mono);
            font-size: 11px;
            cursor: pointer;
            border-radius: 0;
            transition: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        body.studio-theme-dark .chip-toggle button {
            background: var(--dark-elev);
            color: var(--dark-text);
            border-left-color: var(--dark-border);
        }
        .chip-toggle button:first-child { border-left: none; }
        .chip-toggle button:hover { background: var(--bg-2); }
        body.studio-theme-dark .chip-toggle button:hover { background: var(--dark-surface); }
        .chip-toggle button.is-active {
            background: var(--ink);
            color: #fff;
        }
        body.studio-theme-dark .chip-toggle button.is-active {
            background: var(--primary);
            color: #fff;
        }

        /* 参考图 strip — 复用 design-system.css .ref-chip */
        .ref-strip {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            min-height: 0;
        }
        .ref-strip:empty { display: none; }

        /* textarea + send 横向 */
        .composer-input-row {
            display: flex;
            align-items: stretch;
            gap: 8px;
        }
        .composer-input-row .textarea {
            flex: 1;
            min-height: 56px;
            max-height: 200px;
            resize: none;
            line-height: 1.5;
            padding: 14px 16px;
        }
        .composer-input-row .send-btn {
            align-self: stretch;
            min-height: 56px;
            padding: 0 20px;
            white-space: nowrap;
        }

        .composer-input-row.is-drag-over .textarea {
            border-color: var(--ink);
            background: var(--bg-2);
        }
        body.studio-theme-dark .composer-input-row.is-drag-over .textarea {
            border-color: var(--primary);
        }

        /* hint footer */
        .composer-hint {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 0.04em;
        }
        body.studio-theme-dark .composer-hint { color: var(--dark-muted); }

        /* 响应式 */
        @media (max-width: 900px) {
            .chat-shell { grid-template-columns: 1fr; }
            .sidebar-history {
                display: none;
            }
            .sidebar-history.is-mobile-open {
                display: flex;
                position: fixed;
                inset: 0;
                z-index: 50;
                background: var(--bg);
                width: 280px;
                right: auto;
                border-right: 1px solid var(--border);
            }
        }
    </style>
</head>
<body>
    <!-- 像素图标 sprite —— 同文档引用 -->
    <svg width="0" height="0" style="position:absolute;width:0;height:0" aria-hidden="true">
        <use href="/static/icons/pixel.svg#chevron-right"/>
    </svg>

    <div class="chat-shell">

        <!-- =========================================================
             左侧 240px：历史会话列
             ========================================================= -->
        <aside class="sidebar-history" id="sidebarHistory">
            <div class="sidebar-header">
                <div class="section-tag">
                    <span>Threads</span>
                    <svg class="pixel-icon pixel-icon--sm"><use href="/static/icons/pixel.svg#chevron-down"/></svg>
                </div>
                <button class="btn-tonal new-btn" onclick="newConversation()" title="New conversation">
                    <span>New</span>
                    <svg class="pixel-icon pixel-icon--sm"><use href="/static/icons/pixel.svg#plus"/></svg>
                </button>
            </div>
            <div id="threadList" class="thread-list"></div>
        </aside>

        <!-- =========================================================
             右侧主区
             ========================================================= -->
        <section class="main-pane">

            <!-- 顶部条 -->
            <header class="top-bar">
                <div class="top-bar-left">
                    <div class="section-tag">
                        <span>Chat</span>
                        <svg class="pixel-icon pixel-icon--sm"><use href="/static/icons/pixel.svg#chevron-down"/></svg>
                    </div>
                    <div id="chatTitle" class="chat-title">新对话</div>
                </div>
                <div class="top-bar-right">
                    <div class="select-wrap">
                        <div id="modelSelect" class="select" onclick="toggleModelMenu()" role="button" aria-haspopup="listbox">
                            <span id="modelLabel">Ready</span>
                            <svg class="pixel-icon pixel-icon--sm"><use href="/static/icons/pixel.svg#chevron-down"/></svg>
                            <div class="select-menu" id="modelMenu" role="listbox"></div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- 消息区 -->
            <div id="messages" class="messages">
                <div class="messages-inner" id="messagesInner"></div>
            </div>

            <!-- 底部 composer -->
            <div class="composer-wrap">
                <div class="composer">

                    <!-- 工具栏：mode + provider + image 控件 -->
                    <div class="composer-toolbar">
                        <div class="toolbar-group">
                            <!-- Mode toggle: chat / image -->
                            <div class="radio-group" role="radiogroup" aria-label="Mode">
                                <span class="group-label">Mode</span>
                                <label class="radio-row">
                                    <input type="radio" name="mode" value="chat" checked onchange="setMode('chat')">
                                    <span class="radio-box"></span>
                                    <span>Chat</span>
                                </label>
                                <label class="radio-row">
                                    <input type="radio" name="mode" value="image" onchange="setMode('image')">
                                    <span class="radio-box"></span>
                                    <span>Image</span>
                                </label>
                            </div>

                            <!-- Provider toggle: comfly / modelscope (仅 chat 模式) -->
                            <div class="radio-group" role="radiogroup" aria-label="Provider" id="providerSwitchWrap">
                                <span class="group-label">Provider</span>
                                <label class="radio-row">
                                    <input type="radio" name="provider" value="comfly" checked onchange="setProvider('comfly')">
                                    <span class="radio-box"></span>
                                    <span>API</span>
                                </label>
                                <label class="radio-row">
                                    <input type="radio" name="provider" value="modelscope" onchange="setProvider('modelscope')">
                                    <span class="radio-box"></span>
                                    <span>ModelScope</span>
                                </label>
                            </div>
                        </div>

                        <!-- Image 模式控件：比例 + 分辨率 -->
                        <div id="imageControls" class="image-controls is-hidden">
                            <div class="chip-toggle" role="radiogroup" aria-label="Aspect">
                                <button id="chat-ratio-square" class="is-active" onclick="setChatRatio('square')">1:1</button>
                                <button id="chat-ratio-portrait" onclick="setChatRatio('portrait')">2:3</button>
                                <button id="chat-ratio-landscape" onclick="setChatRatio('landscape')">3:2</button>
                                <button id="chat-ratio-story" onclick="setChatRatio('story')">9:16</button>
                                <button id="chat-ratio-wide" onclick="setChatRatio('wide')">16:9</button>
                            </div>
                            <div class="chip-toggle" role="radiogroup" aria-label="Resolution">
                                <button id="chat-res-1k" class="is-active" onclick="setChatResolution('1k')">1K</button>
                                <button id="chat-res-2k" onclick="setChatResolution('2k')">2K</button>
                            </div>
                        </div>
                    </div>

                    <!-- 参考图条 -->
                    <div id="refStrip" class="ref-strip"></div>

                    <!-- textarea + send -->
                    <div class="composer-input-row" id="composerInputRow">
                        <textarea
                            id="messageInput"
                            class="textarea"
                            rows="2"
                            placeholder="输入消息或拖入参考图"
                            oninput="autoGrow(this)"
                            onkeydown="handleKey(event)"></textarea>
                        <button id="sendBtn" class="btn-primary send-btn" onclick="sendMessage()" title="Send">
                            <span>Send</span>
                            <svg class="pixel-icon pixel-icon--sm"><use href="/static/icons/pixel.svg#send"/></svg>
                        </button>
                    </div>

                    <div class="composer-hint">
                        <span>Ready</span>
                        <span id="hintRight"></span>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        /* ============================================================
           gpt-chat 业务逻辑
           ============================================================ */

        function uuid() {
            if (crypto?.randomUUID) return crypto.randomUUID();
            return 'u-' + Math.random().toString(16).slice(2) + Date.now();
        }

        // ---------- 用户与状态 ----------
        const USER_KEY = 'gpt_chat_browser_user';
        const userId = localStorage.getItem(USER_KEY) || uuid();
        localStorage.setItem(USER_KEY, userId);

        let conversations = [];
        let currentConversation = null;
        let mode = 'chat';
        let provider = 'comfly';
        let msModel = '';
        let chatRatio = 'square';
        let chatResolution = '1k';
        let refs = [];
        let config = { chat_model: 'gpt-5.5', image_model: 'gpt-image-1', ms_chat_models: [], chat_models: [] };

        const SIZE_OPTIONS = {
            square: [['1024x1024','1k'], ['1536x1536','2k']],
            portrait: [['720x1080','1k'], ['1024x1536','2k']],
            landscape: [['1080x720','1k'], ['1536x1024','2k']],
            story: [['720x1280','1k'], ['1080x1920','2k']],
            wide: [['1280x720','1k'], ['1920x1080','2k']]
        };

        const headers = () => ({'Content-Type': 'application/json', 'X-User-ID': userId});

        // ---------- 配置 ----------
        async function loadConfig() {
            try {
                const data = await fetch('/api/config').then(r => r.json());
                config = { ...config, ...data };
                config.chat_model = (config.chat_models || []).find(m => m === 'gpt-5.5') || config.chat_model || 'gpt-5.5';
                if (config.ms_chat_models?.length) msModel = config.ms_chat_models[0];
                updateModelLabel();
                renderModelMenu();
            } catch (e) { /* 静默 */ }
        }

        // ---------- 模型选择器（§15.3 select） ----------
        function toggleModelMenu(force) {
            const el = document.getElementById('modelSelect');
            const shouldOpen = typeof force === 'boolean' ? force : !el.classList.contains('is-open');
            el.classList.toggle('is-open', shouldOpen);
            if (shouldOpen) renderModelMenu();
        }
        document.addEventListener('click', (event) => {
            const wrap = document.getElementById('modelSelect');
            if (wrap && !wrap.contains(event.target)) toggleModelMenu(false);
        });

        function renderModelMenu() {
            const menu = document.getElementById('modelMenu');
            if (!menu) return;
            const items = [];
            if (mode === 'image') {
                items.push({ value: config.image_model || 'gpt-image-1', label: config.image_model || 'gpt-image-1', kind: 'image' });
            } else if (provider === 'modelscope') {
                (config.ms_chat_models || []).forEach(m => {
                    const short = m.split('/').pop().split(':')[0];
                    items.push({ value: m, label: short, raw: m, kind: 'ms' });
                });
            } else {
                (config.chat_models || [config.chat_model]).forEach(m => {
                    items.push({ value: m, label: m, kind: 'chat' });
                });
            }
            menu.innerHTML = items.map(it => {
                const isSelected =
                    (it.kind === 'ms' && it.value === msModel) ||
                    (it.kind === 'chat' && it.value === config.chat_model) ||
                    (it.kind === 'image' && it.value === config.image_model);
                return `
                    <div class="menu-item ${isSelected ? 'is-selected' : ''}" data-kind="${it.kind}" data-value="${escapeHtml(it.value)}" onclick="pickModel('${it.kind}','${escapeHtml(it.value)}')">
                        <svg class="pixel-icon pixel-icon--sm" style="visibility:${isSelected ? 'visible' : 'hidden'}"><use href="/static/icons/pixel.svg#check"/></svg>
                        <span>${escapeHtml(it.label)}</span>
                    </div>
                `;
            }).join('');
            if (!items.length) {
                menu.innerHTML = `<div class="menu-item" style="color:var(--muted)">No model</div>`;
            }
        }

        function pickModel(kind, value) {
            if (kind === 'ms') msModel = value;
            else if (kind === 'chat') config.chat_model = value;
            else if (kind === 'image') config.image_model = value;
            updateModelLabel();
            toggleModelMenu(false);
        }

        function updateModelLabel() {
            let label = '';
            if (mode === 'image') {
                label = config.image_model || 'Image';
            } else if (provider === 'modelscope') {
                label = msModel || (config.ms_chat_models?.[0]) || 'ModelScope';
                label = label.split('/').pop().split(':')[0];
            } else {
                label = config.chat_model || 'Chat';
            }
            document.getElementById('modelLabel').textContent = label;
        }

        function setProvider(p) {
            provider = p;
            updateModelLabel();
            renderModelMenu();
        }

        // ---------- Mode 切换 ----------
        function setMode(next) {
            mode = next;
            document.getElementById('imageControls').classList.toggle('is-hidden', next !== 'image');
            document.getElementById('providerSwitchWrap').style.display = next === 'image' ? 'none' : '';
            updateModelLabel();
            renderModelMenu();
        }

        function setChatRatio(next) {
            chatRatio = next;
            ['square','portrait','landscape','story','wide'].forEach(item => {
                const el = document.getElementById(`chat-ratio-${item}`);
                if (el) el.classList.toggle('is-active', item === next);
            });
        }
        function setChatResolution(next) {
            chatResolution = next;
            document.getElementById('chat-res-1k').classList.toggle('is-active', next === '1k');
            document.getElementById('chat-res-2k').classList.toggle('is-active', next === '2k');
        }
        function currentChatSize() {
            const options = SIZE_OPTIONS[chatRatio] || SIZE_OPTIONS.square;
            const match = options.find(([, label]) => label === chatResolution) || options[0];
            return match[0];
        }

        // ---------- 会话列表 ----------
        async function loadConversations() {
            const data = await fetch('/api/conversations', {headers: {'X-User-ID': userId}}).then(r => r.json());
            conversations = data.conversations || [];
            renderThreads();
            if (!currentConversation && conversations[0]) await openConversation(conversations[0].id);
            if (!currentConversation) renderMessages([]);
        }

        function renderThreads() {
            const list = document.getElementById('threadList');
            list.innerHTML = '';
            if (!conversations.length) {
                list.innerHTML = `<div class="sidebar-empty">No history yet.</div>`;
                return;
            }
            conversations.forEach(item => {
                const row = document.createElement('div');
                row.className = 'thread-row';

                const btn = document.createElement('button');
                const isActive = currentConversation?.id === item.id;
                btn.className = `thread-item ${isActive ? 'is-active' : ''}`;
                btn.onclick = () => openConversation(item.id);
                btn.innerHTML = `
                    <svg class="pixel-icon pixel-icon--sm"><use href="/static/icons/pixel.svg#chevron-right"/></svg>
                    <div class="thread-text">
                        <div class="thread-title">${escapeHtml(item.title || '新对话')}</div>
                        <div class="thread-sub">${escapeHtml(item.last_message || '')}</div>
                    </div>
                `;

                const del = document.createElement('button');
                del.className = 'thread-delete';
                del.title = 'Delete';
                del.onclick = (event) => deleteConversation(item.id, event);
                del.innerHTML = `<svg class="pixel-icon pixel-icon--sm"><use href="/static/icons/pixel.svg#trash"/></svg>`;

                row.appendChild(btn);
                row.appendChild(del);
                list.appendChild(row);
            });
        }

        async function newConversation() {
            const data = await fetch('/api/conversations', {
                method: 'POST',
                headers: headers(),
                body: JSON.stringify({ title: '新对话' })
            }).then(r => r.json());
            currentConversation = data.conversation;
            document.getElementById('chatTitle').textContent = currentConversation.title || '新对话';
            await loadConversations();
            renderMessages([]);
        }

        async function openConversation(id) {
            const data = await fetch(`/api/conversations/${id}`, {headers: {'X-User-ID': userId}}).then(r => r.json());
            currentConversation = data.conversation;
            document.getElementById('chatTitle').textContent = currentConversation.title || '新对话';
            renderThreads();
            renderMessages(currentConversation.messages || []);
        }

        async function deleteConversation(id, event) {
            event.stopPropagation();
            if (!confirm('删除这条历史对话？')) return;
            await fetch(`/api/conversations/${id}`, {method: 'DELETE', headers: {'X-User-ID': userId}});
            const deletedCurrent = currentConversation?.id === id;
            if (deletedCurrent) {
                currentConversation = null;
                document.getElementById('chatTitle').textContent = '新对话';
                renderMessages([]);
            }
            await loadConversations();
            if (deletedCurrent && conversations[0]) await openConversation(conversations[0].id);
        }

        // ---------- 消息渲染 ----------
        function renderMessages(messages) {
            const inner = document.getElementById('messagesInner');
            inner.innerHTML = '';
            if (!messages.length) {
                inner.innerHTML = `
                    <div class="messages-empty">
                        <div class="image-placeholder" aria-hidden="true">
                            <svg class="pixel-icon pixel-icon--xl"><use href="/static/icons/pixel.svg#nav-chat"/></svg>
                        </div>
                        <div class="empty-label">Ready</div>
                    </div>
                `;
                return;
            }
            messages.forEach(addMessageBubble);
            scrollBottom();
        }

        function addMessageBubble(msg) {
            const inner = document.getElementById('messagesInner');
            const row = document.createElement('div');
            row.className = `bubble-row ${msg.role === 'user' ? 'user' : 'assistant'}`;

            const bubble = document.createElement('div');
            bubble.className = `bubble ${msg.role === 'user' ? 'user' : 'assistant'}`;

            const text = document.createElement('div');
            text.className = 'bubble-text';
            text.textContent = msg.type === 'image' ? '生成完成' : (msg.content || '');
            bubble.appendChild(text);

            if (msg.attachments?.length) {
                const thumbs = document.createElement('div');
                thumbs.className = 'thumbs';
                msg.attachments.forEach(ref => {
                    const img = document.createElement('img');
                    img.className = 'thumb';
                    img.src = ref.url;
                    thumbs.appendChild(img);
                });
                bubble.appendChild(thumbs);
            }
            if (msg.image_url) {
                const img = document.createElement('img');
                img.className = 'generated';
                img.src = msg.image_url;
                img.onclick = () => window.open(msg.image_url, '_blank');
                bubble.appendChild(img);
            }
            if (msg.role === 'assistant' && msg.model) {
                const badge = document.createElement('div');
                badge.className = 'model-badge';
                badge.textContent = msg.model.split('/').pop().split(':')[0];
                bubble.appendChild(badge);
            }

            row.appendChild(bubble);
            inner.appendChild(row);
            return { row, bubble, text };
        }

        // ---------- 参考图 ----------
        async function uploadFiles(files) {
            if (!files?.length) return;
            const form = new FormData();
            [...files].slice(0, 4 - refs.length).forEach(file => form.append('files', file));
            const data = await fetch('/api/ai/upload', {method: 'POST', body: form}).then(r => r.json());
            refs.push(...(data.files || []));
            renderRefs();
        }

        function renderRefs() {
            const strip = document.getElementById('refStrip');
            strip.innerHTML = refs.map((ref, i) => `
                <div class="ref-chip">
                    <img src="${ref.url}" alt="ref">
                    <button class="ref-remove" type="button" onclick="removeRef(${i})" aria-label="Remove">
                        <svg class="pixel-icon pixel-icon--xs" style="color:#fff"><use href="/static/icons/pixel.svg#cross"/></svg>
                    </button>
                </div>
            `).join('');
        }

        function removeRef(i) { refs.splice(i, 1); renderRefs(); }

        window.addEventListener('paste', e => {
            const files = [...(e.clipboardData?.items || [])]
                .filter(x => x.kind === 'file' && x.type.startsWith('image/'))
                .map(x => x.getAsFile());
            if (files.length) uploadFiles(files);
        });

        const composerInputRow = document.getElementById('composerInputRow');
        composerInputRow.addEventListener('dragover', e => {
            if (!hasImageFiles(e.dataTransfer?.items)) return;
            e.preventDefault();
            composerInputRow.classList.add('is-drag-over');
        });
        composerInputRow.addEventListener('dragleave', e => {
            if (!composerInputRow.contains(e.relatedTarget)) composerInputRow.classList.remove('is-drag-over');
        });
        composerInputRow.addEventListener('drop', e => {
            if (!hasImageFiles(e.dataTransfer?.items)) return;
            e.preventDefault();
            composerInputRow.classList.remove('is-drag-over');
            const files = [...(e.dataTransfer?.files || [])].filter(file => file.type.startsWith('image/'));
            uploadFiles(files);
        });

        function hasImageFiles(items) {
            return [...(items || [])].some(item => item.kind === 'file' && item.type.startsWith('image/'));
        }
        function autoGrow(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 200) + 'px';
        }
        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        }

        // ---------- 发送 ----------
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;
            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            const pendingRefs = refs.slice();
            refs = [];
            renderRefs();
            input.value = '';
            autoGrow(input);

            if (!currentConversation) {
                currentConversation = { id: '', title: '新对话', messages: [] };
                document.getElementById('messagesInner').innerHTML = '';
            }
            addMessageBubble({ role: 'user', content: message, attachments: pendingRefs });
            const assistantBubble = addMessageBubble({
                role: 'assistant',
                content: mode === 'image' ? '正在生成图片...' : ''
            });
            if (mode === 'chat') {
                assistantBubble.bubble.classList.add('is-streaming');
                // 末尾像素 cursor 占位
                const cursor = document.createElement('span');
                cursor.className = 'stream-cursor';
                assistantBubble.bubble.appendChild(cursor);
            }
            scrollBottom();

            try {
                if (mode === 'chat') {
                    await streamChatMessage(message, pendingRefs, assistantBubble);
                } else {
                    /* 保持 image 模式 schema 不变：POST /api/chat */
                    const data = await fetch('/api/chat', {
                        method: 'POST',
                        headers: headers(),
                        body: JSON.stringify({
                            conversation_id: currentConversation.id || '',
                            message,
                            mode,
                            size: currentChatSize(),
                            model: config.chat_model,
                            image_model: config.image_model,
                            reference_images: pendingRefs,
                            provider: 'comfly',
                        })
                    }).then(async r => {
                        if (!r.ok) throw new Error((await r.json()).detail || '请求失败');
                        return r.json();
                    });
                    currentConversation = data.conversation;
                    document.getElementById('chatTitle').textContent = currentConversation.title || '新对话';
                    renderMessages(currentConversation.messages || []);
                    await loadConversations();
                }
            } catch (err) {
                renderMessages([
                    ...(currentConversation.messages || []),
                    { role: 'assistant', content: err.message || '请求失败' }
                ]);
            } finally {
                btn.disabled = false;
                scrollBottom();
            }
        }

        // ---------- SSE 流式（§17.3 24px chunk + 200ms fallback） ----------
        async function streamChatMessage(message, pendingRefs, assistantBubble) {
            const currentProvider = provider;
            const currentMsModel = msModel || (config.ms_chat_models?.[0] || '');
            const currentChatModel = config.chat_model;

            /* ⚠️ schema 保持与原版一致：conversation_id / message / mode / model / ms_model / provider / reference_images */
            const res = await fetch('/api/chat/stream', {
                method: 'POST',
                headers: headers(),
                body: JSON.stringify({
                    conversation_id: currentConversation.id || '',
                    message,
                    mode: 'chat',
                    model: currentProvider === 'modelscope' ? currentMsModel : currentChatModel,
                    ms_model: currentProvider === 'modelscope' ? currentMsModel : '',
                    provider: currentProvider,
                    reference_images: pendingRefs
                })
            });
            if (!res.ok) throw new Error((await res.json()).detail || '请求失败');

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let sseBuffer = '';
            let fullText = '';

            /* === Chunk Flush 状态：按 24 字符或 200ms 一次性 flush，
                  避免逐字 typewriter 与像素美学冲突 === */
            let chunkBuffer = '';
            let lastFlush = Date.now();

            function flushChunk() {
                if (!chunkBuffer) return;
                fullText += chunkBuffer;
                assistantBubble.text.textContent = fullText;
                chunkBuffer = '';
                lastFlush = Date.now();
                scrollBottom();
            }

            // 弱网 fallback：即使 delta 没到 24 字符也按 200ms 强制 flush
            const flushTimer = setInterval(() => {
                if (chunkBuffer && Date.now() - lastFlush > 200) flushChunk();
            }, 80);

            try {
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    sseBuffer += decoder.decode(value, { stream: true });
                    const events = sseBuffer.split('\n\n');
                    sseBuffer = events.pop() || '';
                    for (const eventText of events) {
                        const line = eventText.split('\n').find(item => item.startsWith('data:'));
                        if (!line) continue;
                        const event = JSON.parse(line.slice(5).trim());

                        if (event.type === 'meta') {
                            currentConversation = event.conversation;
                            document.getElementById('chatTitle').textContent = currentConversation.title || '新对话';
                        }
                        if (event.type === 'delta') {
                            /* §17.3 核心：累积 delta，达到 24 字符 chunk 才 flush */
                            chunkBuffer += event.delta || '';
                            if (chunkBuffer.length >= 24 || Date.now() - lastFlush > 200) {
                                flushChunk();
                            }
                        }
                        if (event.type === 'error') throw new Error(event.detail || '请求失败');
                        if (event.type === 'done') {
                            // 收到 done 强制把残留 chunk flush 出来
                            flushChunk();
                            assistantBubble.bubble.classList.remove('is-streaming');
                            // 移除末尾像素 cursor
                            const cursor = assistantBubble.bubble.querySelector('.stream-cursor');
                            if (cursor) cursor.remove();
                            currentConversation = event.conversation;
                            document.getElementById('chatTitle').textContent = currentConversation.title || '新对话';
                            renderMessages(currentConversation.messages || []);
                            await loadConversations();
                        }
                    }
                }
                // 流结束兜底 flush
                flushChunk();
            } finally {
                clearInterval(flushTimer);
                assistantBubble.bubble.classList.remove('is-streaming');
                const cursor = assistantBubble.bubble.querySelector('.stream-cursor');
                if (cursor) cursor.remove();
            }
        }

        // ---------- 工具 ----------
        function scrollBottom() {
            requestAnimationFrame(() => {
                const box = document.getElementById('messages');
                box.scrollTop = box.scrollHeight;
            });
        }
        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, s => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[s]));
        }

        // ---------- 初始化 ----------
        window.addEventListener('DOMContentLoaded', async () => {
            setChatRatio('square');
            setChatResolution('1k');
            await loadConfig();
            await loadConversations();
        });
    </script>
</body>
