<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/logo.png" type="image/png">
    <title>Image edit · Infinite-Canvas</title>
    <link rel="stylesheet" href="/static/design-system.css?v=23">
    <script src="/static/theme.js?v=20260512c"></script>
    <style>
        /* ============================================================
           klein.html 页内特化样式（DESIGN.md v2.1 §17.2 模板）
           - 不重新定义 token，所有色值来自 design-system.css
           - 仅添加 §17.2 左右两栏布局 + 3 上传插槽 + engine dark glass
           ============================================================ */
        html, body { height: 100%; }
        body {
            background: var(--bg);
            background-image:
                linear-gradient(to right,  rgba(230, 213, 168, 0.55) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(230, 213, 168, 0.55) 1px, transparent 1px);
            background-size: 80px 80px;
            min-height: 100vh;
        }
        body.studio-theme-dark {
            background-color: var(--dark-bg);
            background-image:
                linear-gradient(to right,  rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        /* §17.2 主布局：左 380 参数面板 + 右栏图片网格 */
        .page-wrap {
            display: flex;
            min-height: 100vh;
            gap: 0;
        }
        .param-panel {
            width: 380px;
            flex-shrink: 0;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid var(--border);
            background: transparent;
        }
        body.studio-theme-dark .param-panel { border-right-color: var(--dark-border); }

        .stage-main {
            flex: 1;
            padding: 32px 32px 64px 32px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            min-width: 0;
        }

        /* 参数字段分组 */
        .field { display: flex; flex-direction: column; gap: 8px; }
        .field-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 500;
            color: var(--ink);
        }
        .field-hint {
            font-size: 12px;
            color: var(--muted);
            font-weight: 400;
        }

        /* 右栏顶部标题区 */
        .stage-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        /* —— 3 上传插槽（核心：§15.8 dropzone 横向 3 列）—— */
        .slot-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }
        /* 紧凑版 dropzone，覆盖部分 .dropzone 默认 padding/min-height */
        .slot-dropzone {
            min-height: 110px;
            padding: 12px 8px;
            gap: 6px;
            position: relative;
            overflow: hidden;
        }
        .slot-dropzone .slot-label {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .slot-dropzone.has-file .slot-label {
            position: absolute;
            top: 6px;
            left: 8px;
            z-index: 2;
            background: var(--ink);
            color: #fff;
            padding: 2px 6px;
            font-size: 10px;
        }
        .slot-dropzone .slot-thumb {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .slot-dropzone.has-file .slot-thumb { display: block; }
        .slot-dropzone .slot-remove {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 16px;
            height: 16px;
            background: var(--ink);
            color: #fff;
            border: none;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3;
            padding: 0;
            border-radius: 0;
        }
        .slot-dropzone.has-file .slot-remove { display: inline-flex; }
        .slot-dropzone .slot-remove:hover { background: var(--primary-deep); }

        /* —— Engine panel: §8.3 Dark Glass Card（即使 light 模式也是暗色，作为视觉强调） —— */
        .engine-card {
            background: var(--dark-elev);
            color: var(--dark-text);
            border: 1px solid var(--dark-border);
            border-radius: 0;
            padding: 16px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .engine-card .engine-title {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--dark-muted);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .engine-card .engine-title .pixel-icon { color: var(--primary); }
        .engine-card .radio-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .engine-card .radio-row {
            padding: 10px 12px;
            background: #26262a;
            border: 1px solid var(--dark-border);
            color: var(--dark-text);
            font-size: 13px;
        }
        /* 当前激活的 radio 视觉强调（橙色 1px 边） */
        .engine-card .radio-row.is-active {
            border-color: var(--primary);
        }
        .engine-card .radio-row .radio-box {
            background: #1a1a1c;
            border-color: var(--dark-border);
        }
        .engine-card .engine-divider {
            height: 1px;
            background: var(--dark-border);
            margin: 4px 0;
        }
        .engine-card .lora-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .engine-card .lora-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--dark-text);
        }
        .engine-card .lora-label .field-hint { color: var(--dark-muted); }
        /* slider 在 dark engine card 内的覆盖（track 用 dark border、fill 用 primary 橙） */
        .engine-card .slider-track {
            background: var(--dark-border);
        }
        .engine-card .slider-track .slider-fill {
            background: var(--primary);
        }
        .engine-card .slider-value {
            background: #26262a;
            color: var(--dark-text);
        }
        .engine-card .checkbox-row {
            color: var(--dark-text);
        }
        .engine-card .checkbox-row .check-box {
            background: #1a1a1c;
            border-color: var(--dark-border);
        }

        /* engine status 提示行 */
        .engine-status {
            display: none;
            align-items: center;
            gap: 8px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--dark-muted);
        }
        .engine-status.is-visible { display: inline-flex; }

        /* 图片网格里的"正在生成"占位卡 */
        .render-placeholder {
            display: flex;
            flex-direction: column;
        }
        .render-placeholder .image-placeholder { aspect-ratio: 1 / 1; }
        .render-placeholder .placeholder-meta {
            background: var(--bg-2);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        body.studio-theme-dark .render-placeholder .placeholder-meta {
            background: var(--dark-elev);
            color: var(--dark-text);
        }

        /* empty state */
        .stage-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 64px 16px;
            min-height: 320px;
            color: var(--muted);
        }
        .stage-empty .image-placeholder { width: 160px; height: 160px; aspect-ratio: auto; }

        /* —— Lightbox (DESIGN.md §16.5 spec：纯黑 .92，无 backdrop-blur) —— */
        .lightbox-mask {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(15, 15, 15, 0.92);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 48px;
        }
        .lightbox-mask.is-open { display: flex; }
        .lightbox-actions {
            position: absolute;
            top: 24px;
            right: 24px;
            display: inline-flex;
            gap: 8px;
            z-index: 2;
        }
        .lightbox-actions .lb-btn {
            width: 32px;
            height: 32px;
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 0;
        }
        .lightbox-actions .lb-btn:hover { background: rgba(255, 255, 255, 0.08); }
        .lightbox-actions .lb-btn .pixel-icon { color: #fff; }
        .lightbox-meta {
            position: absolute;
            top: 24px;
            left: 24px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: var(--ink);
            color: #fff;
            font-family: var(--font-mono);
            font-size: 12px;
        }
        .lightbox-stage {
            position: relative;
            width: min(1200px, calc(100vw - 96px));
            max-height: calc(100vh - 192px);
            aspect-ratio: 16 / 10;
            background: #000;
            overflow: hidden;
            user-select: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lightbox-stage.is-compare { border-color: var(--primary); }
        .lightbox-stage img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }
        #compareOriginalWrapper {
            position: absolute;
            inset: 0;
            overflow: hidden;
            clip-path: inset(0 50% 0 0);
        }
        #compareSliderLine {
            position: absolute;
            top: 0; bottom: 0;
            left: 50%;
            width: 1px;
            background: var(--primary);
            transform: translateX(-50%);
            cursor: ew-resize;
            z-index: 3;
        }
        #compareSliderHandle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 14px;
            height: 14px;
            background: var(--primary);
            border: 1px solid var(--ink);
            transform: translate(-50%, -50%);
            cursor: ew-resize;
            transition: none;
        }
        .compare-tag {
            position: absolute;
            top: 16px;
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            background: var(--ink);
            color: #fff;
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.04em;
            z-index: 2;
            pointer-events: none;
        }
        .compare-tag--before { left: 16px; }
        .compare-tag--after  { right: 16px; }
        .lightbox-footer {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            display: inline-flex;
            gap: 12px;
            z-index: 2;
        }
        .action-btn .pixel-icon { color: var(--ink); }
        body.studio-theme-dark .action-btn .pixel-icon { color: var(--dark-text); }

        @media (max-width: 1024px) {
            .page-wrap { flex-direction: column; }
            .param-panel {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
        }
    </style>
</head>

<body>
    <div class="page-wrap">
        <!-- ================== 左：380px 参数面板 ================== -->
        <aside class="param-panel">
            <!-- 顶部 §6 黑色 section-tag -->
            <div>
                <span class="section-tag">
                    Image edit
                    <svg class="pixel-icon pixel-icon--sm" aria-hidden="true"><use href="#chevron-down"/></svg>
                </span>
            </div>

            <!-- 核心：3 个并排上传插槽（§15.8 dropzone 紧凑版 + §16.7 缩略图 + 删除浮块） -->
            <div class="field">
                <label class="field-label">
                    Reference layers
                    <span class="field-hint">Main required</span>
                </label>
                <div class="slot-grid">
                    <div id="drop-zone-1" class="dropzone slot-dropzone" onclick="document.getElementById('file1').click()">
                        <input type="file" id="file1" accept="image/*" style="display:none" onchange="handleFile(this.files[0], 1)">
                        <img id="prev1" class="slot-thumb" alt="main">
                        <svg class="pixel-icon" style="width:18px;height:18px;color:var(--primary)" aria-hidden="true"><use href="#upload"/></svg>
                        <span class="slot-label">Main</span>
                        <button id="del1" class="slot-remove" type="button" onclick="clearSlot(1, event)" title="Remove">
                            <svg class="pixel-icon pixel-icon--sm"><use href="#cross"/></svg>
                        </button>
                    </div>
                    <div id="drop-zone-2" class="dropzone slot-dropzone" onclick="document.getElementById('file2').click()">
                        <input type="file" id="file2" accept="image/*" style="display:none" onchange="handleFile(this.files[0], 2)">
                        <img id="prev2" class="slot-thumb" alt="aux a">
                        <svg class="pixel-icon" style="width:18px;height:18px;color:var(--primary)" aria-hidden="true"><use href="#plus"/></svg>
                        <span class="slot-label">Aux A</span>
                        <button id="del2" class="slot-remove" type="button" onclick="clearSlot(2, event)" title="Remove">
                            <svg class="pixel-icon pixel-icon--sm"><use href="#cross"/></svg>
                        </button>
                    </div>
                    <div id="drop-zone-3" class="dropzone slot-dropzone" onclick="document.getElementById('file3').click()">
                        <input type="file" id="file3" accept="image/*" style="display:none" onchange="handleFile(this.files[0], 3)">
                        <img id="prev3" class="slot-thumb" alt="aux b">
                        <svg class="pixel-icon" style="width:18px;height:18px;color:var(--primary)" aria-hidden="true"><use href="#plus"/></svg>
                        <span class="slot-label">Aux B</span>
                        <button id="del3" class="slot-remove" type="button" onclick="clearSlot(3, event)" title="Remove">
                            <svg class="pixel-icon pixel-icon--sm"><use href="#cross"/></svg>
                        </button>
                    </div>
                </div>
                <span class="field-hint">PNG / JPG, drag &amp; drop, click, or paste while hovering</span>
            </div>

            <!-- 提示词 §15.2 -->
            <div class="field">
                <label class="field-label" for="promptInput">
                    Prompt
                    <span class="field-hint">node 168</span>
                </label>
                <textarea id="promptInput" class="textarea" rows="4"
                    placeholder="Describe how to edit the image…"></textarea>
            </div>

            <!-- Seed §15.5 number-input -->
            <div class="field">
                <label class="field-label">
                    Seed
                    <span class="field-hint">node 158</span>
                </label>
                <div style="display:flex; align-items:center; gap:12px;">
                    <div class="number-input">
                        <button type="button" class="num-btn" onclick="seedDelta(-1)">-</button>
                        <input type="text" id="seedInput" value="0" inputmode="numeric"
                            onchange="commitSeed(this.value)">
                        <button type="button" class="num-btn" onclick="seedDelta(1)">+</button>
                    </div>
                    <label class="checkbox-row">
                        <input type="checkbox" id="seedRandom" checked>
                        <span class="check-box"></span>
                        <span>Random</span>
                    </label>
                </div>
            </div>

            <!-- Engine panel: §8.3 dark glass card -->
            <div class="engine-card">
                <div class="engine-title">
                    <svg class="pixel-icon pixel-icon--sm" aria-hidden="true"><use href="#chevron-right"/></svg>
                    Engine
                </div>
                <div class="radio-grid" id="engineSwitch">
                    <label class="radio-row is-active" data-engine="local">
                        <input type="radio" name="provider" value="local" checked>
                        <span class="radio-box"></span>
                        <span>Local · ComfyUI</span>
                    </label>
                    <label class="radio-row" data-engine="cloud">
                        <input type="radio" name="provider" value="cloud">
                        <span class="radio-box"></span>
                        <span>Cloud · Klein</span>
                    </label>
                </div>
                <div id="engineStatus" class="engine-status">
                    <span class="pixel-dot-pulse" style="color: var(--primary)">
                        <span></span><span></span><span></span>
                    </span>
                    <span id="engineStatusText">Ready</span>
                </div>

                <!-- Cloud-only LoRA strength -->
                <div id="loraSection" style="display:none; flex-direction:column; gap:10px;">
                    <div class="engine-divider"></div>
                    <label class="checkbox-row">
                        <input type="checkbox" id="loraToggle" onchange="toggleLora()">
                        <span class="check-box"></span>
                        <span>Detail-enhance LoRA</span>
                    </label>
                    <div id="loraStrengthRow" class="lora-row" style="display:none;">
                        <div class="lora-label">
                            <span>LoRA strength</span>
                            <span id="loraVal" class="slider-value">0.80</span>
                        </div>
                        <div class="slider">
                            <div class="slider-track" id="loraTrack">
                                <div class="slider-fill"   id="loraFill"   style="width:78%"></div>
                                <div class="slider-handle" id="loraHandle" style="left:78%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 主 CTA §7.1 -->
            <div style="margin-top:auto; padding-top:16px;">
                <button id="genBtn" type="button" class="btn-primary" onclick="submitWorkflow()" style="width:100%; justify-content:center;">
                    <span id="btnText">Edit</span>
                    <svg class="pixel-icon pixel-icon--sm" aria-hidden="true"><use href="#chevron-right"/></svg>
                </button>
            </div>
        </aside>

        <!-- ================== 右：网格主区 ================== -->
        <main class="stage-main">
            <div class="stage-header">
                <span class="section-tag">
                    <span id="archiveCountLabel">Recent edits (0)</span>
                    <svg class="pixel-icon pixel-icon--sm" aria-hidden="true"><use href="#chevron-down"/></svg>
                </span>
                <span class="text-mono text-muted">Tap any card to open before / after compare</span>
            </div>

            <!-- §16.2 image-grid 4 列 -->
            <div id="imageGrid" class="image-grid">
                <div id="emptyState" class="stage-empty" style="grid-column: 1 / -1;">
                    <div class="image-placeholder"></div>
                    <div class="text-body">No edits yet</div>
                    <div class="field-hint">Upload Main image, write a prompt and press Edit</div>
                </div>
            </div>

            <div id="loadMoreTrigger"
                class="text-mono text-muted"
                style="text-align:center; padding:24px 0; cursor:pointer; display:none;">
                Load more
            </div>
        </main>
    </div>

    <!-- =================================================================
         Lightbox (§16.5)：纯黑 .92，无 backdrop-blur
         若有原图 (params["278"].image) → before/after 滑块对比
         否则 → 单图展示
         ================================================================= -->
    <div id="lightbox" class="lightbox-mask" onclick="handleLightboxOutside(event)">
        <div class="lightbox-meta" id="lightboxMeta" style="display:none">
            <svg class="pixel-icon pixel-icon--sm"><use href="#chevron-right"/></svg>
            <span id="lightboxResText">— × —</span>
        </div>
        <div class="lightbox-actions">
            <button class="lb-btn" type="button" onclick="downloadLightbox()" title="Download">
                <svg class="pixel-icon pixel-icon--sm"><use href="#download"/></svg>
            </button>
            <button class="lb-btn" type="button" onclick="closeLightbox()" title="Close">
                <svg class="pixel-icon pixel-icon--sm"><use href="#cross"/></svg>
            </button>
        </div>

        <div class="lightbox-stage" id="compareStage">
            <img id="compareGenerated" alt="after">
            <div id="compareOriginalWrapper">
                <img id="compareOriginal" alt="before">
            </div>
            <span class="compare-tag compare-tag--before">BEFORE</span>
            <span class="compare-tag compare-tag--after">AFTER</span>
            <div id="compareSliderLine">
                <div id="compareSliderHandle"></div>
            </div>
            <img id="lightboxSingle" alt="result" style="display:none">
        </div>

        <div class="lightbox-footer">
            <button class="btn-tonal" id="sameStyleBtn" type="button" onclick="applySameStyle()"
                style="display:none; background:var(--bg-2); color:var(--ink);">
                <svg class="pixel-icon pixel-icon--sm"><use href="#copy"/></svg>
                Replicate
            </button>
        </div>
    </div>

    <script>
        /* ============================================================
           klein.html 业务逻辑
           - 保留两条 API 路径（schema 不动）：
             1) POST /api/generate workflow_json="Flux2-Klein.json"
                params:
                  "168" { text: prompt }
                  "158" { noise_seed: int }
                  "278" { image: uploadedNames[1] }  // main
                  "270" { image: uploadedNames[2] }  // aux A
                  "292" { image: uploadedNames[3] }  // aux B
                  "313" { value: hasAuxA }
                  "314" { value: hasAuxB }
             2) POST /api/ms/generate (云端 Klein + LoRA)
                fields: prompt, model, image_urls[], loras{}, client_id
             3) POST /api/upload + /api/history?type=klein 保持不变
           ============================================================ */

        function generateUUID() {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                try { return crypto.randomUUID(); } catch (e) { }
            }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        const CLIENT_ID = localStorage.getItem('client_id') || generateUUID();
        localStorage.setItem('client_id', CLIENT_ID);

        /* 状态 */
        let uploadedNames = { 1: "", 2: "", 3: "" };   // ComfyUI 端 comfy_name
        let base64Images  = { 1: "", 2: "", 3: "" };   // 云端用的 base64 dataURL
        let currentResult = null;
        let currentLightboxData = null;
        let provider     = 'local';
        let loraEnabled  = false;
        let loraValue    = 0.8;
        const renderedIds = new Set();
        let archiveCount  = 0;

        /* ============== Seed Number Input + Random ============== */
        function seedDelta(d) {
            const el = document.getElementById('seedInput');
            const rand = document.getElementById('seedRandom');
            rand.checked = false;
            let v = parseInt(el.value, 10) || 0;
            v = Math.max(0, v + d);
            el.value = v;
        }
        function commitSeed(v) {
            const rand = document.getElementById('seedRandom');
            rand.checked = false;
            let n = parseInt(v, 10);
            if (isNaN(n) || n < 0) n = 0;
            document.getElementById('seedInput').value = n;
        }

        /* ============== 引擎切换（radio + dark glass card） ============== */
        document.querySelectorAll('#engineSwitch input[name="provider"]').forEach(r => {
            r.addEventListener('change', () => {
                provider = r.value;
                document.querySelectorAll('#engineSwitch .radio-row').forEach(el => {
                    el.classList.toggle('is-active', el.dataset.engine === provider);
                });
                const loraSec = document.getElementById('loraSection');
                loraSec.style.display = (provider === 'cloud') ? 'flex' : 'none';
            });
        });

        /* ============== LoRA toggle + slider（§15.4 自实现） ============== */
        function toggleLora() {
            loraEnabled = document.getElementById('loraToggle').checked;
            document.getElementById('loraStrengthRow').style.display = loraEnabled ? 'flex' : 'none';
        }
        const loraTrack  = document.getElementById('loraTrack');
        const loraFill   = document.getElementById('loraFill');
        const loraHandle = document.getElementById('loraHandle');
        const loraValEl  = document.getElementById('loraVal');
        function setLora(v) {
            v = Math.max(0.1, Math.min(1.0, v));
            loraValue = v;
            const pct = ((v - 0.1) / 0.9) * 100;
            loraFill.style.width = pct + '%';
            loraHandle.style.left = pct + '%';
            loraValEl.innerText = v.toFixed(2);
        }
        function loraFromClientX(clientX) {
            const rect = loraTrack.getBoundingClientRect();
            let pct = (clientX - rect.left) / rect.width;
            pct = Math.max(0, Math.min(1, pct));
            return 0.1 + pct * 0.9;
        }
        let loraDragging = false;
        loraTrack.addEventListener('mousedown', (e) => {
            loraDragging = true;
            setLora(loraFromClientX(e.clientX));
        });
        window.addEventListener('mousemove', (e) => {
            if (loraDragging) setLora(loraFromClientX(e.clientX));
        });
        window.addEventListener('mouseup', () => loraDragging = false);
        loraTrack.addEventListener('touchstart', (e) => {
            loraDragging = true;
            setLora(loraFromClientX(e.touches[0].clientX));
        }, { passive: true });
        window.addEventListener('touchmove', (e) => {
            if (loraDragging && e.touches[0])
                setLora(loraFromClientX(e.touches[0].clientX));
        }, { passive: true });
        window.addEventListener('touchend', () => loraDragging = false);
        setLora(0.8);

        /* ============== 3 Dropzone 上传逻辑 ============== */
        let hoveredSlot = null;
        [1, 2, 3].forEach(id => {
            const zone = document.getElementById('drop-zone-' + id);
            if (!zone) return;
            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                zone.classList.add('is-over');
            });
            zone.addEventListener('dragleave', () => zone.classList.remove('is-over'));
            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('is-over');
                if (e.dataTransfer.files && e.dataTransfer.files[0])
                    handleFile(e.dataTransfer.files[0], id);
            });
            zone.addEventListener('mouseenter', () => hoveredSlot = id);
            zone.addEventListener('mouseleave', () => { if (hoveredSlot === id) hoveredSlot = null; });
        });

        // 粘贴：在当前 hover 的 slot 上粘贴图片
        window.addEventListener('paste', (e) => {
            if (!hoveredSlot) return;
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let item of items) {
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    handleFile(item.getAsFile(), hoveredSlot);
                    break;
                }
            }
        });

        async function handleFile(file, index) {
            if (!file) return;
            const zone = document.getElementById('drop-zone-' + index);
            const prev = document.getElementById('prev' + index);

            // 本地预览 + 上传到 ComfyUI
            const reader = new FileReader();
            reader.onload = (e) => {
                base64Images[index] = e.target.result;
                prev.src = e.target.result;
                zone.classList.add('has-file');
            };
            reader.readAsDataURL(file);

            const formData = new FormData();
            formData.append('files', file);
            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await res.json();
                uploadedNames[index] = data.files[0].comfy_name;
            } catch (e) {
                uploadedNames[index] = file.name;
            }
        }

        function clearSlot(index, ev) {
            if (ev) ev.stopPropagation();
            const zone = document.getElementById('drop-zone-' + index);
            const prev = document.getElementById('prev' + index);
            const input = document.getElementById('file' + index);
            prev.src = '';
            input.value = '';
            zone.classList.remove('has-file');
            uploadedNames[index] = "";
            base64Images[index] = "";
        }

        /* ============== 主生成逻辑：API schema 与旧版完全一致 ============== */
        async function submitWorkflow() {
            if (provider === 'cloud') return submitCloud();
            return submitLocal();
        }

        async function submitLocal() {
            if (!uploadedNames[1]) {
                flashSlot(1);
                return;
            }
            const btn = document.getElementById('genBtn');
            const btnText = document.getElementById('btnText');
            btn.classList.add('is-disabled');
            btn.disabled = true;
            btnText.innerText = 'Synthesizing…';
            setEngineStatus('local · queued', true);

            // 插入"正在生成"占位卡到网格首位
            document.getElementById('emptyState').style.display = 'none';
            const placeholderId = 'render-' + Date.now();
            insertRenderPlaceholder(placeholderId);

            // seed：random 勾选时每次随机
            const randEl = document.getElementById('seedRandom');
            let seed;
            if (randEl.checked) {
                seed = Math.floor(Math.random() * 1000000);
                document.getElementById('seedInput').value = seed;
            } else {
                seed = parseInt(document.getElementById('seedInput').value, 10) || 0;
            }

            // === 与旧版 schema 完全一致的 payload ===
            const promptText = document.getElementById('promptInput').value;
            const payload = {
                prompt: promptText,
                workflow_json: "Flux2-Klein.json",
                type: "klein",
                params: {
                    "168": { "text": promptText },
                    "158": { "noise_seed": seed },
                    "278": { "image": uploadedNames[1] },
                    "270": { "image": uploadedNames[2] || "" },
                    "292": { "image": uploadedNames[3] || "" },
                    "313": { "value": uploadedNames[2] !== "" },
                    "314": { "value": uploadedNames[3] !== "" }
                },
                client_id: CLIENT_ID
            };

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (result.error) throw new Error(result.error);
                if (!result.images?.length) throw new Error('No images returned');
                currentResult = result;
                removeRenderPlaceholder(placeholderId);
                renderImageCard(result, true);
                openLightbox(result);
                setEngineStatus('local · done', false);
            } catch (err) {
                console.error('Local generation error', err);
                replacePlaceholderWithError(placeholderId, err.message || 'Render failed');
                setEngineStatus('local · error', false);
            } finally {
                btn.classList.remove('is-disabled');
                btn.disabled = false;
                btnText.innerText = 'Edit';
            }
        }

        async function submitCloud() {
            const promptText = (document.getElementById('promptInput').value || '').trim();
            if (!promptText) { flashSlot(0); return; }
            if (!base64Images[1]) { flashSlot(1); return; }

            const btn = document.getElementById('genBtn');
            const btnText = document.getElementById('btnText');
            btn.classList.add('is-disabled');
            btn.disabled = true;
            btnText.innerText = 'Cloud processing…';
            setEngineStatus('cloud · submitting', true);

            document.getElementById('emptyState').style.display = 'none';
            const placeholderId = 'render-' + Date.now();
            insertRenderPlaceholder(placeholderId);

            // 收集所有 base64 image_urls（slot 1/2/3 中已上传的）
            const imageUrls = [base64Images[1], base64Images[2], base64Images[3]].filter(Boolean);

            // === 与旧版 schema 完全一致的 cloud payload ===
            const msPayload = {
                prompt: promptText,
                model: 'black-forest-labs/FLUX.2-klein-9B',
                image_urls: imageUrls,
                client_id: CLIENT_ID
            };
            if (loraEnabled) {
                msPayload.loras = { 'Daniel8152/Klein-enhance': loraValue };
            }

            try {
                const response = await fetch('/api/ms/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(msPayload)
                });
                if (!response.ok) {
                    const err = await response.json().catch(() => ({}));
                    throw new Error(err.detail || 'Cloud generation failed');
                }
                const result = await response.json();
                if (!result.url) throw new Error('No image URL returned');
                const resultData = {
                    prompt: promptText,
                    images: [result.url],
                    timestamp: Date.now() / 1000,
                    type: 'klein',
                    model: 'black-forest-labs/FLUX.2-klein-9B'
                };
                currentResult = resultData;
                removeRenderPlaceholder(placeholderId);
                renderImageCard(resultData, true);
                openLightbox(resultData);
                setEngineStatus('cloud · done', false);
            } catch (err) {
                console.error('Cloud generation error', err);
                replacePlaceholderWithError(placeholderId, err.message || 'Cloud render failed');
                setEngineStatus('cloud · error', false);
            } finally {
                btn.classList.remove('is-disabled');
                btn.disabled = false;
                btnText.innerText = 'Edit';
            }
        }

        function flashSlot(idx) {
            if (idx === 0) {
                const ta = document.getElementById('promptInput');
                ta.classList.add('is-error');
                setTimeout(() => ta.classList.remove('is-error'), 600);
                return;
            }
            const zone = document.getElementById('drop-zone-' + idx);
            if (!zone) return;
            zone.style.borderColor = 'var(--primary-deep)';
            zone.style.borderStyle = 'solid';
            setTimeout(() => {
                zone.style.borderColor = '';
                zone.style.borderStyle = '';
            }, 500);
        }

        function setEngineStatus(text, visible) {
            const bar = document.getElementById('engineStatus');
            document.getElementById('engineStatusText').innerText = text;
            bar.classList.toggle('is-visible', !!visible);
        }

        /* ============== 渲染图卡 §16.1 + 占位 §16.3 + 错误 §16.6 ============== */
        function insertRenderPlaceholder(id) {
            const grid = document.getElementById('imageGrid');
            const wrap = document.createElement('div');
            wrap.id = id;
            wrap.className = 'render-placeholder';
            wrap.innerHTML = `
                <div class="image-placeholder">
                    <span class="section-tag">
                        Rendering
                        <span class="pixel-dot-pulse"><span></span><span></span><span></span></span>
                    </span>
                </div>
                <div class="placeholder-meta">
                    <span class="text-mono">${provider === 'cloud' ? 'cloud · klein' : 'local · comfyui'}</span>
                </div>
            `;
            grid.insertBefore(wrap, grid.firstChild);
        }
        function removeRenderPlaceholder(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }
        function replacePlaceholderWithError(id, msg) {
            const el = document.getElementById(id);
            if (!el) return;
            el.innerHTML = `
                <div class="image-placeholder image-placeholder--error">
                    <svg class="pixel-icon" style="width:32px;height:32px;color:var(--primary)"><use href="#cross"/></svg>
                </div>
                <div class="placeholder-meta">
                    <span class="text-body" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(msg)}</span>
                    <a class="btn-underline" href="javascript:submitWorkflow()" style="font-size:12px;">retry
                        <svg class="pixel-icon pixel-icon--sm"><use href="#chevron-right"/></svg>
                    </a>
                </div>
            `;
        }

        function renderImageCard(data, isNew = false) {
            const grid = document.getElementById('imageGrid');
            const key  = 'h-' + (data.timestamp || Date.now());
            if (renderedIds.has(key)) return;
            renderedIds.add(key);
            document.getElementById('emptyState').style.display = 'none';

            const card = document.createElement('div');
            card.id = key;
            card.className = 'image-card';
            card.style.cursor = 'zoom-in';
            card.onclick = () => openLightbox(data);

            const imgUrl = data.images[0];
            const promptShort = data.prompt || 'Klein edit';
            const ts = new Date((data.timestamp || Date.now() / 1000) * 1000);
            if (isNaN(ts.getTime())) ts.setTime(Date.now());
            const tsText = ts.getFullYear() + '-' + String(ts.getMonth()+1).padStart(2,'0') + '-' + String(ts.getDate()).padStart(2,'0')
                + ' ' + String(ts.getHours()).padStart(2,'0') + ':' + String(ts.getMinutes()).padStart(2,'0');
            const sourceLabel = data.model ? data.model.split('/').pop() : 'klein';

            card.innerHTML = `
                <img src="${imgUrl}" alt="klein edit" loading="lazy">
                <div class="image-meta">
                    <div class="meta-text">
                        <div class="meta-prompt">${escapeHtml(promptShort)}</div>
                        <div class="meta-info">${escapeHtml(sourceLabel)} · ${tsText}</div>
                    </div>
                    <div class="meta-actions">
                        <button class="action-btn" title="Download"
                            onclick="event.stopPropagation();window.open('${imgUrl}','_blank')">
                            <svg class="pixel-icon pixel-icon--sm"><use href="#download"/></svg>
                        </button>
                        <button class="action-btn" title="Replicate prompt + slots"
                            onclick="event.stopPropagation();replicateFromCard('${key}')">
                            <svg class="pixel-icon pixel-icon--sm"><use href="#copy"/></svg>
                        </button>
                        <button class="action-btn" title="Delete"
                            onclick="event.stopPropagation();deleteHistoryItem('${data.timestamp}', event)">
                            <svg class="pixel-icon pixel-icon--sm"><use href="#trash"/></svg>
                        </button>
                    </div>
                </div>
            `;
            card.__data = data;
            if (isNew) grid.insertBefore(card, grid.firstChild); else grid.appendChild(card);
            archiveCount += 1;
            document.getElementById('archiveCountLabel').innerText = 'Recent edits (' + archiveCount + ')';
        }

        function replicateFromCard(key) {
            const card = document.getElementById(key);
            if (!card || !card.__data) return;
            currentLightboxData = card.__data;
            applySameStyle();
        }

        function escapeHtml(s) {
            return String(s || '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        /* ============== Lightbox + Before/After compare（§16.5 + §15.4 handle） ============== */
        const lightbox = document.getElementById('lightbox');
        const compareStage     = document.getElementById('compareStage');
        const compareGenerated = document.getElementById('compareGenerated');
        const compareOriginal  = document.getElementById('compareOriginal');
        const compareWrapper   = document.getElementById('compareOriginalWrapper');
        const compareLine      = document.getElementById('compareSliderLine');
        const compareHandle    = document.getElementById('compareSliderHandle');
        const lightboxSingle   = document.getElementById('lightboxSingle');
        const lightboxMeta     = document.getElementById('lightboxMeta');
        const lightboxResText  = document.getElementById('lightboxResText');
        const beforeTag = document.querySelector('.compare-tag--before');
        const afterTag  = document.querySelector('.compare-tag--after');
        let lightboxImageURL = '';

        function openLightbox(data) {
            currentLightboxData = data;
            lightboxImageURL = data.images[0];
            const originalName = data.params && data.params["278"] && data.params["278"].image;

            if (originalName) {
                // before/after compare 模式
                compareStage.classList.add('is-compare');
                compareGenerated.style.display = '';
                compareWrapper.style.display = '';
                compareLine.style.display = '';
                beforeTag.style.display = '';
                afterTag.style.display = '';
                lightboxSingle.style.display = 'none';
                compareGenerated.src = data.images[0];
                compareOriginal.src  = '/api/view?filename=' + encodeURIComponent(originalName) + '&type=input';
                compareWrapper.style.clipPath = 'inset(0 50% 0 0)';
                compareLine.style.left = '50%';
                compareGenerated.onload = () => {
                    if (compareGenerated.naturalWidth) {
                        lightboxResText.innerText = compareGenerated.naturalWidth + ' × ' + compareGenerated.naturalHeight;
                        lightboxMeta.style.display = '';
                    }
                };
                if (compareGenerated.complete && compareGenerated.naturalWidth) {
                    lightboxResText.innerText = compareGenerated.naturalWidth + ' × ' + compareGenerated.naturalHeight;
                    lightboxMeta.style.display = '';
                }
            } else {
                // 单图 fallback
                compareStage.classList.remove('is-compare');
                compareGenerated.style.display = 'none';
                compareWrapper.style.display = 'none';
                compareLine.style.display = 'none';
                beforeTag.style.display = 'none';
                afterTag.style.display = 'none';
                lightboxSingle.style.display = '';
                lightboxSingle.src = data.images[0];
                lightboxSingle.onload = () => {
                    if (lightboxSingle.naturalWidth) {
                        lightboxResText.innerText = lightboxSingle.naturalWidth + ' × ' + lightboxSingle.naturalHeight;
                        lightboxMeta.style.display = '';
                    }
                };
            }
            document.getElementById('sameStyleBtn').style.display = (data.params || data.prompt) ? 'inline-flex' : 'none';
            lightbox.classList.add('is-open');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('is-open');
            document.body.style.overflow = '';
        }
        function handleLightboxOutside(e) {
            if (e.target === lightbox) closeLightbox();
        }
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('is-open')) return;
            if (e.key === 'Escape') closeLightbox();
        });

        function downloadLightbox() {
            if (!lightboxImageURL) return;
            const a = document.createElement('a');
            a.href = lightboxImageURL;
            a.download = 'Klein-' + Date.now() + '.png';
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        /* —— compare 拖拽：14×14 像素方块 handle —— */
        let compareDragging = false;
        function updateCompare(clientX) {
            const rect = compareStage.getBoundingClientRect();
            let x = clientX - rect.left;
            let pct = (x / rect.width) * 100;
            pct = Math.max(0, Math.min(100, pct));
            const pctInt = Math.round(pct * 10) / 10;
            compareWrapper.style.clipPath = 'inset(0 ' + (100 - pctInt) + '% 0 0)';
            compareLine.style.left = pctInt + '%';
        }
        compareStage.addEventListener('mousedown', (e) => {
            if (!compareStage.classList.contains('is-compare')) return;
            compareDragging = true;
            updateCompare(e.clientX);
            e.preventDefault();
        });
        window.addEventListener('mousemove', (e) => {
            if (compareDragging) updateCompare(e.clientX);
        });
        window.addEventListener('mouseup', () => compareDragging = false);
        compareStage.addEventListener('touchstart', (e) => {
            if (!compareStage.classList.contains('is-compare')) return;
            compareDragging = true;
            if (e.touches[0]) updateCompare(e.touches[0].clientX);
        }, { passive: true });
        window.addEventListener('touchmove', (e) => {
            if (compareDragging && e.touches[0]) updateCompare(e.touches[0].clientX);
        }, { passive: true });
        window.addEventListener('touchend', () => compareDragging = false);

        /* ============== Replicate（一键复用 prompt + 3 slot） ============== */
        function applySameStyle() {
            if (!currentLightboxData) return;
            document.getElementById('promptInput').value = currentLightboxData.prompt || '';
            const params = currentLightboxData.params;
            const setSlot = (slotId, nodeId) => {
                if (params && params[nodeId] && params[nodeId].image) {
                    const fname = params[nodeId].image;
                    uploadedNames[slotId] = fname;
                    const prev = document.getElementById('prev' + slotId);
                    const zone = document.getElementById('drop-zone-' + slotId);
                    prev.src = '/api/view?filename=' + encodeURIComponent(fname) + '&type=input';
                    zone.classList.add('has-file');
                } else {
                    clearSlot(slotId);
                }
            };
            if (params) {
                setSlot(1, "278"); setSlot(2, "270"); setSlot(3, "292");
            }
            closeLightbox();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        /* ============== 历史回填（保留 /api/history?type=klein） ============== */
        let allHistory = [];
        let currentIndex = 0;
        const PAGE_SIZE = 24;
        let isLoading = false;
        async function loadHistory(page = 0) {
            if (isLoading) return;
            const loader = document.getElementById('loadMoreTrigger');
            try {
                isLoading = true;
                if (page === 0) {
                    const res = await fetch('/api/history?type=klein');
                    allHistory = await res.json();
                    currentIndex = 0;
                    // 清掉所有非 emptyState 的卡
                    [...document.getElementById('imageGrid').children].forEach(c => {
                        if (c.id !== 'emptyState') c.remove();
                    });
                    renderedIds.clear();
                    archiveCount = 0;
                }
                const nextData = allHistory.slice(currentIndex, currentIndex + PAGE_SIZE);
                nextData.forEach(item => renderImageCard(item));
                currentIndex += nextData.length;
                if (currentIndex >= allHistory.length) {
                    loader.style.display = 'none';
                } else {
                    loader.style.display = '';
                    loader.innerText = 'Load more';
                }
                if (archiveCount > 0) {
                    document.getElementById('emptyState').style.display = 'none';
                }
            } catch (e) {
                console.error(e);
            } finally {
                isLoading = false;
            }
        }

        async function deleteHistoryItem(ts, ev) {
            if (ev) ev.stopPropagation();
            if (!confirm('Delete this edit?')) return;
            try {
                const res = await fetch('/api/history/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ timestamp: ts })
                });
                if ((await res.json()).success) {
                    const el = document.getElementById('h-' + ts);
                    if (el) el.remove();
                    archiveCount = Math.max(0, archiveCount - 1);
                    document.getElementById('archiveCountLabel').innerText = 'Recent edits (' + archiveCount + ')';
                }
            } catch (e) { alert('Delete failed'); }
        }

        /* ============== 主题切换 postMessage 监听保留 ============== */
        // theme.js 已自动监听 'studio-theme' 消息并切 class，
        // 这里保留监听用于强制刷新本页 background。
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'studio-theme') {
                document.body.offsetHeight; // 触发样式重计算
            }
        });

        /* ============== Load More 滚动观察 ============== */
        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && !isLoading && currentIndex < allHistory.length) loadHistory(1);
        }, { threshold: 0.1 });

        window.addEventListener('load', () => {
            loadHistory(0).then(() => {
                const trigger = document.getElementById('loadMoreTrigger');
                if (trigger) {
                    observer.observe(trigger);
                    trigger.onclick = () => loadHistory(1);
                }
            });
        });
    </script>
</body>

</html>
