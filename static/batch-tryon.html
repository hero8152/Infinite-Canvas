                if (info.completed === info.total) return { label: 'done', tone: '' };
                if (info.failed) return { label: 'partial', tone: 'is-alert' };
                return { label: 'ready', tone: '' };
            }

            function lastGroupUpdate(groupId, detail = activeDetail()) {
                const rows = (detail?.tasks || []).filter(task => {
                    if (groupId === 'legacy-group-1' && !task.group_id) return true;
                    return task.group_id === groupId;
                });
                const values = rows.map(task => task.completed_at || task.started_at || task.updated_at || 0).filter(Boolean);
                return values.length ? Math.max(...values) : 0;
            }

            function renderTabs() {
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.classList.toggle('is-active', btn.dataset.tab === state.tab);
                });
                refs.workspace.hidden = state.tab !== 'workspace';
                refs.gallery.hidden = state.tab !== 'gallery';
                refs.history.hidden = state.tab !== 'history';
            }

            function renderBatchSelect() {
                const selected = state.activeBatchId || '';
                refs.batchSelect.innerHTML = [
                    '<option value="">Select active batch</option>',
                    ...state.batches.map(batch => {
                        const status = batch.status || 'pending';
                        const total = batch.counts?.total || 0;
                        return `<option value="${escapeHtml(batch.id)}" ${batch.id === selected ? 'selected' : ''}>${escapeHtml(batch.title || batch.id)} · ${status} · ${total}</option>`;
                    })
                ].join('');
            }

            function renderWorkspaceOverview() {
                const estimate = estimateGroups();
                const relationLabel = state.activeBatchId
                    ? (batchMatchesWorkspace() ? 'Workspace matches active batch' : 'Workspace changed after last active launch')
                    : 'No active batch attached';
                refs.workspaceOverview.innerHTML = `
                    <article class="overview-card">
                        <span class="label">Workspace</span>
                        <div class="overview-value">${workspaceIsDirty() ? 'DIRTY' : 'CLEAN'}</div>
                        <div class="overview-sub ${workspaceIsDirty() ? 'is-alert' : ''}">${workspaceIsDirty() ? 'Unsubmitted workspace changes' : 'No unsubmitted workspace changes'}</div>
                    </article>
                    <article class="overview-card">
                        <span class="label">Groups</span>
                        <div class="overview-value">${currentGroups().length}</div>
                        <div class="overview-sub">${estimate.readyCount} ready · ${estimate.incompleteCount} incomplete</div>
                    </article>
                    <article class="overview-card">
                        <span class="label">Estimate</span>
                        <div class="overview-value">${estimate.total}</div>
                        <div class="overview-sub">${MODE_LABELS[currentMode()]} · ${estimate.activeCount} active groups</div>
                    </article>
                    <article class="overview-card">
                        <span class="label">Batch Link</span>
                        <div class="overview-value">${state.activeBatchId ? 'ACTIVE' : 'NONE'}</div>
                        <div class="overview-sub ${batchMatchesWorkspace() ? '' : 'is-alert'}">${escapeHtml(relationLabel)}</div>
                    </article>
                `;
            }

            function renderThumbs(group, type) {
                const key = type === 'clothing' ? 'clothing_images' : 'model_images';
                const images = group[key] || [];
                if (!images.length) return '';
                return `<div class="thumb-grid">${images.map(item => `
                    <div class="thumb" title="${escapeHtml(item.name || item.url)}">
                        <button class="thumb-open" type="button" data-action="open-crop" data-group-id="${escapeHtml(group.id)}" data-type="${type}" data-image-id="${escapeHtml(item.id || item.url)}" aria-label="Crop image">
                            <img src="${escapeHtml(item.url)}" alt="">
                        </button>
                        <button class="thumb-crop" type="button" data-action="open-crop" data-group-id="${escapeHtml(group.id)}" data-type="${type}" data-image-id="${escapeHtml(item.id || item.url)}" aria-label="Crop image">
                            ${icon('crop', 'xs')}
                        </button>
                        <button class="thumb-remove" type="button" data-action="remove-image" data-group-id="${escapeHtml(group.id)}" data-type="${type}" data-image-id="${escapeHtml(item.id || item.url)}" aria-label="Remove image">
                            ${icon('cross', 'xs')}
                        </button>
                    </div>
                `).join('')}</div>`;
            }

            function renderGroup(group, index) {
                const clothingCount = group.clothing_images.length;
                const modelCount = group.model_images.length;
                const estimate = estimateGroup(group);
                const info = taskCountsForGroup(group.id);
                const stateInfo = groupState(group);
                const statusBits = [

            function findGroup(groupId) {
                return currentGroups().find(group => group.id === groupId);
            }

            async function uploadFiles(groupId, type, files) {
                const group = findGroup(groupId);
                if (!group) return;
                const chosen = Array.from(files || []).filter(file => file.type.startsWith('image/'));
                if (!chosen.length) return;
                setStatus(`Uploading ${chosen.length} image${chosen.length === 1 ? '' : 's'}...`);
                const form = new FormData();
                chosen.forEach(file => form.append('files', file));
                const data = await fetchJson('/api/ai/upload', { method: 'POST', body: form });
                const mapped = (data.files || []).map(file => ({
                    id: uid('img'),
                    url: file.url,
                    name: file.name || file.url
                }));
                const key = type === 'clothing' ? 'clothing_images' : 'model_images';
                group[key].push(...mapped);
                saveDraft();
                render();
                setStatus(`Uploaded ${mapped.length} image${mapped.length === 1 ? '' : 's'}.`);
            }

            function activeGroupsForSubmit(groups) {
                return groups.filter(group => group.clothing_images.length || group.model_images.length);
            }

            function payloadGroups(groups) {
                return groups.map(group => ({
                    id: group.id,
                    name: group.name,
                    clothing_images: group.clothing_images,
                    model_images: group.model_images
                }));
            }

            async function createBatch(groupId = '') {
                const selectedGroups = groupId ? currentGroups().filter(group => group.id === groupId) : currentGroups();
                const activeGroups = activeGroupsForSubmit(selectedGroups);
                validateGroups(activeGroups);
                setStatus(groupId ? 'Starting group...' : 'Starting batch...');
                const data = await fetchJson(`${API}/batches`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: currentSettings().title,
                        prompt: currentSettings().prompt,
                        model: currentSettings().model,
                        size: currentSettings().size,
                        quality: currentSettings().quality,
                        pairing_mode: currentMode(),
                        groups: payloadGroups(activeGroups),
                        autostart: true
                    })
                });
                cacheBatchDetail(data);
                state.activeBatchId = data.batch?.id || '';
                state.galleryBatchId = state.activeBatchId;
                state.workspace = workspaceFromDetail(data);
                markWorkspaceClean();
                await loadBatches(false);
                render();
                syncPolling();
                setStatus(`Batch ${data.batch?.id || ''} started from workspace.`);
            }

            async function loadBatches(shouldRender = true) {
                const data = await fetchJson(`${API}/batches?limit=50`);
                state.batches = data.batches || [];
                if (!state.activeBatchId) {
                    const running = state.batches.find(batch => batch.status === 'running');
                    if (running) state.activeBatchId = running.id;
                }
                if (!state.galleryBatchId && (state.activeBatchId || state.batches[0]?.id)) {
                    state.galleryBatchId = state.activeBatchId || state.batches[0].id;
                }
                if (shouldRender) render();
            }

            async function setActiveBatch(batchId) {
                state.activeBatchId = batchId || '';
                if (state.activeBatchId) {
                    await ensureBatchDetail(state.activeBatchId);
                }
                saveDraft();
                render();
                syncPolling();
                setStatus(state.activeBatchId ? `Active batch set to ${state.activeBatchId}.` : 'Active batch cleared.');
            }

            async function inspectBatch(batchId) {
                state.inspectBatchId = batchId || '';
                if (state.inspectBatchId) {
                    await ensureBatchDetail(state.inspectBatchId);
                }
                render();
                setStatus(state.inspectBatchId ? `Inspecting ${state.inspectBatchId}.` : 'History selection cleared.');
            }

            async function setGalleryBatch(batchId, groupId = 'all') {
                state.galleryBatchId = batchId || '';
                state.galleryGroupFilter = groupId || 'all';
                if (state.galleryBatchId) {
                    await ensureBatchDetail(state.galleryBatchId);
                }
                saveDraft();
                render();
            }

            async function refreshCurrent() {
                await loadBatches(false);
                const ids = [state.activeBatchId, state.inspectBatchId, state.galleryBatchId].filter(Boolean);
                for (const batchId of [...new Set(ids)]) {
                    await ensureBatchDetail(batchId, true);
                }
                render();
                syncPolling();
                setStatus('Workspace, active batch, and history cache refreshed.');
            }

            async function controlBatch(action) {
                if (!state.activeBatchId) return;
                const data = await fetchJson(`${API}/batches/${encodeURIComponent(state.activeBatchId)}/${action}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                cacheBatchDetail(data);
                render();
                syncPolling();
                setStatus(`${action.replace('-', ' ')} requested.`);
            }

            async function retryTask(taskId) {
                const data = await fetchJson(`${API}/tasks/${encodeURIComponent(taskId)}/retry`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                cacheBatchDetail(data);
                render();
                setStatus('Task retry queued.');
            }

            function syncPolling() {
                if (state.pollTimer) {
                    clearInterval(state.pollTimer);
                    state.pollTimer = null;
                }
                const detail = activeDetail();
                if (!detail || detail.batch?.status !== 'running') return;
                state.pollTimer = setInterval(async () => {
                    try {
                        await ensureBatchDetail(state.activeBatchId, true);
                        render();
                    } catch (err) {
                        clearInterval(state.pollTimer);
                        state.pollTimer = null;
                        setStatus(err.message, true);
                    }
                }, 2500);
            }

            function openUpload(groupId, type) {
                state.uploadTarget = { groupId, type };
                refs.fileInput.value = '';
                refs.fileInput.click();
            }

            function moveGroup(groupId, direction) {
                const index = currentGroups().findIndex(group => group.id === groupId);
                const next = index + direction;
                if (index < 0 || next < 0 || next >= currentGroups().length) return;
                const copy = currentGroups().slice();
                [copy[index], copy[next]] = [copy[next], copy[index]];
                state.workspace.groups = copy;
                saveDraft();
                render();
            }

            function saveSettings() {
                state.workspace.settings = {
                    title: document.getElementById('settingsTitleInput').value.trim() || DEFAULT_SETTINGS.title,
                    prompt: document.getElementById('settingsPromptInput').value.trim() || DEFAULT_PROMPT,
                    model: document.getElementById('settingsModelInput').value.trim() || DEFAULT_SETTINGS.model,
                    size: document.getElementById('settingsSizeInput').value,
                    quality: document.getElementById('settingsQualityInput').value
                };
                saveDraft();
                refs.settingsOverlay.hidden = true;
                render();
                setStatus('Settings saved. Starting generation will create a new batch from this workspace.');
            }

            async function loadInspectIntoWorkspace(batchId) {
                const detail = detailFor(batchId) || await ensureBatchDetail(batchId);
                if (!detail) return;
                if (workspaceIsDirty() && !window.confirm('Current workspace has unsubmitted changes. Replace it with the selected batch workspace?')) {
                    return;
                }
                state.workspace = workspaceFromDetail(detail);
                markWorkspaceClean();
                state.tab = 'workspace';
                render();
                setStatus(`Workspace loaded from ${detail.batch.title || detail.batch.id}.`);
            }

            async function handleAction(target, origin = null) {
                const action = target.dataset.action;
                if (!action) return;
                if (action === 'tab') {
                    state.tab = target.dataset.tab || 'workspace';
                    render();
                    return;
                }
                if (action === 'new-group') {
                    state.workspace.groups.push(newGroup(`Group ${currentGroups().length + 1}`));
                    saveDraft();
                    render();
                    return;
                }
                if (action === 'settings' || action === 'open-settings') {
                    renderSettings();
                    refs.settingsOverlay.hidden = false;
                    return;
                }
                if (action === 'close-settings') {
                    refs.settingsOverlay.hidden = true;
                    return;
                }
                if (action === 'save-settings') {
                    saveSettings();
                    return;
                }
                if (action === 'crop-backdrop') {
                    if (target === origin) closeCrop();
                    return;
                }
                if (action === 'close-crop') {
                    closeCrop();
                    return;
                }
                if (action === 'crop-aspect') {
                    currentCrop().aspect = target.dataset.ratio || 'free';
                    if (currentCrop().rect) {
                        currentCrop().rect = clampCropRect(applyCropAspect({ ...currentCrop().rect }, 'se'));
                    }
                    renderCropOverlay();
                    return;
                }
                if (action === 'reset-crop') {
                    currentCrop().rect = defaultCropRect();
                    renderCropOverlay();
                    return;
                }
                if (action === 'apply-crop') {
                    await applyCrop();
                    return;
                }
                if (action === 'mode') {
                    state.workspace.mode = target.dataset.mode || 'pair';
                    saveDraft();
                    render();
                    return;
                }
                const groupId = target.dataset.groupId;
                const group = groupId ? findGroup(groupId) : null;
                if (action === 'upload') return openUpload(groupId, target.dataset.type || 'clothing');
                if (action === 'toggle-group' && group) {
                    group.collapsed = !group.collapsed;
                    saveDraft();
                    render();
                    return;
                }
                if (action === 'delete-group' && group) {
                    const hasContent = group.clothing_images.length || group.model_images.length;
                    if (hasContent && !window.confirm(`Delete ${group.name} and remove its uploaded draft images from the workspace?`)) {
                        return;
                    }
                    state.workspace.groups = currentGroups().filter(item => item.id !== group.id);
                    if (!state.workspace.groups.length) state.workspace.groups = [newGroup('Group 1')];
                    saveDraft();
                    render();
                    return;
                }
                if (action === 'move-group-up') return moveGroup(groupId, -1);
                if (action === 'move-group-down') return moveGroup(groupId, 1);
                if (action === 'open-crop' && group) {
                    openCrop(groupId, target.dataset.type || 'clothing', target.dataset.imageId);
                    return;
                }
                if (action === 'remove-image' && group) {
                    const key = target.dataset.type === 'clothing' ? 'clothing_images' : 'model_images';
                    group[key] = group[key].filter(item => (item.id || item.url) !== target.dataset.imageId);
                    if (currentCrop().open && currentCrop().groupId === groupId && currentCrop().imageId === target.dataset.imageId) {
                        closeCrop();
                    }
                    saveDraft();
                    render();
                    return;
                }
                if (action === 'view-group-results') {
                    state.galleryBatchId = state.activeBatchId;
                    state.galleryGroupFilter = groupId || 'all';
                    state.galleryStatusFilter = 'completed';
                    state.tab = 'gallery';
                    render();
                    return;
                }
                if (action === 'run-group') return createBatch(groupId);
                if (action === 'start-all') return createBatch('');
                if (action === 'refresh') return refreshCurrent();
                if (action === 'pause-batch') return controlBatch('pause');
                if (action === 'resume-batch') return controlBatch('resume');
                if (action === 'retry-failed') return controlBatch('retry-failed');
                if (action === 'retry-task') return retryTask(target.dataset.taskId);
                if (action === 'inspect-batch') return inspectBatch(target.dataset.batchId);
                if (action === 'set-active-batch') return setActiveBatch(target.dataset.batchId);
                if (action === 'gallery-batch-group') {
                    await setGalleryBatch(target.dataset.batchId, target.dataset.groupId || 'all');
                    state.tab = 'gallery';
                    return;
                }
                if (action === 'load-workspace') return loadInspectIntoWorkspace(target.dataset.batchId);
            }

            document.addEventListener('click', async event => {
                const target = event.target.closest('[data-action]');
                if (!target) return;
                event.preventDefault();
                try {
                    await handleAction(target, event.target);
                } catch (err) {
                    setStatus(err.message, true);
                }
            });

            document.addEventListener('keydown', event => {
                if (currentCrop().open && event.key === 'Escape') {
                    event.preventDefault();
                    closeCrop();
                    return;
                }
                const target = event.target.closest('.dropzone');
                if (!target) return;
                if (event.key !== 'Enter' && event.key !== ' ') return;
                event.preventDefault();
                openUpload(target.dataset.groupId, target.dataset.type || 'clothing');
            });

            document.addEventListener('input', event => {
                if (!event.target.matches('.group-name')) return;
                const group = findGroup(event.target.dataset.groupId);
                if (!group) return;
                group.name = event.target.value.slice(0, 120) || 'Group';
                saveDraft();
                render();
            });

            refs.batchSelect.addEventListener('change', async event => {
                try {
                    await setActiveBatch(event.target.value);
                } catch (err) {
                    setStatus(err.message, true);
                }
            });

            document.addEventListener('change', async event => {
                const control = event.target.dataset.control;
                if (!control) return;
                try {
                    if (control === 'task-status-filter') state.taskStatusFilter = event.target.value;
                    if (control === 'task-group-filter') state.taskGroupFilter = event.target.value;
                    if (control === 'gallery-status-filter') state.galleryStatusFilter = event.target.value;
                    if (control === 'gallery-group-filter') state.galleryGroupFilter = event.target.value;
                    if (control === 'gallery-batch-select') {
                        await setGalleryBatch(event.target.value, 'all');
                        return;
                    }
                    render();
                } catch (err) {
                    setStatus(err.message, true);
                }
            });

            refs.fileInput.addEventListener('change', async () => {
                const target = state.uploadTarget;
                if (!target) return;
                try {
                    await uploadFiles(target.groupId, target.type, refs.fileInput.files);
                } catch (err) {
                    setStatus(err.message, true);
                }
            });

            document.addEventListener('dragover', event => {
                const zone = event.target.closest('.dropzone');
                if (!zone) return;
                event.preventDefault();
                zone.classList.add('is-over');
            });

            document.addEventListener('dragleave', event => {
                const zone = event.target.closest('.dropzone');
                if (zone) zone.classList.remove('is-over');
            });

            document.addEventListener('drop', async event => {
                const zone = event.target.closest('.dropzone');
                if (!zone) return;
                event.preventDefault();
                zone.classList.remove('is-over');
                try {
                    await uploadFiles(zone.dataset.groupId, zone.dataset.type || 'clothing', event.dataTransfer.files);
                } catch (err) {
                    setStatus(err.message, true);
                }
            });

            document.addEventListener('pointerdown', event => {
                if (!currentCrop().open) return;
                const handle = event.target.closest('[data-crop-handle]');
                if (handle) {
                    event.preventDefault();
                    beginCropInteraction(event, handle.dataset.cropHandle || 'se');
                    return;
                }
                const selection = event.target.closest('#cropSelection');
                if (selection) {
                    event.preventDefault();
                    beginCropInteraction(event, 'move');
                    return;
                }
                const overlay = event.target.closest('#cropOverlay');
                if (overlay) {
                    event.preventDefault();
                    beginCropInteraction(event, 'new');
                }
            });

            document.addEventListener('pointermove', event => {
                if (!currentCrop().open) return;
                moveCropInteraction(event);
            });

            document.addEventListener('pointerup', event => {
                if (!currentCrop().open) return;
                endCropInteraction(event);
            });

            document.addEventListener('pointercancel', event => {
                if (!currentCrop().open) return;
                endCropInteraction(event);
            });

            window.addEventListener('resize', () => {
                if (currentCrop().open) syncCropImageSize();
            });

            window.addEventListener('beforeunload', () => {
                if (state.pollTimer) clearInterval(state.pollTimer);
            });

            async function init() {
                loadDraft();
                render();
                try {
                    const config = await fetchJson('/api/config');
                    if (!currentSettings().model && config.image_model) {
                        state.workspace.settings.model = config.image_model;
                        saveDraft();
                    }
                } catch (err) {
                    setStatus(err.message, true);
                }
                try {
                    await loadBatches(false);
                    if (state.activeBatchId) await ensureBatchDetail(state.activeBatchId);
                    if (state.galleryBatchId) await ensureBatchDetail(state.galleryBatchId);
                    render();
                    syncPolling();
                } catch (err) {
                    setStatus(err.message, true);
                }
            }

            init();
        })();
    </script>
</body>

</html>
