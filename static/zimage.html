<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
    <title>Text to image · Feebee Studios</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/design-system.css?v=24">
    <script src="/static/theme.js?v=20260512g"></script>
    <script src="/static/i18n.js?v=1"></script>
    <script src="/static/image-preview.js?v=1"></script>
    <script src="/static/history-bulk-manager.js?v=1"></script>
    <style>
        /* ===== 页面级特化：仅做布局，不重发明组件 ===== */

        html,
        body {
            height: 100%;
            width: 100%;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font-sans);
            overflow: hidden;
            overflow-x: hidden;
            width: 100%;
        }

        /* 整体左右分栏：左 380px 参数 + 右网格 */
        .page-shell {
            display: flex;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            min-height: 0;
            background-color: var(--bg);
            background-image:
                linear-gradient(to right, rgba(230, 213, 168, 0.28) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(230, 213, 168, 0.28) 1px, transparent 1px);
            background-size: 80px 80px;
        }

        body.studio-theme-dark .page-shell {
            background-color: var(--dark-bg);
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        /* ===== 左侧 380 参数面板 ===== */
        .params-panel {
            width: 380px;
            flex-shrink: 0;
            background: rgba(255, 250, 235, 0.94);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 20px;
            overflow-y: auto;
        }

        body.studio-theme-dark .params-panel {
            background: var(--dark-bg);
            border-right-color: var(--dark-border);
        }

        .params-panel .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .params-panel .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .params-panel .field-row {
            display: flex;
            gap: 16px;
        }

        .params-panel .field-row .field {
            flex: 1;
        }

        /* 引擎切换：方形 radio，水平排列 */
        .engine-switch {
            display: flex;
            gap: 16px;
        }

        .engine-switch .radio-row {
            font-size: 14px;
            color: var(--ink);
        }

        body.studio-theme-dark .engine-switch .radio-row {
            color: var(--dark-text);
        }

        /* 状态行 */
        .status-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            background: var(--bg-2);
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--muted);
        }

        body.studio-theme-dark .status-row {
            background: var(--dark-surface);
            color: var(--dark-muted);
        }

        .status-row .pixel-dot-pulse {
            color: var(--primary);
        }

        .status-row.is-idle .pixel-dot-pulse {
            color: var(--muted);
            animation: none;
        }

        .status-row.is-idle .pixel-dot-pulse > span {
            animation: none;
            opacity: 0.6;
        }

        /* 主按钮整宽 */
        .panel-cta {
            width: 100%;
            justify-content: space-between;
            margin-top: auto;
        }

        .panel-cta[disabled] {
            cursor: not-allowed;
        }

        /* ===== 右侧主区 ===== */
        .gallery-panel {
            flex: 1;
            min-width: 0;
            width: 0;
            background: var(--stage-bg);
            background-image:
                linear-gradient(to right, rgba(230, 213, 168, 0.18) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(230, 213, 168, 0.18) 1px, transparent 1px);
            background-size: 80px 80px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        body.studio-theme-dark .gallery-panel {
            background: var(--dark-bg);
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        .gallery-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 24px 16px;
            gap: 16px;
            border-bottom: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.72);
        }

        body.studio-theme-dark .gallery-head {
            background: rgba(14, 14, 16, 0.72);
            border-bottom-color: var(--dark-border);
        }

        .gallery-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 0 24px 24px;
        }

        /* image card 内部图占满方形 */
        .image-card .img-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: var(--bg-2);
            border-bottom: 1px solid var(--border);
            overflow: hidden;
        }

        body.studio-theme-dark .image-card .img-wrap {
            border-bottom-color: var(--dark-border);
        }

        .image-card .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .image-card .cloud-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: var(--stage-bg);
            border: 1px solid var(--border);
            padding: 2px 6px;
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--ink);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .image-card .cloud-badge img {
            width: 14px;
            height: 14px;
            object-fit: contain;
            display: block;
        }

        .image-meta .meta-actions .action-btn .pixel-icon {
            color: var(--ink);
        }

        body.studio-theme-dark .image-meta {
            background: var(--dark-surface);
            color: var(--dark-text);
        }

        body.studio-theme-dark .image-meta .meta-prompt {
            color: var(--dark-text);
        }

        body.studio-theme-dark .image-meta .meta-info {
            color: var(--dark-muted);
        }

        body.studio-theme-dark .image-meta .action-btn {
            background: var(--dark-surface);
            color: var(--dark-text);
        }

        body.studio-theme-dark .image-meta .action-btn:hover {
            background: var(--dark-elev);
        }

        body.studio-theme-dark .image-meta .action-btn .pixel-icon {
            color: var(--dark-text);
        }

        body.studio-theme-dark .image-card {
            border-color: var(--dark-border);
        }

        /* 空态 */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 160px);
            padding: 96px 24px;
            gap: 16px;
            color: var(--muted);
            text-align: center;
        }

        .empty-state .empty-preview {
            width: 168px;
            height: 168px;
            aspect-ratio: auto;
            border: 1px solid var(--border);
        }

        .empty-state .empty-copy {
            padding: 8px 12px;
            background: var(--bg-2);
            border: 1px solid var(--border);
        }

        body.studio-theme-dark .empty-state {
            color: var(--dark-muted);
        }

        body.studio-theme-dark .empty-state .empty-copy {
            background: var(--dark-elev);
            border-color: var(--dark-border);
        }

        /* Load more */
        .load-more {
            display: flex;
            justify-content: center;
            padding: 24px 0 8px;
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(15, 15, 15, 0.92);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 48px;
        }

        .lightbox.is-open {
            display: flex;
        }

        .lightbox-inner {
            position: relative;
            max-width: min(1100px, 90vw);
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .lightbox-img {
            max-width: 100%;
            max-height: 60vh;
            display: block;
            border: 1px solid var(--border);
        }

        .lightbox-actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 4px;
        }

        .lightbox-actions .action-btn {
            width: 32px;
            height: 32px;
            background: var(--ink);
            color: #fff;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 0;
        }

        .lightbox-actions .action-btn:hover {
            background: #000;
        }

        .lightbox-actions .action-btn .pixel-icon {
            color: #fff;
        }

        .lightbox-meta {
            width: 100%;
            background: var(--dark-elev);
            color: var(--dark-text);
            border: 1px solid var(--dark-border);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
        }

        .lightbox-meta .prompt-text {
            flex: 1;
            font-size: 14px;
            line-height: 1.5;
            max-height: 120px;
            overflow-y: auto;
            color: var(--dark-text);
        }

        .lightbox-meta .meta-side {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--dark-muted);
            white-space: nowrap;
        }

        /* 响应式：窄屏左面板缩短 */
        @media (max-width: 1280px) {
            .params-panel {
                width: 320px;
            }
        }

        @media (max-width: 900px) {
            .page-shell {
                flex-direction: column;
            }

            .params-panel {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border);
                max-height: 60vh;
            }
        }
    </style>
</head>

<body>

    <div class="page-shell">
        <!-- ============ 左侧：参数面板 ============ -->
        <aside class="params-panel">
            <!-- 页面段落黑标 -->
            <div class="panel-head">
                <div class="section-tag">
                    <span>Text to image</span>
                    <svg class="pixel-icon pixel-icon--sm"><use href="#chevron-down"/></svg>
                </div>
            </div>

            <!-- Prompt 输入 -->
            <div class="field">
                <label class="text-label" for="prompt">Prompt</label>
                <textarea id="prompt" class="textarea" rows="5" placeholder="Describe your vision..."></textarea>
            </div>

            <!-- 引擎源 -->
            <div class="field">
                <span class="text-label">Engine</span>
                <div class="engine-switch">
                    <label class="radio-row">
                        <input type="radio" name="engine" value="local" checked onchange="switchEngine('local')">
                        <span class="radio-box"></span>
                        <span>Local</span>
                    </label>
                    <label class="radio-row">
                        <input type="radio" name="engine" value="cloud" onchange="switchEngine('cloud')">
                        <span class="radio-box"></span>
                        <span>ModelScope</span>
                    </label>
                </div>
            </div>

            <!-- 宽高 -->
            <div class="field-row">
                <div class="field">
                    <label class="text-label" for="width">Width</label>
                    <div class="number-input">
                        <button type="button" class="num-btn" onclick="stepNumber('width', -64)" aria-label="decrease width">
                            <svg class="pixel-icon pixel-icon--sm"><use href="#minus"/></svg>
                        </button>
                        <input id="width" type="number" value="1024" min="256" max="2048" step="64">
                        <button type="button" class="num-btn" onclick="stepNumber('width', 64)" aria-label="increase width">
                            <svg class="pixel-icon pixel-icon--sm"><use href="#plus"/></svg>
                        </button>
                    </div>
                </div>
                <div class="field">
                    <label class="text-label" for="height">Height</label>
                    <div class="number-input">
                        <button type="button" class="num-btn" onclick="stepNumber('height', -64)" aria-label="decrease height">
                            <svg class="pixel-icon pixel-icon--sm"><use href="#minus"/></svg>
                        </button>
                        <input id="height" type="number" value="1024" min="256" max="2048" step="64">
                        <button type="button" class="num-btn" onclick="stepNumber('height', 64)" aria-label="increase height">
                            <svg class="pixel-icon pixel-icon--sm"><use href="#plus"/></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 状态 -->
            <div class="status-row is-idle" id="statusRow">
                <span class="pixel-dot-pulse" aria-hidden="true"><span></span><span></span><span></span></span>
                <span id="statusText">System ready</span>
            </div>

            <!-- Generate -->
            <button class="btn-primary panel-cta" id="mainGenBtn" type="button" onclick="handleRender()">
                <span id="btnText">Generate</span>
                <svg class="pixel-icon pixel-icon--sm"><use href="#chevron-right"/></svg>
            </button>
        </aside>

        <!-- ============ 右侧：图片网格 ============ -->
        <main class="gallery-panel">
            <div class="gallery-head">
                <div class="section-tag">
                    <span id="historyTag">History (0)</span>
                    <svg class="pixel-icon pixel-icon--sm"><use href="#chevron-down"/></svg>
                </div>
                <button class="btn-underline" type="button" onclick="loadHistory(0)">
                    <span>Refresh</span>
                    <svg class="pixel-icon pixel-icon--sm"><use href="#chevron-right"/></svg>
                </button>
            </div>

            <div class="gallery-scroll">
                <div id="masonry" class="image-grid"></div>

                <div id="emptyState" class="empty-state" style="display:none">
                    <div class="image-placeholder empty-preview" aria-hidden="true"></div>
                    <span class="text-mono empty-copy">No images yet</span>
                </div>

                <div class="load-more">
                    <button id="loadMoreTrigger" class="btn-underline" style="display:none" type="button"
                            onclick="loadHistory(1)">
                        <span>Load more</span>
                        <svg class="pixel-icon pixel-icon--sm"><use href="#chevron-right"/></svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- ============ Lightbox ============ -->
    <div id="lightbox" class="lightbox" onclick="handleOutsideClick(event)">
        <div class="lightbox-inner">
            <img id="lightboxImg" class="lightbox-img" alt="">
            <div class="lightbox-actions">
                <button class="action-btn" onclick="downloadImage()" aria-label="download">
                    <svg class="pixel-icon pixel-icon--sm"><use href="#download"/></svg>
                </button>
                <button class="action-btn" onclick="copyPrompt()" aria-label="copy prompt">
                    <svg class="pixel-icon pixel-icon--sm"><use href="#copy"/></svg>
                </button>
                <button class="action-btn" onclick="closeLightbox()" aria-label="close">
                    <svg class="pixel-icon pixel-icon--sm"><use href="#cross"/></svg>
                </button>
            </div>
            <div class="lightbox-meta">
                <p id="lightboxPrompt" class="prompt-text"></p>
                <span id="lightboxRes" class="meta-side">0×0</span>
            </div>
        </div>
    </div>

    <script>
        /* ====================== 基础工具 ====================== */
        function generateUUID() {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                try { return crypto.randomUUID(); } catch (e) { }
            }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        const CLIENT_ID = localStorage.getItem("client_id") || generateUUID();
        localStorage.setItem("client_id", CLIENT_ID);

        const MS_TOKEN_KEY = 'modelscope_api_token';
        const ENGINE_MODE_KEY = 'zimage_engine_mode';

        let allHistory = [];
        let currentIndex = 0;
        const PAGE_SIZE = 16;
        let isLoading = false;
        let currentEngine = 'local';

        /* ====================== WebSocket：新图广播 ====================== */
        const wsProto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const socket = new WebSocket(`${wsProto}//${window.location.host}/ws/stats`);
        socket.onmessage = (e) => {
            try {
                const msg = JSON.parse(e.data);
                if (msg.type === 'new_image' && msg.data?.type === 'zimage') {
                    if (!document.getElementById(`history-${msg.data.timestamp}`)) {
                        allHistory.unshift(msg.data);
                        renderImageCard(msg.data, true);
                        currentIndex++;
                        updateHistoryTag();
                    }
                }
            } catch (err) { }
        };

        /* ====================== 主题 postMessage 监听 ====================== */
        window.addEventListener('message', (event) => {
            if (event.data?.type === 'studio-theme' && window.StudioTheme) {
                window.StudioTheme.apply(event.data.theme);
            } else if (event.data?.type === 'cloud_status' || event.data?.type === 'task_status') {
                // 保留 cloud_status 接收（来源于父框架转发）
                const t = event.data.text || event.data.message || event.data.status;
                if (t) setStatus(t, 'busy');
            }
        });

        /* ====================== 引擎切换 ====================== */
        function switchEngine(mode) {
            currentEngine = mode;
            localStorage.setItem(ENGINE_MODE_KEY, mode);
            const btnText = document.getElementById('btnText');
            btnText.innerText = mode === 'local' ? 'Generate · Local' : 'Generate · Cloud';
            // 同步 radio 选中状态
            document.querySelectorAll('input[name="engine"]').forEach(r => {
                r.checked = (r.value === mode);
            });
        }

        // 初始化引擎
        const savedEngine = localStorage.getItem(ENGINE_MODE_KEY);
        if (savedEngine && (savedEngine === 'local' || savedEngine === 'cloud')) {
            switchEngine(savedEngine);
        } else {
            switchEngine('local');
        }

        /* ====================== number-input 步进 ====================== */
        function stepNumber(id, delta) {
            const input = document.getElementById(id);
            const v = parseInt(input.value || '0', 10) + delta;
            const min = parseInt(input.min || '0', 10);
            const max = parseInt(input.max || '99999', 10);
            input.value = Math.max(min, Math.min(max, v));
        }

        /* ====================== 状态条 ====================== */
        function setStatus(text, mode) {
            const row = document.getElementById('statusRow');
            const txt = document.getElementById('statusText');
            txt.innerText = text;
            row.classList.toggle('is-idle', mode !== 'busy');
        }

        function setLoading(loading) {
            const btn = document.getElementById('mainGenBtn');
            const text = document.getElementById('btnText');
            btn.disabled = loading;
            if (loading) {
                btn.classList.add('is-disabled');
                text.innerText = 'Rendering...';
                setStatus('Rendering · ' + (currentEngine === 'local' ? 'Local ComfyUI' : 'ModelScope cloud'), 'busy');
            } else {
                btn.classList.remove('is-disabled');
                text.innerText = currentEngine === 'local' ? 'Generate · Local' : 'Generate · Cloud';
                setStatus('System ready', 'idle');
            }
        }

        /* ====================== 渲染入口 ====================== */
        async function handleRender() {
            const prompt = document.getElementById('prompt').value.trim();
            if (!prompt) {
                alert("Please enter a prompt");
                return;
            }
            if (currentEngine === 'local') {
                await runLocalTask(prompt);
            } else {
                await runCloudTask(prompt);
            }
        }

        /* ====================== ModelScope 云端 ====================== */
        // API: POST /generate  body: { prompt, api_key, resolution }
        // api_key is optional when the backend has MODELSCOPE_API_KEY configured.
        async function runCloudTask(prompt) {
            let apiKey = localStorage.getItem(MS_TOKEN_KEY);
            let hasBackendToken = false;
            if (!apiKey) {
                try {
                    const res = await fetch('/api/config/token');
                    const data = await res.json();
                    hasBackendToken = Boolean(data.has_token);
                } catch (e) { }
            }
            if (!apiKey && !hasBackendToken) {
                alert("ModelScope Token Required. Set MODELSCOPE_API_KEY in API/.env or add a local ModelScope token.");
                return;
            }

            setLoading(true);
            const placeholder = createPlaceholder();
            document.getElementById('masonry').prepend(placeholder);
            toggleEmpty();

            try {
                const res = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: prompt,
                        api_key: apiKey || "",
                        resolution: `${document.getElementById('width').value}x${document.getElementById('height').value}`
                    })
                });
                const data = await res.json();
                placeholder.remove();
                if (res.ok && data.url) {
                    renderImageCard({ timestamp: Date.now(), prompt, images: [data.url], type: 'cloud' }, true);
                    allHistory.unshift({ timestamp: Date.now(), prompt, images: [data.url], type: 'cloud' });
                    currentIndex++;
                    updateHistoryTag();
                } else {
                    throw new Error(data.detail?.errors?.message || data.detail || "Cloud Error");
                }
            } catch (e) {
                placeholder.remove();
                alert(e.message || 'Cloud render failed');
            } finally {
                setLoading(false);
                toggleEmpty();
            }
        }

        /* ====================== 本地 ComfyUI ====================== */
        // API: POST /api/generate  body: { prompt, width, height, type, client_id }
        async function runLocalTask(prompt) {
            setLoading(true);
            const placeholder = createPlaceholder();
            document.getElementById('masonry').prepend(placeholder);
            toggleEmpty();

            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt,
                        width: parseInt(document.getElementById('width').value),
                        height: parseInt(document.getElementById('height').value),
                        type: "zimage",
                        client_id: CLIENT_ID
                    })
                });
                const data = await res.json();
                placeholder.remove();
                if (data.images?.length > 0) {
                    renderImageCard(data, true);
                    allHistory.unshift(data);
                    currentIndex++;
                    updateHistoryTag();
                }
            } catch (e) {
                placeholder.remove();
                alert("Local render failed");
            } finally {
                setLoading(false);
                toggleEmpty();
            }
        }

        /* ====================== 渲染占位 + 卡片 ====================== */
        // §16.3 像素棋盘占位 + 三连脉冲
        function createPlaceholder() {
            const wrap = document.createElement('div');
            wrap.className = 'image-card';
            wrap.innerHTML = `
                <div class="image-placeholder">
                    <div class="section-tag">
                        <span>Rendering</span>
                        <span class="pixel-dot-pulse" style="color: var(--primary)" aria-hidden="true">
                            <span></span><span></span><span></span>
                        </span>
                    </div>
                </div>
            `;
            return wrap;
        }

        // §16.1 image-card + image-meta + 4 个 action button
        function renderImageCard(data, isNew = false) {
            if (document.getElementById(`history-${data.timestamp}`)) return;
            const masonry = document.getElementById('masonry');

            const card = document.createElement('div');
            card.id = `history-${data.timestamp}`;
            card.className = 'image-card';

            const url = data.images[0];
            const seed = data.seed || data.params?.seed || '—';
            const w = data.width || 1024;
            const h = data.height || 1024;
            const ts = formatTimestamp(data.timestamp);
            const promptText = (data.prompt || '').replace(/"/g, '&quot;');
            const isCloud = data.type === 'cloud';

            card.innerHTML = `
                <div class="img-wrap" onclick="openLightbox('${url}', this.dataset.prompt)" data-prompt="${promptText}" style="cursor:zoom-in">
                    <img src="${url}" loading="lazy" alt="">
                    ${isCloud ? `<span class="cloud-badge"><img src="/static/modelscope.gif" alt=""><span>cloud</span></span>` : ''}
                </div>
                <div class="image-meta">
                    <div class="meta-text">
                        <div class="meta-prompt" title="${promptText}">${data.prompt || ''}</div>
                        <div class="meta-info">${w}×${h} · seed ${seed} · ${ts}</div>
                    </div>
                    <div class="meta-actions">
                        <button class="action-btn" type="button" title="Download" onclick="downloadCard('${url}', event)">
                            <svg class="pixel-icon pixel-icon--sm"><use href="#download"/></svg>
                        </button>
                        <button class="action-btn" type="button" title="Copy prompt" onclick="copyText(this, '${promptText}', event)">
                            <svg class="pixel-icon pixel-icon--sm"><use href="#copy"/></svg>
                        </button>
                        <button class="action-btn" type="button" title="Send to canvas" onclick="sendToCanvas('${url}', event)">
                            <svg class="pixel-icon pixel-icon--sm"><use href="#send"/></svg>
                        </button>
                        <button class="action-btn" type="button" title="Delete" onclick="deleteHistoryItem('${data.timestamp}', event)">
                            <svg class="pixel-icon pixel-icon--sm"><use href="#trash"/></svg>
                        </button>
                    </div>
                </div>
            `;

            if (isNew) masonry.prepend(card);
            else masonry.appendChild(card);
        }

        function formatTimestamp(ts) {
            if (!ts) return '';
            const d = new Date(typeof ts === 'number' && ts < 1e12 ? ts * 1000 : ts);
            const pad = n => String(n).padStart(2, '0');
            return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        function updateHistoryTag() {
            const tag = document.getElementById('historyTag');
            if (tag) tag.innerText = `History (${allHistory.length})`;
        }

        function toggleEmpty() {
            const grid = document.getElementById('masonry');
            const empty = document.getElementById('emptyState');
            if (!grid || !empty) return;
            empty.style.display = grid.children.length === 0 ? 'flex' : 'none';
        }

        /* ====================== 历史加载 ====================== */
        async function loadHistory(page = 0) {
            if (isLoading) return;
            const trigger = document.getElementById('loadMoreTrigger');

            try {
                isLoading = true;
                if (page === 0) {
                    allHistory = [];
                    document.getElementById('masonry').innerHTML = '';
                    currentIndex = 0;
                    const res = await fetch('/api/history?type=zimage');
                    allHistory = await res.json();
                }
                const nextData = allHistory.slice(currentIndex, currentIndex + PAGE_SIZE);
                nextData.forEach(item => renderImageCard(item));
                currentIndex += nextData.length;

                if (currentIndex >= allHistory.length) {
                    trigger.style.display = 'none';
                } else {
                    trigger.style.display = 'inline-flex';
                }
                updateHistoryTag();
                toggleEmpty();
            } catch (e) {
                console.error(e);
            } finally {
                isLoading = false;
            }
        }

        /* ====================== 卡片操作 ====================== */
        async function deleteHistoryItem(timestamp, event) {
            event.stopPropagation();
            try {
                const res = await fetch('/api/history/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ timestamp: typeof timestamp === 'string' ? Number(timestamp) : timestamp })
                });
                if ((await res.json()).success) {
                    const card = document.getElementById(`history-${timestamp}`);
                    if (card) card.remove();
                    allHistory = allHistory.filter(h => String(h.timestamp) !== String(timestamp));
                    updateHistoryTag();
                    toggleEmpty();
                }
            } catch (e) { }
        }

        function downloadCard(url, event) {
            event.stopPropagation();
            const a = document.createElement('a');
            a.href = url;
            a.download = `FS-${Date.now()}.png`;
            a.click();
        }

        function copyText(btn, text, event) {
            event.stopPropagation();
            if (!navigator.clipboard) return;
            navigator.clipboard.writeText(text).catch(() => { });
        }

        function sendToCanvas(url, event) {
            event.stopPropagation();
            // 通过父框架转发到 canvas iframe
            try {
                window.parent.postMessage({ type: 'send-to-canvas', url }, '*');
            } catch (e) { }
        }

        /* ====================== Lightbox ====================== */
        function openLightbox(url, prompt) {
            const img = document.getElementById('lightboxImg');
            const resDisplay = document.getElementById('lightboxRes');
            resDisplay.innerText = '...';
            img.src = url;
            img.onload = () => {
                resDisplay.innerText = `${img.naturalWidth}×${img.naturalHeight}`;
            };
            document.getElementById('lightboxPrompt').innerText = prompt || '';
            document.getElementById('lightbox').classList.add('is-open');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('is-open');
            document.body.style.overflow = '';
        }

        function handleOutsideClick(e) {
            if (e.target.id === 'lightbox') closeLightbox();
        }

        function downloadImage() {
            const a = document.createElement('a');
            a.href = document.getElementById('lightboxImg').src;
            a.download = `FS-${Date.now()}.png`;
            a.click();
        }

        function copyPrompt() {
            const p = document.getElementById('lightboxPrompt').innerText;
            if (navigator.clipboard) navigator.clipboard.writeText(p).catch(() => { });
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });

        /* ====================== 队列状态轮询 ====================== */
        window.addEventListener('DOMContentLoaded', () => {
            loadHistory(0);

            setInterval(async () => {
                try {
                    const res = await fetch("/api/queue_status?client_id=" + encodeURIComponent(CLIENT_ID));
                    const data = await res.json();
                    if (data.total > 0) {
                        setStatus(`Queueing ${data.position}/${data.total}`, 'busy');
                    } else if (!document.getElementById('mainGenBtn').disabled) {
                        setStatus('System ready', 'idle');
                    }
                } catch (e) { }
            }, 3000);
        });
    </script>
</body>

</html>
