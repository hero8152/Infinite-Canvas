name: Build macOS App

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x86_64, arm64]
        include:
          - arch: x86_64
            name: Intel
          - arch: arm64
            name: Apple Silicon

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build App (${{ matrix.name }})
        run: |
          ICON_PARAM=""
          if [ -f "static/images/icon.icns" ]; then
            ICON_PARAM="--icon static/images/icon.icns"
          fi

          pyinstaller \
            --name "Infinite Canvas" \
            --windowed \
            --onedir \
            $ICON_PARAM \
            --add-data "static:static" \
            --add-data "workflows:workflows" \
            --add-data "tools:tools" \
            --add-data "VERSION:." \
            --add-data "requirements.txt:." \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            --noconfirm \
            --clean \
            main.py

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "Infinite Canvas" \
            -srcfolder "dist/Infinite Canvas" \
            -ov \
            -format UDZO \
            "dist/Infinite Canvas-${{ matrix.arch }}.dmg"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Infinite-Canvas-macOS-${{ matrix.arch }}
          path: dist/Infinite Canvas-${{ matrix.arch }}.dmg
          retention-days: 30

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: dist/Infinite Canvas-${{ matrix.arch }}.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
